<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cercle — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#24221D; --muted:#6B6558; --paper:#F7F5EF; --surface:#FFFFFF;
  --border:#E4E0D3; --primary:#C2540A; --primary-light:#E07C2E; --primary-dark:#7A3607;
  --gold:#E8A33D; --gold-light:#F5C878; --danger:#B3452C; --success:#3F7D52;
  --shadow: 0 1px 2px rgba(36,34,29,.06), 0 4px 16px rgba(36,34,29,.06);
  color-scheme: light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;}
button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}
a{color:inherit;}

.login-shell{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr;}
.login-brandpanel{
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
  color:#fff; padding:56px 52px; display:flex; flex-direction:column; justify-content:center; gap:20px;
  position:relative; overflow:hidden;
}
.login-brandpanel::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 88% 8%, rgba(201,150,43,.30), transparent 45%), radial-gradient(circle at 8% 94%, rgba(255,255,255,.08), transparent 40%);
}
.login-brand-seal{
  width:68px; height:68px; border-radius:18px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 14px 28px rgba(0,0,0,.28);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  color:var(--primary-dark); position:relative; z-index:1; overflow:hidden;
}
.login-brand-seal img{width:100%;height:100%;object-fit:cover;border-radius:18px;}
.login-brand-name{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.15; position:relative; z-index:1;}
.login-brand-sigle{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#D9E4D6; margin-top:4px; position:relative; z-index:1;}
.login-brand-desc{font-size:14px; line-height:1.65; color:#E7EFE6; max-width:420px; position:relative; z-index:1;}
.login-brand-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5; color:var(--gold-light);
  max-width:420px; position:relative; z-index:1; border-left:2px solid var(--gold); padding-left:12px;
}
.login-brand-values{display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1;}
.value-pill{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:rgba(255,255,255,.12); color:#EAF0E8; border:1px solid rgba(255,255,255,.18);
}
.login-brand-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:#C9D6C9; position:relative; z-index:1; margin-top:auto; padding-top:18px;
}
.login-formpanel{background:var(--paper); display:flex; align-items:center; justify-content:center; padding:32px;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:36px 32px;}
.login-title{font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin-bottom:2px;}
.login-sub{font-size:12.5px; color:var(--muted); margin-bottom:26px;}
.field{margin-bottom:14px;}
.field label{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; display:block;}
.input{border:1px solid var(--border); border-radius:8px; padding:8px 11px; font-size:13.5px; width:100%; background:var(--surface); color:var(--ink);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:7px; border:1px solid transparent; padding:10px 14px; font-size:13.5px; font-weight:600; transition:all .12s ease; width:100%;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.login-switch{margin-top:16px; text-align:center; font-size:12.5px; color:var(--muted);}
.link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; padding:0; text-decoration:underline;}
.link-btn:hover{color:var(--primary-light);}
.error-msg{color:var(--danger); font-size:12.5px; margin-bottom:12px;}
.hint-msg{color:var(--muted); font-size:11.5px; margin-top:14px; line-height:1.6;}
.hidden{display:none !important;}

@media(max-width:860px){
  .login-shell{grid-template-columns:1fr; grid-auto-rows:min-content;}
  .login-brandpanel{padding:36px 28px; gap:14px;}
  .login-brand-name{font-size:24px;}
  .login-brand-desc{display:none;}
  .login-brand-badge{display:none;}
  .login-formpanel{padding:28px 20px 44px;}
}
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-brandpanel">
    <div class="login-brand-seal" id="brandSeal">C</div>
    <div>
      <div class="login-brand-name" id="brandName">Cercle</div>
      <div class="login-brand-sigle" id="brandSigle"></div>
    </div>
    <div class="login-brand-desc" id="brandDesc"></div>
    <div class="login-brand-motto hidden" id="brandMotto"></div>
    <div class="login-brand-values" id="brandValues"></div>
    <div class="login-brand-badge">⬡ Gestion de groupe</div>
  </div>

  <div class="login-formpanel">
    <form class="login-card" id="loginForm">
      <div class="login-title">Connexion</div>
      <div class="login-sub" id="loginSub">Accédez à votre espace de gestion</div>
      <div class="field"><label>Nom d'utilisateur</label><input class="input" id="loginUsername" autofocus required></div>
      <div class="field"><label>Mot de passe</label><input class="input" type="password" id="loginPassword" required></div>
      <div class="error-msg hidden" id="loginError"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Se connecter</button>
      <div class="login-switch">Nouveau membre ? <button type="button" class="link-btn" id="showRegister">Créer mon profil</button></div>
    </form>

    <form class="login-card hidden" id="registerForm">
      <div class="login-title">Créer mon profil</div>
      <div class="login-sub">Réservé aux membres — un administrateur pourra ensuite ajuster votre rôle et vos accès.</div>
      <div class="two-col">
        <div class="field"><label>Prénom</label><input class="input" id="regPrenom" required></div>
        <div class="field"><label>Nom</label><input class="input" id="regNom" required></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Téléphone</label><input class="input" id="regTelephone"></div>
        <div class="field"><label>Email (optionnel)</label><input class="input" type="email" id="regEmail"></div>
      </div>
      <div class="field"><label>Nom d'utilisateur</label><input class="input" id="regUsername" required></div>
      <div class="two-col">
        <div class="field"><label>Mot de passe</label><input class="input" type="password" id="regPassword" required></div>
        <div class="field"><label>Confirmer</label><input class="input" type="password" id="regPassword2" required></div>
      </div>
      <div class="error-msg hidden" id="registerError"></div>
      <button class="btn btn-primary" type="submit" id="registerBtn">Créer mon profil et me connecter</button>
      <div class="login-switch">Déjà un compte ? <button type="button" class="link-btn" id="showLogin">Se connecter</button></div>
      <div class="hint-msg">Le mot de passe doit contenir au moins 6 caractères.</div>
    </form>
  </div>
</div>

<script src="supabase-config.js"></script>
<script>
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const loginError = document.getElementById('loginError');
const registerError = document.getElementById('registerError');

document.getElementById('showRegister').onclick = () => {
  loginForm.classList.add('hidden');
  registerForm.classList.remove('hidden');
};
document.getElementById('showLogin').onclick = () => {
  registerForm.classList.add('hidden');
  loginForm.classList.remove('hidden');
};

function showError(el, msg){ el.textContent = msg; el.classList.remove('hidden'); }
function hideError(el){ el.classList.add('hidden'); }

// Redirige directement vers l'app si une session valide existe déjà.
cercleSupabase.auth.getSession().then(({data}) => {
  if (data && data.session) window.location.href = 'index.html';
});

// Charge l'identité de l'association (branding public, avant connexion).
(async () => {
  try {
    const { data, error } = await cercleSupabase.from('settings').select('data').eq('id', 'main').single();
    if (error || !data) return;
    const s = data.data || {};
    if (s.nomAssociation) {
      document.getElementById('brandName').textContent = s.nomAssociation;
      document.getElementById('brandSeal').textContent = s.nomAssociation.slice(0,1);
      document.title = 'Cercle — ' + s.nomAssociation;
      document.getElementById('loginSub').textContent = 'Accédez à votre espace de gestion — ' + s.nomAssociation;
    }
    if (s.logo) document.getElementById('brandSeal').innerHTML = '<img src="'+s.logo+'" alt="Logo">';
    if (s.sigle) document.getElementById('brandSigle').textContent = s.sigle;
    if (s.description) document.getElementById('brandDesc').textContent = s.description;
    if (s.motto) {
      const m = document.getElementById('brandMotto');
      m.textContent = '« ' + s.motto + ' »';
      m.classList.remove('hidden');
    }
    if (s.valeurs) {
      const wrap = document.getElementById('brandValues');
      s.valeurs.split(',').map(v=>v.trim()).filter(Boolean).forEach(v=>{
        const span = document.createElement('span');
        span.className = 'value-pill';
        span.textContent = v;
        wrap.appendChild(span);
      });
    }
  } catch(e) { /* branding facultatif, on continue sans */ }
})();

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError(loginError);
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Connexion…';
  const { error } = await cercleSupabase.auth.signInWithPassword({
    email: usernameToEmail(username),
    password
  });
  btn.disabled = false; btn.textContent = 'Se connecter';
  if (error) {
    showError(loginError, "Identifiants invalides ou compte désactivé.");
    return;
  }
  window.location.href = 'index.html';
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError(registerError);
  const prenom = document.getElementById('regPrenom').value.trim();
  const nom = document.getElementById('regNom').value.trim();
  const telephone = document.getElementById('regTelephone').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const password2 = document.getElementById('regPassword2').value;

  if (!prenom || !nom) { showError(registerError, 'Merci de renseigner votre prénom et votre nom.'); return; }
  if (!username) { showError(registerError, "Merci de choisir un nom d'utilisateur."); return; }
  if (password.length < 6) { showError(registerError, 'Le mot de passe doit contenir au moins 6 caractères.'); return; }
  if (password !== password2) { showError(registerError, 'Les mots de passe ne correspondent pas.'); return; }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true; btn.textContent = 'Création…';

  const { data: signUpData, error: signUpError } = await cercleSupabase.auth.signUp({
    email: usernameToEmail(username),
    password
  });

  if (signUpError) {
    btn.disabled = false; btn.textContent = 'Créer mon profil et me connecter';
    if (String(signUpError.message||'').toLowerCase().includes('already registered')) {
      showError(registerError, "Ce nom d'utilisateur est déjà pris, merci d'en choisir un autre.");
    } else {
      showError(registerError, "Impossible de créer le compte : " + signUpError.message);
    }
    return;
  }

  if (!signUpData.session) {
    btn.disabled = false; btn.textContent = 'Créer mon profil et me connecter';
    showError(registerError, "Compte créé mais non connecté automatiquement — vérifie que la confirmation par email est désactivée dans Supabase (Authentication > Providers > Email).");
    return;
  }

  const userId = signUpData.user.id;
  const membreId = 'mem_' + userId.slice(0,8) + '_' + Date.now().toString(36).slice(-4);

  const { error: membreErr } = await cercleSupabase.from('membres').insert({
    id: membreId,
    data: {
      matricule: '', nom, prenom, fonction: 'Membre', departement: '', statut: 'actif',
      telephone, email, adresse: '', dateAdhesion: new Date().toISOString().slice(0,10), photo: ''
    }
  });
  const { error: userErr } = await cercleSupabase.from('app_users').insert({
    id: userId,
    username,
    data: { role: 'membre', poste: 'membre', membreId, actif: true, isAdminTotal: false, modulesAccess: {} }
  });

  btn.disabled = false; btn.textContent = 'Créer mon profil et me connecter';
  if (membreErr || userErr) {
    showError(registerError, "Compte créé, mais une erreur est survenue lors de l'enregistrement du profil : " + (membreErr||userErr).message);
    return;
  }
  window.location.href = 'index.html';
});
</script>
</body>
</html>
