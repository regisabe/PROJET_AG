<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AG</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2540A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AG">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<style>
:root{
  --ink:#24221D; --muted:#6B6558; --paper:#F7F5EF; --surface:#FFFFFF;
  --border:#E4E0D3; --primary:#C2540A; --primary-light:#E07C2E; --primary-dark:#7A3607;
  --gold:#E8A33D; --gold-light:#F5C878; --danger:#B3452C; --success:#3F7D52;
  --shadow: 0 1px 2px rgba(36,34,29,.06), 0 4px 16px rgba(36,34,29,.06);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#EDE9DD; --muted:#A7A090; --paper:#181712; --surface:#211F19;
  --border:#33312A; --primary:#E07C2E; --primary-light:#F0A35A; --primary-dark:#5C2A05;
  --gold:#F0B24E; --gold-light:#F5C878; --danger:#D96A4C; --success:#5AA173;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-light);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
a{color:inherit;}

/* ---------- Layout ---------- */
#root{min-height:100vh;}
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:230px; background:var(--primary-dark); color:#EFEAD9; flex-shrink:0;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-brand{padding:22px 20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-seal{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #7A3607 100%);
  display:flex;align-items:center;justify-content:center; color:var(--primary-dark); font-weight:700; font-family:'Fraunces',serif; font-size:15px;
  flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.brand-text .name{font-family:'Fraunces',serif; font-size:17px; font-weight:600; line-height:1.1;}
.brand-text .sub{font-size:10.5px; color:#B9C4B9; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}
.nav{flex:1; overflow-y:auto; padding:14px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:13.5px; color:#D9D3C0; text-decoration:none; border:none; background:none; width:100%; text-align:left;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff; box-shadow: inset 3px 0 0 var(--gold);}
.nav-icon{width:16px; text-align:center; opacity:.9; font-size:14px;}
.nav-badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px;
  border-radius:99px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; margin-left:auto;
}
.bottom-nav-item{position:relative;}
.bn-badge{
  position:absolute; top:2px; right:8px; min-width:15px; height:15px; padding:0 3px;
  display:flex; align-items:center; justify-content:center; border-radius:99px; background:var(--danger);
  color:#fff; font-size:9px; font-weight:700; line-height:1;
}
.sidebar-footer{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#AEB8AE;}
.user-chip{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:600; color:#fff; overflow:hidden; flex-shrink:0;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.logout-btn{background:none;border:none;color:#D9D3C0; font-size:12px; text-decoration:underline; padding:0;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--surface); padding:14px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  border-bottom:1px solid var(--border);
  position:relative;
}
.topbar::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px;
  background:linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
.topbar-brand-icon{font-size:22px; line-height:1;}
.page-title{font-size:19px; font-weight:600; display:flex; align-items:center; gap:9px;}
.page-eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700;}
.page-role{font-size:12px; color:var(--muted); margin-top:1px;}
.content{padding:24px 28px 60px; flex:1;}

.topbar-right{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.clock-chip{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); font-weight:600;
  letter-spacing:.02em;
}
.theme-toggle{
  width:40px; height:32px; border-radius:99px; border:1px solid var(--border); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--gold);}
.avatar-menu-wrap{position:relative; flex-shrink:0;}
.avatar-trigger{
  display:flex; align-items:center; gap:6px; background:none; border:none; padding:2px; border-radius:99px;
}
.avatar-circle{
  width:36px; height:36px; border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
  overflow:hidden;
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}
.avatar-dropdown .head{display:flex; align-items:center; gap:10px;}
.avatar-dropdown .head-avatar{width:38px;height:38px;border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light)); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; overflow:hidden;}
.avatar-dropdown .head-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-photo-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.profile-photo-preview{width:64px;height:64px;border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light)); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:22px; flex-shrink:0; overflow:hidden;}
.profile-photo-preview img{width:100%;height:100%;object-fit:cover;}
.avatar-caret{font-size:10px; color:var(--muted);}
.avatar-dropdown{
  position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.16); min-width:190px; z-index:40; overflow:hidden;
  animation:dropIn .12s ease;
}
@keyframes dropIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
.avatar-dropdown .head{padding:12px 14px; border-bottom:1px solid var(--border);}
.avatar-dropdown .head .u{font-weight:700; font-size:13.5px;}
.avatar-dropdown .head .r{font-size:11.5px; color:var(--muted); margin-top:1px;}
.avatar-dropdown button{
  display:block; width:100%; text-align:left; padding:10px 14px; font-size:13px; background:none; border:none; color:var(--danger); font-weight:600;
}
.avatar-dropdown button:hover{background:var(--paper);}
.avatar-menu-overlay{position:fixed; inset:0; z-index:35;}

/* ---------- Generic UI ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:7px; border:1px solid transparent;
  padding:8px 14px; font-size:13px; font-weight:600; transition:all .12s ease;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold); color:#2B2004;}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-danger{background:transparent; color:var(--danger); border-color:#E7C7BA;}
.btn-danger:hover{background:#FBEDE7;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}
.card-pad{padding:20px;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.stat-card .value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px; color:var(--primary-dark);}
.stat-card .delta{font-size:11.5px; color:var(--muted); margin-top:4px;}
.stat-card .accent-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; letter-spacing:.02em;}
.badge-green{background:#E4F1E6; color:var(--success);}
.badge-red{background:#FBEAE3; color:var(--danger);}
.badge-gold{background:#FBF1D9; color:#8A6A16;}
.badge-gray{background:#EEEBE1; color:var(--muted);}
.badge-blue{background:#E3EBF6; color:#2F5FA8;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:2px solid var(--border);}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#FBFAF6;}
.table-wrap{overflow-x:auto;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.search-input{
  border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; min-width:220px; background:var(--surface);
}
.select, .input, .textarea{
  border:1px solid var(--border); border-radius:8px; padding:8px 11px; font-size:13.5px; width:100%; background:var(--surface); color:var(--ink);
}
.textarea{resize:vertical; min-height:70px;}
label.field-label{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; display:block;}
.field{margin-bottom:14px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(24,22,17,.45); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px; backdrop-filter:blur(1px);
}
.modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.icon-btn{background:none;border:none;font-size:18px;color:var(--muted); line-height:1;}
.icon-btn:hover{color:var(--ink);}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}
.empty-state .title{font-weight:600; color:var(--ink); margin-bottom:4px;}

.avatar-photo{width:38px;height:38px;border-radius:50%; object-fit:cover; background:var(--border); flex-shrink:0;}
.avatar-fallback{width:38px;height:38px;border-radius:50%; background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;}

/* Membership card - signature element */
.member-card{
  width:340px; border-radius:16px; padding:0; position:relative; overflow:hidden;
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
  color:#fff; box-shadow:0 12px 30px rgba(18,53,48,.35);
}
.member-card::before{
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(circle at 90% 8%, rgba(201,150,43,.28), transparent 45%);
}
.member-card-top{padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:flex-start; position:relative;}
.member-card-org{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#C9D6C9;}
.member-card-org b{color:#fff;}
.member-card-seal{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.member-card-body{display:flex; gap:14px; padding:6px 18px 14px; position:relative;}
.member-card-photo{width:64px;height:64px;border-radius:10px; object-fit:cover; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); flex-shrink:0;}
.member-card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.15;}
.member-card-role{font-size:11.5px; color:#D9E4D6; margin-top:2px;}
.member-card-mat{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-light); margin-top:6px; letter-spacing:.03em;}
.member-card-strip{
  display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:rgba(0,0,0,.18);
  border-top:1px dashed rgba(255,255,255,.35); position:relative;
}
.member-card-strip .stub-dot{position:absolute; width:14px;height:14px;border-radius:50%; background:var(--paper); top:-7px;}
.member-card-strip .stub-dot.l{left:-7px;} .member-card-strip .stub-dot.r{right:-7px;}
.member-card-status{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#D9E4D6;}
.member-card img.qr{width:52px;height:52px; border-radius:6px; background:#fff; padding:3px;}

/* Receipt - carnet à souche style */
.receipt{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  position:relative; padding:22px 24px;
}
.receipt::before, .receipt::after{
  content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--paper); border:1px solid var(--border);
  top:50%; transform:translateY(-50%);
}
.receipt::before{left:-9px;} .receipt::after{right:-9px;}
.receipt-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px dashed var(--border); padding-bottom:12px; margin-bottom:12px;}
.receipt-no{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); font-weight:600;}
.receipt-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
.receipt-row .k{color:var(--muted);}
.receipt-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:2px dashed var(--border); font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--primary-dark);}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-fill{width:100%; border-radius:5px 5px 0 0; background:var(--primary); position:relative; min-height:3px;}
.bar-fill.gold{background:var(--gold);}
.bar-label{font-size:10.5px; color:var(--muted); text-align:center;}
.bar-val{font-size:11px; font-weight:600; color:var(--ink);}

.progress-track{width:100%; height:8px; border-radius:99px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--success); border-radius:99px;}

.login-shell{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr;}
.login-brandpanel{
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
  color:#fff; padding:56px 52px; display:flex; flex-direction:column; justify-content:center; gap:20px;
  position:relative; overflow:hidden;
}
.login-brandpanel::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 88% 8%, rgba(201,150,43,.30), transparent 45%), radial-gradient(circle at 8% 94%, rgba(255,255,255,.08), transparent 40%);
}
.login-brand-seal{
  width:68px; height:68px; border-radius:18px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 14px 28px rgba(0,0,0,.28);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  color:var(--primary-dark); position:relative; z-index:1;
}
.login-brand-name{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.15; position:relative; z-index:1;}
.login-brand-sigle{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#D9E4D6; margin-top:4px; position:relative; z-index:1;}
.login-brand-desc{font-size:14px; line-height:1.65; color:#E7EFE6; max-width:420px; position:relative; z-index:1;}
.login-brand-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5; color:var(--gold-light);
  max-width:420px; position:relative; z-index:1; border-left:2px solid var(--gold); padding-left:12px;
}
.login-brand-values{display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1;}
.value-pill{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:rgba(255,255,255,.12); color:#EAF0E8; border:1px solid rgba(255,255,255,.18);
}
.login-brand-meta{display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:1;}
.login-brand-meta-row{display:flex; align-items:center; gap:11px; font-size:13px; color:#EAF0E8;}
.login-brand-meta-row .ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.13); display:flex;align-items:center;justify-content:center; font-size:13px; flex-shrink:0;}
.login-brand-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:#C9D6C9; position:relative; z-index:1; margin-top:auto; padding-top:18px;
}
.dashboard-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:14.5px; color:var(--primary-dark); margin-top:6px;
  border-left:2px solid var(--gold); padding-left:11px;
}
.dashboard-values{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.value-pill-light{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:var(--surface); border:1px solid var(--border); color:var(--muted);
}

.login-formpanel{background:var(--paper); display:flex; align-items:center; justify-content:center; padding:32px;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:36px 32px;}

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef} = React;

/* ---------------------------- Helpers ---------------------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (d) => { if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n, devise) => (Number(n)||0).toLocaleString('fr-FR') + ' ' + (devise || 'FCFA');

/* ---------------------------- Couche de données Supabase ----------------------------
   Toutes les tables (sauf app_users et settings) stockent leurs lignes sous la forme
   {id, data}. On garde ici la même interface que l'ancien stockage local (LS.get/LS.set)
   pour ne pas avoir à réécrire chaque module : DB.list(table) charge un tableau
   d'objets {id, ...data}, DB.sync(table, prevList, nextList) calcule la différence et
   pousse les insert/update/delete vers Supabase. */
const TABLES_LISTES = ['membres','cotisation_types','paiements','activites','documents'];

const DB = {
  async list(table){
    const { data, error } = await cercleSupabase.from(table).select('id, data');
    if(error){ console.error('DB.list', table, error); return []; }
    return (data||[]).map(row => ({...row.data, id: row.id}));
  },
  async getSettings(){
    const { data, error } = await cercleSupabase.from('settings').select('data').eq('id','main').single();
    if(error || !data) return {nomAssociation:'Cercle', devise:'FCFA'};
    return data.data || {};
  },
  async setSettings(v){
    await cercleSupabase.from('settings').upsert({ id:'main', data: v, updated_at: new Date().toISOString() });
  },
  async sync(table, prevList, nextList){
    const prevIds = new Set((prevList||[]).map(x=>x.id));
    const nextIds = new Set((nextList||[]).map(x=>x.id));
    const toDelete = [...prevIds].filter(id => !nextIds.has(id));
    const toUpsert = (nextList||[]).map(item => {
      const {id, ...rest} = item;
      return { id: id || uid(table.slice(0,3)), data: rest, updated_at: new Date().toISOString() };
    });
    // On vérifie désormais l'erreur renvoyée par Supabase (ex. RLS qui refuse
    // la suppression) : avant, l'échec était silencieux et l'élément
    // "supprimé" localement revenait dès le prochain rechargement des données.
    if(toDelete.length){
      const { error } = await cercleSupabase.from(table).delete().in('id', toDelete);
      if(error){ console.error('DB.sync delete', table, error); throw error; }
    }
    if(toUpsert.length){
      const { error } = await cercleSupabase.from(table).upsert(toUpsert);
      if(error){ console.error('DB.sync upsert', table, error); throw error; }
    }
  }
};

/* Upload d'un fichier (photo, média de publication, document) vers Supabase Storage.
   Remplace l'ancien encodage base64 en localStorage : on stocke désormais une URL. */
async function uploadToStorage(file, folder){
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = folder + '/' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const { error } = await cercleSupabase.storage.from('cercle-media').upload(path, file);
  if(error){ console.error('uploadToStorage', error); throw error; }
  const { data } = cercleSupabase.storage.from('cercle-media').getPublicUrl(path);
  return data.publicUrl;
}

const ROLES = [
  {id:'admin', label:'Administrateur'},
  {id:'responsable', label:'Responsable'},
  {id:'tresorier', label:'Trésorier'},
  {id:'secretaire', label:'Secrétaire'},
  {id:'membre', label:'Membre'},
];
const roleLabel = (id) => (ROLES.find(r=>r.id===id)||{}).label || id;

/* Postes du bureau (organigramme de l'association) — un simple titre affiché sur
   le compte utilisateur, en plus du rôle d'accès. "Membre" = aucun poste particulier. */
const POSTES = [
  {id:'membre', label:'Membre'},
  {id:'president', label:'Président(e)'},
  {id:'vice_president', label:'Vice-président(e)'},
  {id:'conseiller', label:'Conseiller(ère)'},
  {id:'organisateur', label:'Organisateur(trice)'},
  {id:'cadre_communication', label:'Cadre Communication'},
  {id:'tresorier', label:'Trésorier(ère)'},
  {id:'secretaire', label:'Secrétaire'},
  {id:'porte_parole', label:'Porte-parole'},
  {id:'service_securite', label:'Service Sécurité'},
];
const posteLabel = (id) => (POSTES.find(p=>p.id===id)||{}).label || 'Membre';

/* Modules accessibles à un utilisateur : soit accès admin total (tout débloqué),
   soit la liste cochée à la création du compte. 'dashboard' est toujours inclus.
   Fallback sur l'ancien système par rôle pour les comptes créés avant cette mise à jour. */
function computeAccessibleModuleIds(user){
  if(!user) return [];
  if(user.isAdminTotal) return NAV.map(n=>n.id);
  if(user.modulesAccess) return NAV.filter(n => n.id==='dashboard' || user.modulesAccess[n.id]).map(n=>n.id);
  return NAV.filter(n => n.roles.includes(user.role)).map(n=>n.id);
}

/* ---------------------------- Small UI atoms ---------------------------- */
function Badge({children, cls}){ return <span className={"badge "+cls}>{children}</span>; }

function Modal({title, onClose, children, footer, width}){
  return (

function Field({label, children, hint}){
  return <div className="field"><label className="field-label">{label}</label>{children}{hint && <div className="hint">{hint}</div>}</div>;
}

function EmptyState({glyph, title, sub}){
  return <div className="empty-state"><div className="glyph">{glyph}</div><div className="title">{title}</div><div>{sub}</div></div>;

function Avatar({photo, name}){

/* ---------------------------- Mon profil (photo, nom d'utilisateur, mot de passe) ---------------------------- */
function MonProfilModal({session, onClose, onSaved}){
  const [username, setUsername] = useState(session.username || '');
  const [photo, setPhoto] = useState(session.photo || '');
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [saving, setSaving] = useState(false);
  const [status, setStatus] = useState(null);

  async function handlePhotoChange(e){
    const f = e.target.files[0];
    if(!f) return;
    setUploadingPhoto(true);
    try{
      const url = await uploadToStorage(f, 'profils');
      setPhoto(url);
    }catch(err){
      setStatus({type:'err', msg:"Échec de l'envoi de la photo."});
    }
    setUploadingPhoto(false);
  }

  async function handleSave(){
    if(!username.trim()){ setStatus({type:'err', msg:"Le nom d'utilisateur ne peut pas être vide."}); return; }
    if(newPassword && newPassword.length < 6){ setStatus({type:'err', msg:"Le mot de passe doit contenir au moins 6 caractères."}); return; }
    if(newPassword && newPassword !== confirmPassword){ setStatus({type:'err', msg:"Les mots de passe ne correspondent pas."}); return; }

    setSaving(true); setStatus(null);
    try{
      const usernameChanged = username.trim() !== session.username;
      const photoChanged = photo !== (session.photo || '');

      if(usernameChanged){
        const { error } = await cercleSupabase.from('app_users').update({username: username.trim()}).eq('id', session.id);
        if(error) throw new Error("Ce nom d'utilisateur est peut-être déjà pris.");
      }
      if(photoChanged){
        const { id, username: _u, ...rest } = session;
        const { error } = await cercleSupabase.from('app_users').update({data:{...rest, photo}, updated_at:new Date().toISOString()}).eq('id', session.id);
        if(error) throw error;
      }
      if(newPassword){
        const { error } = await cercleSupabase.auth.updateUser({password:newPassword});
        if(error) throw error;
      }
      onSaved({...session, username:username.trim(), photo});
      onClose();
    }catch(err){
      setStatus({type:'err', msg: err.message || "Échec de l'enregistrement."});
    }
    setSaving(false);
  }

  return (
    <Modal title="Mon profil" onClose={onClose}
      footer={<>
        <button className="btn btn-outline" onClick={onClose}>Annuler</button>
        <button className="btn btn-primary" disabled={saving || uploadingPhoto} onClick={handleSave}>{saving ? 'Enregistrement…' : 'Enregistrer'}</button>
      </>}>
      <div className="profile-photo-row">
        <div className="profile-photo-preview">
          {photo ? <img src={photo} alt={username}/> : (username||'?').slice(0,2).toUpperCase()}
        </div>
        <div>
          <input id="profile-photo-input" type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoChange}/>
          <button type="button" className="btn btn-outline btn-sm" disabled={uploadingPhoto} onClick={()=>document.getElementById('profile-photo-input').click()}>
            {uploadingPhoto ? 'Envoi…' : 'Choisir une photo'}
          </button>
          {photo && <button type="button" className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>setPhoto('')}>Retirer</button>}
        </div>
      </div>

      <Field label="Nom d'utilisateur">
        <input className="input" value={username} onChange={e=>setUsername(e.target.value)}/>
      </Field>

      <div style={{marginTop:6, marginBottom:6, padding:'12px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--paper)'}}>
        <div style={{fontSize:11.5, textTransform:'uppercase', letterSpacing:'.06em', color:'var(--muted)', fontWeight:700, marginBottom:8}}>
          Changer le mot de passe
        </div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
          <input className="input" type="password" placeholder="Nouveau mot de passe" value={newPassword} onChange={e=>setNewPassword(e.target.value)}/>
          <input className="input" type="password" placeholder="Confirmer" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)}/>
        </div>
        <div className="hint" style={{marginTop:6}}>Laisser vide pour ne pas changer le mot de passe.</div>
      </div>

      {status && <div style={{fontSize:12.5, marginTop:8, color: status.type==='ok' ? 'var(--success)' : 'var(--danger)'}}>{status.msg}</div>}
    </Modal>
  );
}

function greetingForNow(){
  const h = new Date().getHours();
  if(h < 12) return 'Bonjour';
  if(h < 18) return 'Bon après-midi';
  return 'Bonsoir';
}

function Dashboard({settings, currentUser, modules, onNavigate}){
  const dateStr = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const valeurs = (settings.valeurs||'').split(',').map(v=>v.trim()).filter(Boolean);
  return (
    <div>
      <div className="dashboard-hero">
        <div>
          <div className="hello">{greetingForNow()}, {currentUser.username}</div>
          <div className="date">{dateStr}</div>
          {settings.motto && <div className="dashboard-motto">« {settings.motto} »</div>}
          {valeurs.length > 0 && (
            <div className="dashboard-values">
              {valeurs.map((v,i)=><span className="value-pill-light" key={i}>{v}</span>)}
            </div>

        </div>
      </div>

      {modules.length===0 ? (

function emptyMembre(){
  return {id:'', matricule:'', nom:'', prenom:'', fonction:'', departement:'', statut:'actif', telephone:'', email:'', adresse:'', dateAdhesion:todayISO(), photo:''};
}
function nextMatricule(membres){
  const nums = membres.map(m => parseInt((m.matricule||'').replace(/\D/g,''))||0);
  const next = (Math.max(0,...nums) + 1).toString().padStart(4,'0');
  return 'GRP-' + next;
}

function Membres({membres, setMembres, settings, canEdit, users, setUsers}){
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [editing, setEditing] = useState(null); // membre being edited or 'new'
  const [viewing, setViewing] = useState(null); // fiche
  const [confirmDelete, setConfirmDelete] = useState(null);

  const filtered = membres.filter(m=>{
    const q = query.toLowerCase();
    const matchQ = !q || (m.nom+' '+m.prenom+' '+m.matricule+' '+m.fonction).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || m.statut===statutFilter;
    return matchQ && matchS;
  });

  function save(form){
    if(form.id){
      setMembres(membres.map(m=>m.id===form.id?form:m));
    }else{
      setMembres([...membres, {...form, id:uid('mem')}]);
    }
    setEditing(null);
  }
  function remove(id){
    setMembres(membres.filter(m=>m.id!==id));
    // Le membre disparaît, mais un compte utilisateur peut encore lui être lié
    // (accès à l'appli, messagerie...). On le désactive et on le détache pour
    // qu'il n'apparaisse plus dans les contacts / discussions, sans effacer
    // l'historique des messages déjà envoyés.
    if(setUsers && users){
      const linked = users.filter(u=>u.membreId===id);
      if(linked.length){
        setUsers(users.map(u=>u.membreId===id ? {...u, actif:false, membreId:''} : u));
      }
    }
    setConfirmDelete(null);
    if(viewing && viewing.id===id) setViewing(null);
  }

  return (
    <div>
      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher un membre…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            {STATUTS_MEMBRE.map(s=><option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
          </select>
        </div>
        {canEdit && <button className="btn btn-primary" onClick={()=>setEditing(emptyMembre())}>+ Ajouter un membre</button>}
      </div>

      <div className="card">
        {filtered.length===0 ? <EmptyState glyph="☺" title="Aucun membre trouvé" sub="Ajustez votre recherche ou ajoutez un nouveau membre."/> : (
          <div className="table-wrap">
            <table>
              <thead><tr><th></th><th>Nom</th><th>Matricule</th><th>Fonction</th><th>Statut</th><th>Contact</th><th></th></tr></thead>
              <tbody>
                {filtered.map(m=>(
                  <tr key={m.id}>
                    <td><Avatar photo={m.photo} name={m.prenom+' '+m.nom}/></td>
                    <td style={{cursor:'pointer', fontWeight:600}} onClick={()=>setViewing(m)}>{m.prenom} {m.nom}</td>
                    <td className="mono">{m.matricule}</td>
                    <td>{m.fonction || '—'}</td>
                    <td><Badge cls={statutBadge(m.statut)}>{m.statut}</Badge></td>
                    <td style={{fontSize:12.5, color:'var(--muted)'}}>{m.telephone || m.email || '—'}</td>
                    <td>
                      <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setViewing(m)}>Fiche</button>
                        {canEdit && <button className="btn btn-outline btn-sm" onClick={()=>setEditing(m)}>Modifier</button>}
                        {canEdit && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(m)}>Suppr.</button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {editing && (
        <Modal title={editing.id ? 'Modifier le membre' : 'Ajouter un membre'} onClose={()=>setEditing(null)} width="620px">
          <MembreForm initial={editing} onSave={save} onCancel={()=>setEditing(null)} membres={membres}/>
        </Modal>
      )}

      {viewing && (
        <Modal title="Fiche du membre" onClose={()=>setViewing(null)} width="620px">
          <div style={{display:'flex', justifyContent:'center', marginBottom:18}}>
            <MemberCard membre={viewing} settings={settings}/>
          </div>
          <div className="two-col">
            <Field label="Téléphone"><div>{viewing.telephone || '—'}</div></Field>
            <Field label="Email"><div>{viewing.email || '—'}</div></Field>
            <Field label="Adresse"><div>{viewing.adresse || '—'}</div></Field>
            <Field label="Date d'adhésion"><div>{fmtDate(viewing.dateAdhesion)}</div></Field>
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
            <button className="btn btn-outline" onClick={()=>window.print()}>🖨 Imprimer la carte</button>
            {canEdit && <button className="btn btn-primary" onClick={()=>{setEditing(viewing); setViewing(null);}}>Modifier</button>}
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          <p>Voulez-vous vraiment supprimer <b>{confirmDelete.prenom} {confirmDelete.nom}</b> ? Cette action est irréversible. Si un compte utilisateur lui est lié, il sera désactivé et ne pourra plus se connecter ni apparaître dans les discussions.</p>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------- Utilisateurs ---------------------------- */
function Utilisateurs({users, setUsers, membres, currentUser}){
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  async function save(form){
    const modulesAccess = form.isAdminTotal ? {} : (form.modulesAccess || {});
    const list = users.map(u => u.id===form.id
      ? {...u, role:form.role, poste:form.poste, membreId:form.membreId, actif:form.actif, isAdminTotal:!!form.isAdminTotal, modulesAccess}
      : u);
    setUsers(list);
    setEditing(null);
  }
  function remove(id){ setUsers(users.filter(u=>u.id!==id)); setConfirmDelete(null); }
  const membreName = (id) => { const m = membres.find(x=>x.id===id); return m ? m.prenom+' '+m.nom : '—'; };
  const modulesSummary = (u) => {
    if(u.isAdminTotal) return 'Tous les modules';
    const ids = computeAccessibleModuleIds(u).filter(id=>id!=='dashboard');
    if(ids.length===0) return 'Accueil uniquement';
    return ids.map(id => (NAV.find(n=>n.id===id)||{}).label).join(', ');
  };

  return (
    <div>
      <div className="toolbar">
        <div className="page-eyebrow">{users.length} compte(s)</div>
      </div>
      <div className="hint" style={{marginBottom:14}}>Les nouveaux comptes sont créés par chaque membre via « Créer mon profil » sur l'écran de connexion. Ici, tu peux ajuster le rôle, le poste et les accès d'un compte déjà créé.</div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Utilisateur</th><th>Poste</th><th>Rôle</th><th>Membre lié</th><th>Modules</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              {users.map(u=>(
                <tr key={u.id}>
                  <td style={{fontWeight:600}}>{u.username}</td>
                  <td>{posteLabel(u.poste)}</td>
                  <td><Badge cls="badge-gold">{roleLabel(u.role)}</Badge></td>
                  <td>{membreName(u.membreId)}</td>
                  <td style={{maxWidth:220, fontSize:12, color:'var(--muted)'}}>
                    {u.isAdminTotal ? <Badge cls="badge-green">Admin total</Badge> : modulesSummary(u)}
                  </td>
                  <td><Badge cls={u.actif?'badge-green':'badge-gray'}>{u.actif?'Actif':'Désactivé'}</Badge></td>
                  <td>
                    <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                      <button className="btn btn-outline btn-sm" onClick={()=>setEditing({...u, modulesAccess: u.modulesAccess||{}})}>Modifier</button>
                      {u.id!==currentUser.id && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(u)}>Suppr.</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {editing && (
        <Modal title="Modifier le compte" onClose={()=>setEditing(null)}>
          <UserForm initial={editing} membres={membres} onCancel={()=>setEditing(null)} onSave={save}/>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          <p>Supprimer le compte <b>{confirmDelete.username}</b> ?</p>
        </Modal>
      )}
    </div>
  );
}
/* Réinitialisation de mot de passe par l'Administrateur.
   Le mot de passe d'un compte Supabase Auth ne peut pas être écrasé directement depuis le
   navigateur sans exposer une clé d'administration (risque de sécurité important) : l'app
   envoie donc un lien de réinitialisation à l'email du compte, l'utilisateur choisit ensuite
   lui-même son nouveau mot de passe en toute sécurité. */
function PasswordReset({user, membres}){
  const linkedMembre = membres.find(m=>m.id===user.membreId);
  const [email, setEmail] = useState((linkedMembre && linkedMembre.email) || '');
  const [status, setStatus] = useState(null);
  const [sending, setSending] = useState(false);

  async function sendReset(){
    if(!email.trim()){ setStatus({type:'err', msg:"Renseigne l'email du compte pour envoyer le lien."}); return; }
    setSending(true); setStatus(null);
    try{
      const { error } = await cercleSupabase.auth.resetPasswordForEmail(email.trim(), {redirectTo: window.location.origin + window.location.pathname.replace(/index\.html$/, '') + 'login.html'});
      if(error) throw error;
      setStatus({type:'ok', msg:"Lien de réinitialisation envoyé à "+email+"."});
    }catch(err){
      setStatus({type:'err', msg:"Échec de l'envoi : "+(err.message || 'erreur inconnue')});
    }
    setSending(false);
  }

  return (
    <div>
      <div className="hint" style={{marginBottom:8}}>
        Envoie un lien de réinitialisation à l'email du compte ; l'utilisateur choisira lui-même son nouveau mot de passe.
      </div>
      <div style={{display:'flex', gap:8}}>
        <input className="input" type="email" placeholder="Email du compte" value={email} onChange={e=>setEmail(e.target.value)} style={{flex:1}}/>
        <button type="button" className="btn btn-outline btn-sm" disabled={sending} onClick={sendReset}>{sending ? 'Envoi…' : 'Envoyer le lien'}</button>
      </div>
      {status && <div style={{fontSize:12, marginTop:6, color: status.type==='ok' ? 'var(--success)' : 'var(--danger)'}}>{status.msg}</div>}
    </div>
  );
}

/* ---------------------------- Cotisations (types) ---------------------------- */
const PERIODICITES = [
  {id:'unique', label:'Unique / Exceptionnelle'},
  {id:'hebdomadaire', label:'Hebdomadaire'},
  {id:'mensuelle', label:'Mensuelle'},
  {id:'trimestrielle', label:'Trimestrielle'},
  {id:'semestrielle', label:'Semestrielle'},
  {id:'annuelle', label:'Annuelle'},
];
const COTIS_COLORS = ['#C2540A','#E8A33D','#3F7D52','#2F5FA8','#7A3FA0','#B3452C','#6B7280'];
function periodeLabel(id){ return (PERIODICITES.find(p=>p.id===id)||{}).label || id; }
function normalizeType(t){
  return {
    description:'', categorie:'obligatoire', statut:'actif', dateDebut:'',
    tolerance:15, penalite:0, couleur:COTIS_COLORS[0],
    ...t,
  };
}
function tauxColor(t){ return t>=80?'var(--success)':t>=50?'var(--gold)':'var(--danger)'; }

function Cotisations({types, setTypes, settings, paiements, membres}){
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [periodFilter, setPeriodFilter] = useState('tous');
  const [sortBy, setSortBy] = useState('nom');

  function emptyType(){ return normalizeType({id:'', nom:'', montant:0, periodicite:'mensuelle'}); }

  function save(form){
    const clean = {...form, montant:Number(form.montant)||0, tolerance:Number(form.tolerance)||0, penalite:Number(form.penalite)||0};
    if(clean.id) setTypes(types.map(t=>t.id===clean.id?clean:t));
    else setTypes([...types, {...clean, id:uid('cot')}]);
    setEditing(null);
  }
  function duplicate(t){ setTypes([...types, {...normalizeType(t), id:uid('cot'), nom:t.nom+' (copie)'}]); }
  function toggleStatut(t){ setTypes(types.map(x=>x.id===t.id?{...normalizeType(x), statut: normalizeType(x).statut==='actif'?'inactif':'actif'}:x)); }
  function remove(id){ setTypes(types.filter(t=>t.id!==id)); setConfirmDelete(null); }

  const enrichedTypes = types.map(normalizeType).map(t=>{
    const liés = paiements.filter(p=>p.typeId===t.id);
    const attendu = liés.reduce((s,p)=>s+Number(p.montantDu||0),0);
    const encaisse = liés.reduce((s,p)=>s+Number(p.montantPaye||0),0);
    const membresIds = new Set(liés.map(p=>p.membreId));
    const aJour = new Set(liés.filter(p=>Number(p.montantDu||0)-Number(p.montantPaye||0)<=0).map(p=>p.membreId));
    return {...t, _nbPaiements:liés.length, _attendu:attendu, _encaisse:encaisse, _nbMembres:membresIds.size, _nbAJour:aJour.size, _taux: attendu>0 ? Math.round((encaisse/attendu)*100) : null};
  });

  const filtered = enrichedTypes.filter(t=>{
    const q = query.toLowerCase();
    const matchQ = !q || (t.nom+' '+(t.description||'')).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || t.statut===statutFilter;
    const matchP = periodFilter==='tous' || t.periodicite===periodFilter;
    return matchQ && matchS && matchP;
  }).sort((a,b)=>{
    if(sortBy==='montant') return b.montant-a.montant;
    if(sortBy==='statut') return a.statut.localeCompare(b.statut);
    return a.nom.localeCompare(b.nom);
  });

  const kpiAttendu = paiements.reduce((s,p)=>s+Number(p.montantDu||0),0);
  const kpiEncaisse = paiements.reduce((s,p)=>s+Number(p.montantPaye||0),0);
  const kpiTaux = kpiAttendu>0 ? Math.round((kpiEncaisse/kpiAttendu)*100) : 0;
  const kpiActifs = enrichedTypes.filter(t=>t.statut==='actif').length;
  const typeALiés = confirmDelete ? paiements.filter(p=>p.typeId===confirmDelete.id) : [];

  return (
    <div>
      <div className="grid grid-4" style={{marginBottom:20}}>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Types actifs</div><div className="value">{kpiActifs}<span style={{fontSize:14, color:'var(--muted)', fontWeight:500}}> / {types.length}</span></div></div>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Total attendu</div><div className="value" style={{fontSize:21}}>{fmtMoney(kpiAttendu, settings.devise)}</div></div>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Total encaissé</div><div className="value" style={{fontSize:21}}>{fmtMoney(kpiEncaisse, settings.devise)}</div></div>
        <div className="stat-card">
          <div className="accent-bar"></div><div className="label">Taux de recouvrement</div>
          <div className="value">{kpiTaux}%</div>
          <div className="progress-track" style={{marginTop:8}}><div className="progress-fill" style={{width:kpiTaux+'%', background:tauxColor(kpiTaux)}}></div></div>
        </div>
      </div>

      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher un type…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            <option value="actif">Actifs</option>
            <option value="inactif">Inactifs</option>
          </select>
          <select className="select" style={{width:190}} value={periodFilter} onChange={e=>setPeriodFilter(e.target.value)}>
            <option value="tous">Toutes périodicités</option>
            {PERIODICITES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
          <select className="select" style={{width:150}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
            <option value="nom">Trier : Nom</option>
            <option value="montant">Trier : Montant</option>
            <option value="statut">Trier : Statut</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setEditing(emptyType())}>+ Nouveau type</button>
      </div>

      <div className="grid grid-3">
        {filtered.map(t=>(
          <div className="card card-pad" key={t.id} style={{position:'relative', overflow:'hidden', paddingLeft:24, opacity:t.statut==='inactif'?0.65:1}}>
            <div style={{position:'absolute', left:0, top:0, bottom:0, width:5, background:t.couleur}}></div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
              <div style={{minWidth:0}}>
                <div className="section-title" style={{marginBottom:6, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.nom}</div>
                <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                  <Badge cls="badge-gray">{periodeLabel(t.periodicite)}</Badge>
                  <Badge cls={t.categorie==='obligatoire'?'badge-gold':'badge-blue'}>{t.categorie==='obligatoire'?'Obligatoire':'Optionnelle'}</Badge>
                  <Badge cls={t.statut==='actif'?'badge-green':'badge-red'}>{t.statut==='actif'?'Actif':'Inactif'}</Badge>
                </div>
              </div>
            </div>
            {t.description && <div style={{fontSize:12.5, color:'var(--muted)', marginTop:10, lineHeight:1.4}}>{t.description}</div>}
            <div style={{fontFamily:'Fraunces,serif', fontSize:26, fontWeight:600, color:'var(--primary-dark)', marginTop:14}}>{fmtMoney(t.montant, settings.devise)}</div>
            {(t.penalite>0 || t.tolerance) && (
              <div style={{fontSize:11, color:'var(--muted)', marginTop:2}}>
                Retard toléré : {t.tolerance||0} j{t.penalite>0 && <> · Pénalité : {fmtMoney(t.penalite, settings.devise)}</>}
              </div>
            )}

            {t._nbPaiements>0 ? (
              <div style={{marginTop:12}}>
                <div style={{display:'flex', justifyContent:'space-between', fontSize:11.5, color:'var(--muted)', marginBottom:4}}>
                  <span>{t._nbMembres} membre(s) · {t._nbAJour} à jour</span>
                  <span>{t._taux}%</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{width:(t._taux||0)+'%', background:tauxColor(t._taux||0)}}></div></div>
                <div style={{fontSize:11, color:'var(--muted)', marginTop:4}}>{fmtMoney(t._encaisse, settings.devise)} encaissés sur {fmtMoney(t._attendu, settings.devise)}</div>
              </div>
            ) : (
              <div style={{fontSize:11.5, color:'var(--muted)', marginTop:12}}>Aucun paiement enregistré pour ce type</div>
            )}

            <div style={{display:'flex', gap:6, marginTop:14, flexWrap:'wrap'}}>
              <button className="btn btn-outline btn-sm" onClick={()=>setEditing(normalizeType(t))}>Modifier</button>
              <button className="btn btn-outline btn-sm" onClick={()=>duplicate(t)}>Dupliquer</button>
              <button className="btn btn-outline btn-sm" onClick={()=>toggleStatut(t)}>{t.statut==='actif'?'Désactiver':'Activer'}</button>
              <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(t)}>Supprimer</button>
            </div>
          </div>
        ))}
        {filtered.length===0 && <EmptyState glyph="⌘" title="Aucun type de cotisation" sub="Créez un type pour commencer à enregistrer des paiements."/>}
      </div>

      {editing && (
        <Modal title={editing.id?'Modifier le type':'Nouveau type de cotisation'} onClose={()=>setEditing(null)} width="560px">
          <CotisationTypeForm initial={editing} settings={settings} onCancel={()=>setEditing(null)} onSave={save}/>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            {typeALiés.length>0 && <button className="btn btn-outline" onClick={()=>{toggleStatut(confirmDelete); setConfirmDelete(null);}}>Désactiver plutôt</button>}
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          {typeALiés.length>0 ? (
            <p>Ce type est lié à <b>{typeALiés.length}</b> paiement(s) déjà enregistré(s). La suppression n'effacera pas ces paiements, mais ce type ne sera plus proposé pour de nouveaux paiements. Il est recommandé de le <b>désactiver</b> plutôt que de le supprimer, afin de conserver un historique cohérent.</p>
          ) : (
            <p>Supprimer le type <b>{confirmDelete.nom}</b> ?</p>
          )}
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------- Paiements ---------------------------- */
function nextReceiptNo(paiements){
  const nums = paiements.map(p=>parseInt((p.recuNo||'').replace(/\D/g,''))||0);
  return 'REC-' + (Math.max(0,...nums)+1).toString().padStart(5,'0');
}
function Paiements({paiements, setPaiements, membres, types, settings, onOpenReceipt}){
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');

  function emptyPaiement(){
    const actifs = types.filter(t=>normalizeType(t).statut==='actif');
    const t0 = actifs[0] || types[0];
    return {id:'', membreId: membres[0] ? membres[0].id : '', typeId: t0 ? t0.id : '', montantDu: t0?t0.montant:0, montantPaye:0, date: todayISO(), mode:'espèces', note:''};
  }
  function save(form){
    let list;
    if(form.id){
      list = paiements.map(p=>p.id===form.id?form:p);
    }else{
      const withRecu = {...form, id:uid('pay'), recuNo: nextReceiptNo(paiements)};
      list = [...paiements, withRecu];
    }
    setPaiements(list);
    setEditing(null);
  }
  function remove(id){ setPaiements(paiements.filter(p=>p.id!==id)); }

  const membreName = (id) => { const m = membres.find(x=>x.id===id); return m ? m.prenom+' '+m.nom : '—'; };
  const typeName = (id) => { const t = types.find(x=>x.id===id); return t ? t.nom : '—'; };

  const enriched = paiements.map(p=>{
    const reste = Number(p.montantDu||0) - Number(p.montantPaye||0);
    const statut = reste<=0 ? 'payé' : (Number(p.montantPaye||0)>0 ? 'partiel' : 'impayé');
    return {...p, reste, statut};
  });

  const filtered = enriched.filter(p=>{
    const q = query.toLowerCase();
    const matchQ = !q || (membreName(p.membreId)+' '+typeName(p.typeId)).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || p.statut===statutFilter;
    return matchQ && matchS;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  const statutCls = {payé:'badge-green', partiel:'badge-gold', impayé:'badge-red'};

  return (
    <div>
      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            <option value="payé">Payé</option>
            <option value="partiel">Partiel</option>
            <option value="impayé">Impayé</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setEditing(emptyPaiement())}>+ Enregistrer un paiement</button>
      </div>

      <div className="card">
        {filtered.length===0 ? <EmptyState glyph="⇄" title="Aucun paiement" sub="Enregistrez un paiement pour un membre."/> : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Membre</th><th>Cotisation</th><th>Date</th><th>Dû</th><th>Payé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
              <tbody>
                {filtered.map(p=>(
                  <tr key={p.id}>
                    <td style={{fontWeight:600}}>{membreName(p.membreId)}</td>
                    <td>{typeName(p.typeId)}</td>
                    <td className="mono" style={{fontSize:12.5}}>{fmtDate(p.date)}</td>
                    <td className="mono">{fmtMoney(p.montantDu, settings.devise)}</td>
                    <td className="mono">{fmtMoney(p.montantPaye, settings.devise)}</td>
                    <td className="mono">{fmtMoney(p.reste, settings.devise)}</td>

/* ---------------------------- Activités (fil social) ---------------------------- */
/* ---------------------------- Réactions (fil social) ---------------------------- */
const REACTIONS = [
  {type:'like', emoji:'👍', label:"J'aime"},
  {type:'love', emoji:'❤️', label:"J'adore"},
  {type:'haha', emoji:'😂', label:'Haha'},
  {type:'wow', emoji:'😮', label:'Wouah'},
  {type:'sad', emoji:'😢', label:'Triste'},
  {type:'clap', emoji:'👏', label:'Bravo'},
];
const REACTION_MAP = Object.fromEntries(REACTIONS.map(r=>[r.type, r]));
/* Fusionne l'ancien format (likes: [userId,...]) et le nouveau (reactions: {userId:type})
   pour rester compatible avec les publications déjà enregistrées. */
function getReactions(post){
  const map = {};
  (post.likes||[]).forEach(uid => { map[uid] = 'like'; });
  Object.entries(post.reactions||{}).forEach(([uid, type]) => { map[uid] = type; });
  return map;
}

function Activites({activites, setActivites, membres, users, currentMembre, session, chatMessages, setChatMessages, unreadChat, unreadFeed, onSeenFeed, onSeenChat}){
  const meId = currentMembre ? 'm:'+currentMembre.id : 'u:'+(session && session.username || 'moi');
  const meName = currentMembre ? (currentMembre.prenom+' '+currentMembre.nom) : ((session && session.username) || 'Moi');
  const mePhoto = (session && session.photo) || (currentMembre && currentMembre.photo) || '';
  // L'Administrateur (rôle 'admin' ou compte "Admin total") peut modérer tout le
  // contenu du module Activités : publications, commentaires et messages de chat,
  // même ceux d'un autre membre.
  const isAdmin = !!(session && (session.role==='admin' || session.isAdminTotal));

  const [tab, setTab] = useState('feed');
  const [texte, setTexte] = useState('');
  const [media, setMedia] = useState(null);
  const [openComments, setOpenComments] = useState({});
  const [reactionPicker, setReactionPicker] = useState({});
  const [commentDraft, setCommentDraft] = useState({});
  const [chatText, setChatText] = useState('');
  const [chatUploading, setChatUploading] = useState(false);
  const [recording, setRecording] = useState(false);
  const [chatMode, setChatMode] = useState('group'); // 'group' | 'private'
  const [activeContactId, setActiveContactId] = useState(null);
  const [contactSearch, setContactSearch] = useState('');
  const [typingUsers, setTypingUsers] = useState([]); // [{id, name, ts, scope, to}]
  const chat = chatMessages || [];
  const chatBodyRef = useRef(null);
  const typingChannelRef = useRef(null);
  const lastTypingSentRef = useRef(0);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const lastSeenPrivateRef = useRef({});

  // Liste des autres comptes actifs pour la messagerie privée : identifiant harmonisé
  // avec meId ('m:'+membreId si un membre est lié, sinon 'u:'+username), nom et photo
  // résolus depuis le membre lié ou, à défaut, depuis le compte lui-même.
  const contacts = (users||[])
    .filter(u => u.id!==(session && session.id) && u.actif!==false)
    .map(u => {
      const m = membres.find(x=>x.id===u.membreId);
      return {
        id: u.membreId ? 'm:'+u.membreId : 'u:'+u.username,
        name: m ? (m.prenom+' '+m.nom) : u.username,
        photo: u.photo || (m && m.photo) || '',
        poste: u.poste,
      };
    });
  const activeContact = contacts.find(c=>c.id===activeContactId) || null;

  function privateThreadWith(contactId){
    return chat.filter(m => m.destinataireId && ((m.auteurId===meId && m.destinataireId===contactId) || (m.auteurId===contactId && m.destinataireId===meId)));
  }
  const contactsSorted = [...contacts].map(c=>{
    const thread = privateThreadWith(c.id);
    const last = thread.length ? thread.reduce((a,b)=> (a.date>b.date?a:b)) : null;
    const unread = thread.filter(m=>m.auteurId===c.id && (!lastSeenPrivateRef.current[c.id] || m.date>lastSeenPrivateRef.current[c.id])).length;
    return {...c, last, unread};
  }).sort((a,b)=>{
    if(a.last && b.last) return b.last.date.localeCompare(a.last.date);
    if(a.last) return -1;
    if(b.last) return 1;
    return a.name.localeCompare(b.name);
  });
  const filteredContacts = contactsSorted.filter(c => !contactSearch.trim() || c.name.toLowerCase().includes(contactSearch.trim().toLowerCase()));

  const groupMessages = chat.filter(m=>!m.destinataireId);
  const privateMessages = activeContact ? privateThreadWith(activeContact.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')) : [];
  const visibleMessages = chatMode==='group' ? groupMessages : privateMessages;

  // Canal de diffusion "en train d'écrire" : indépendant des tables (pas de persistance),
  // basé sur le broadcast temps réel Supabase, actif tant que le module Activités est ouvert.
  // scope 'group' = discussion de groupe ; scope 'private' + to=meId = message privé qui m'est destiné.
  useEffect(()=>{
    const channel = cercleSupabase.channel('cercle_chat_typing', {config:{broadcast:{self:false}}});
    channel.on('broadcast', {event:'typing'}, ({payload})=>{
      if(!payload || payload.id===meId) return;
      if(payload.scope==='private' && payload.to!==meId) return;
      setTypingUsers(prev=>{
        const others = prev.filter(t=>!(t.id===payload.id && t.scope===payload.scope));
        return [...others, {id:payload.id, name:payload.name, ts:Date.now(), scope:payload.scope, to:payload.to}];
      });
    }).subscribe();
    typingChannelRef.current = channel;
    return ()=>{ cercleSupabase.removeChannel(channel); typingChannelRef.current = null; };
  }, [meId]);

  // Purge les indicateurs "en train d'écrire" restés inactifs plus de 3s.
  useEffect(()=>{
    const t = setInterval(()=>{
      setTypingUsers(prev=>{
        const now = Date.now();
        const next = prev.filter(v=> now-v.ts < 3000);
        return next.length===prev.length ? prev : next;
      });
    }, 1000);
    return ()=>clearInterval(t);
  }, []);

  function notifyTyping(){
    if(!typingChannelRef.current) return;
    if(chatMode==='private' && !activeContact) return;
    const now = Date.now();
    if(now - lastTypingSentRef.current < 1200) return;
    lastTypingSentRef.current = now;
    const payload = {id:meId, name:meName.split(' ')[0], scope: chatMode};
    if(chatMode==='private') payload.to = activeContact.id;
    typingChannelRef.current.send({type:'broadcast', event:'typing', payload});
  }
  function handleChatTextChange(e){
    setChatText(e.target.value);
    notifyTyping();
  }
  const visibleTyping = typingUsers.filter(t => chatMode==='group' ? t.scope==='group' : (t.scope==='private' && activeContact && t.id===activeContact.id));

  // Marque le tchat / le fil comme "lu" (utilisé pour la pastille de notification globale dans la navigation)
  // dès que l'onglet correspondant est actif, y compris à l'arrivée sur la page.
  useEffect(()=>{
    if(tab==='chat'){
      onSeenChat && onSeenChat();
      if(chatBodyRef.current) chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    } else if(tab==='feed'){
      onSeenFeed && onSeenFeed();
    }
  }, [chat, tab]);

  // Marque la conversation privée ouverte comme lue (pastille locale dans la liste des contacts).
  useEffect(()=>{
    if(chatMode==='private' && activeContact){
      lastSeenPrivateRef.current[activeContact.id] = new Date().toISOString();
      if(chatBodyRef.current) chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    }
  }, [activeContactId, chat]);

  function fmtDateTime(iso){
    if(!iso) return '';
    const d = new Date(iso); if(isNaN(d)) return iso;
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }

  const [mediaUploading, setMediaUploading] = useState(false);
  function pickFile(kind){
    return async (e) => {
      const f = e.target.files[0]; if(!f) return;
      const maxMB = kind==='video' ? 12 : 5;
      if(f.size > maxMB*1024*1024){
        alert("Fichier trop volumineux (max "+maxMB+" Mo).");
        e.target.value=''; return;
      }
      setMediaUploading(true);
      try{
        const url = await uploadToStorage(f, 'activites');
        setMedia({type:kind, data:url, name:f.name});
      }catch(err){ alert("Échec de l'envoi du média."); }
      setMediaUploading(false);
      e.target.value='';
    };
  }

  function publier(){
    const t = texte.trim();
    if(!t && !media) return;
    const post = {
      id: uid('act'), date: new Date().toISOString(),
      auteurId: meId, auteurNom: meName, auteurPhoto: mePhoto,
      texte: t, media: media, likes: [], comments: []
    };
    setActivites([post, ...activites]);
    setTexte(''); setMedia(null);
  }

  function setReaction(post, type){
    const current = getReactions(post);
    const nextMap = {...current};
    if(nextMap[meId] === type) delete nextMap[meId];
    else nextMap[meId] = type;
    const updated = {...post, reactions: nextMap, likes: undefined};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }
  function onMainReactionClick(post){
    const mine = getReactions(post)[meId];
    setReaction(post, mine || 'like');
  }
  function toggleReactionPicker(id){
    setReactionPicker(p=>({...p, [id]: !p[id]}));
  }

  function addComment(post){
    const txt = (commentDraft[post.id]||'').trim();
    if(!txt) return;
    const c = {id:uid('cmt'), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, texte:txt, date:new Date().toISOString()};
    const updated = {...post, comments:[...(post.comments||[]), c]};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
    setCommentDraft({...commentDraft, [post.id]:''});
  }

  function removeComment(post, commentId){
    if(!confirm('Supprimer ce commentaire ?')) return;
    const updated = {...post, comments:(post.comments||[]).filter(c=>c.id!==commentId)};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }

  function removePost(id){
    // Auteur de la publication OU Administrateur.
    if(!confirm('Supprimer cette publication ?')) return;
    setActivites(activites.filter(a=>a.id!==id));
  }

  async function sendChatMessage({texte, media}){
    const destinataireId = chatMode==='private' && activeContact ? activeContact.id : null;
    const msg = {id:uid('msg'), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, destinataireId, texte: texte||'', media: media||null, date:new Date().toISOString()};
    setChatMessages && setChatMessages(c=>[...c, msg]);
    await cercleSupabase.from('chat_messages').insert({id:msg.id, data:{auteurId:msg.auteurId, auteurNom:msg.auteurNom, auteurPhoto:msg.auteurPhoto, destinataireId:msg.destinataireId, texte:msg.texte, media:msg.media, date:msg.date}});
  }
  async function sendChat(){
    const t = chatText.trim(); if(!t) return;
    setChatText('');
    await sendChatMessage({texte:t});
  }
  async function removeChatMessage(m){
    // Auteur du message OU Administrateur (droit total sur la messagerie).
    if(!confirm('Supprimer ce message ?')) return;
    setChatMessages && setChatMessages(c=>c.filter(x=>x.id!==m.id));
    await cercleSupabase.from('chat_messages').delete().eq('id', m.id);
  }
  async function pickChatFile(e){
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 15*1024*1024){ alert('Fichier trop volumineux (max 15 Mo).'); e.target.value=''; return; }
    setChatUploading(true);
    try{
      const url = await uploadToStorage(f, 'chat');
      await sendChatMessage({media:{type:'file', data:url, name:f.name}});
    }catch(err){ alert("Échec de l'envoi du fichier."); }
    setChatUploading(false);
    e.target.value='';
  }
  async function startRecording(){
    if(recording) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      chunksRef.current = [];
      mr.ondataavailable = (e)=>{ if(e.data.size>0) chunksRef.current.push(e.data); };
      mr.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(chunksRef.current, {type:'audio/webm'});
        if(blob.size > 0){
          setChatUploading(true);
          try{
            const file = new File([blob], 'vocal_'+Date.now()+'.webm', {type:'audio/webm'});
            const url = await uploadToStorage(file, 'chat');
            await sendChatMessage({media:{type:'audio', data:url, name:file.name}});
          }catch(err){ alert("Échec de l'envoi du message vocal."); }
          setChatUploading(false);
        }
      };
      mr.start();
      mediaRecorderRef.current = mr;
      setRecording(true);
    }catch(err){
      alert("Impossible d'accéder au microphone.");
    }
  }
  function stopRecording(){
    if(mediaRecorderRef.current && mediaRecorderRef.current.state==='recording'){
      mediaRecorderRef.current.stop();
    }
    setRecording(false);
  }

  const sorted = [...activites].sort((a,b)=> (b.date||'').localeCompare(a.date||''));

  return (
    <div>
      <div className="feed-wrap">
        <div className="tabs no-print" style={{marginBottom:16}}>
          <button className={"tab "+(tab==='feed'?'active':'')} onClick={()=>setTab('feed')} style={{position:'relative'}}>
            📣 Fil d'actualité
            {unreadFeed>0 && tab!=='feed' && <span className="chat-unread-dot">{unreadFeed>9?'9+':unreadFeed}</span>}
          </button>
          <button className={"tab "+(tab==='chat'?'active':'')} onClick={()=>setTab('chat')} style={{position:'relative'}}>
            💬 Discussion de groupe
            {unreadChat>0 && tab!=='chat' && <span className="chat-unread-dot">{unreadChat>9?'9+':unreadChat}</span>}
          </button>
        </div>

        {tab==='feed' && (
          <React.Fragment>
            <div className="card composer">
              <div className="composer-top">
                <Avatar photo={mePhoto} name={meName}/>
                <div style={{flex:1}}>
                  <div className="composer-label">Partager avec le groupe</div>
                  <textarea className="composer-input" placeholder={"Quoi de neuf, "+meName.split(' ')[0]+" ? Écrivez un message, une annonce, un compte-rendu…"} value={texte} onChange={e=>setTexte(e.target.value)}/>
                </div>
              </div>
              {media && (
                <div className="composer-media-preview">
                  <button className="composer-media-remove" onClick={()=>setMedia(null)}>✕</button>
                  {media.type==='image' && <img src={media.data} alt=""/>}
                  {media.type==='video' && <video src={media.data} controls/>}
                  {media.type==='audio' && <audio src={media.data} controls/>}
                </div>
              )}
              <div className="composer-actions">
                <div className="composer-attach">
