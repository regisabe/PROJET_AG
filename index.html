/* ---------------------------- Cotisations (types) ---------------------------- */
const PERIODICITES = [
  {id:'unique', label:'Unique / Exceptionnelle'},
  {id:'hebdomadaire', label:'Hebdomadaire'},
  {id:'mensuelle', label:'Mensuelle'},
  {id:'trimestrielle', label:'Trimestrielle'},
  {id:'semestrielle', label:'Semestrielle'},
  {id:'annuelle', label:'Annuelle'},
];
const COTIS_COLORS = ['#C2540A','#E8A33D','#3F7D52','#2F5FA8','#7A3FA0','#B3452C','#6B7280'];
function periodeLabel(id){ return (PERIODICITES.find(p=>p.id===id)||{}).label || id; }
function normalizeType(t){
  return {
    description:'', categorie:'obligatoire', statut:'actif', dateDebut:'',
    tolerance:15, penalite:0, couleur:COTIS_COLORS[0],
    ...t,
  };
}
function tauxColor(t){ return t>=80?'var(--success)':t>=50?'var(--gold)':'var(--danger)'; }

function Cotisations({types, setTypes, settings, paiements, membres}){
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [periodFilter, setPeriodFilter] = useState('tous');
  const [sortBy, setSortBy] = useState('nom');

  function emptyType(){ return normalizeType({id:'', nom:'', montant:0, periodicite:'mensuelle'}); }

  function save(form){
    const clean = {...form, montant:Number(form.montant)||0, tolerance:Number(form.tolerance)||0, penalite:Number(form.penalite)||0};
    if(clean.id) setTypes(types.map(t=>t.id===clean.id?clean:t));
    else setTypes([...types, {...clean, id:uid('cot')}]);
    setEditing(null);
  }
  function duplicate(t){ setTypes([...types, {...normalizeType(t), id:uid('cot'), nom:t.nom+' (copie)'}]); }
  function toggleStatut(t){ setTypes(types.map(x=>x.id===t.id?{...normalizeType(x), statut: normalizeType(x).statut==='actif'?'inactif':'actif'}:x)); }
  function remove(id){ setTypes(types.filter(t=>t.id!==id)); setConfirmDelete(null); }

  const enrichedTypes = types.map(normalizeType).map(t=>{
    const liés = paiements.filter(p=>p.typeId===t.id);
    const attendu = liés.reduce((s,p)=>s+Number(p.montantDu||0),0);
    const encaisse = liés.reduce((s,p)=>s+Number(p.montantPaye||0),0);
    const membresIds = new Set(liés.map(p=>p.membreId));
    const aJour = new Set(liés.filter(p=>Number(p.montantDu||0)-Number(p.montantPaye||0)<=0).map(p=>p.membreId));
    return {...t, _nbPaiements:liés.length, _attendu:attendu, _encaisse:encaisse, _nbMembres:membresIds.size, _nbAJour:aJour.size, _taux: attendu>0 ? Math.round((encaisse/attendu)*100) : null};
  });

  const filtered = enrichedTypes.filter(t=>{
    const q = query.toLowerCase();
    const matchQ = !q || (t.nom+' '+(t.description||'')).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || t.statut===statutFilter;
    const matchP = periodFilter==='tous' || t.periodicite===periodFilter;
    return matchQ && matchS && matchP;
  }).sort((a,b)=>{
    if(sortBy==='montant') return b.montant-a.montant;
    if(sortBy==='statut') return a.statut.localeCompare(b.statut);
    return a.nom.localeCompare(b.nom);
  });

  const kpiAttendu = paiements.reduce((s,p)=>s+Number(p.montantDu||0),0);
  const kpiEncaisse = paiements.reduce((s,p)=>s+Number(p.montantPaye||0),0);
  const kpiTaux = kpiAttendu>0 ? Math.round((kpiEncaisse/kpiAttendu)*100) : 0;
  const kpiActifs = enrichedTypes.filter(t=>t.statut==='actif').length;
  const typeALiés = confirmDelete ? paiements.filter(p=>p.typeId===confirmDelete.id) : [];

  return (
    <div>
      <div className="grid grid-4" style={{marginBottom:20}}>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Types actifs</div><div className="value">{kpiActifs}<span style={{fontSize:14, color:'var(--muted)', fontWeight:500}}> / {types.length}</span></div></div>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Total attendu</div><div className="value" style={{fontSize:21}}>{fmtMoney(kpiAttendu, settings.devise)}</div></div>
        <div className="stat-card"><div className="accent-bar"></div><div className="label">Total encaissé</div><div className="value" style={{fontSize:21}}>{fmtMoney(kpiEncaisse, settings.devise)}</div></div>
        <div className="stat-card">
          <div className="accent-bar"></div><div className="label">Taux de recouvrement</div>
          <div className="value">{kpiTaux}%</div>
          <div className="progress-track" style={{marginTop:8}}><div className="progress-fill" style={{width:kpiTaux+'%', background:tauxColor(kpiTaux)}}></div></div>
        </div>
      </div>

      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher un type…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            <option value="actif">Actifs</option>
            <option value="inactif">Inactifs</option>
          </select>
          <select className="select" style={{width:190}} value={periodFilter} onChange={e=>setPeriodFilter(e.target.value)}>
            <option value="tous">Toutes périodicités</option>
            {PERIODICITES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
          <select className="select" style={{width:150}} value={sortBy} onChange={e=>setSortBy(e.target.value)}>
            <option value="nom">Trier : Nom</option>
            <option value="montant">Trier : Montant</option>
            <option value="statut">Trier : Statut</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setEditing(emptyType())}>+ Nouveau type</button>
      </div>

      <div className="grid grid-3">
        {filtered.map(t=>(
          <div className="card card-pad" key={t.id} style={{position:'relative', overflow:'hidden', paddingLeft:24, opacity:t.statut==='inactif'?0.65:1}}>
            <div style={{position:'absolute', left:0, top:0, bottom:0, width:5, background:t.couleur}}></div>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8}}>
              <div style={{minWidth:0}}>
                <div className="section-title" style={{marginBottom:6, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.nom}</div>
                <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                  <Badge cls="badge-gray">{periodeLabel(t.periodicite)}</Badge>
                  <Badge cls={t.categorie==='obligatoire'?'badge-gold':'badge-blue'}>{t.categorie==='obligatoire'?'Obligatoire':'Optionnelle'}</Badge>
                  <Badge cls={t.statut==='actif'?'badge-green':'badge-red'}>{t.statut==='actif'?'Actif':'Inactif'}</Badge>
                </div>
              </div>
            </div>
            {t.description && <div style={{fontSize:12.5, color:'var(--muted)', marginTop:10, lineHeight:1.4}}>{t.description}</div>}
            <div style={{fontFamily:'Fraunces,serif', fontSize:26, fontWeight:600, color:'var(--primary-dark)', marginTop:14}}>{fmtMoney(t.montant, settings.devise)}</div>
            {(t.penalite>0 || t.tolerance) && (
              <div style={{fontSize:11, color:'var(--muted)', marginTop:2}}>
                Retard toléré : {t.tolerance||0} j{t.penalite>0 && <> · Pénalité : {fmtMoney(t.penalite, settings.devise)}</>}
              </div>
            )}

            {t._nbPaiements>0 ? (
              <div style={{marginTop:12}}>
                <div style={{display:'flex', justifyContent:'space-between', fontSize:11.5, color:'var(--muted)', marginBottom:4}}>
                  <span>{t._nbMembres} membre(s) · {t._nbAJour} à jour</span>
                  <span>{t._taux}%</span>
                </div>
                <div className="progress-track"><div className="progress-fill" style={{width:(t._taux||0)+'%', background:tauxColor(t._taux||0)}}></div></div>
                <div style={{fontSize:11, color:'var(--muted)', marginTop:4}}>{fmtMoney(t._encaisse, settings.devise)} encaissés sur {fmtMoney(t._attendu, settings.devise)}</div>
              </div>
            ) : (
              <div style={{fontSize:11.5, color:'var(--muted)', marginTop:12}}>Aucun paiement enregistré pour ce type</div>
            )}

            <div style={{display:'flex', gap:6, marginTop:14, flexWrap:'wrap'}}>
              <button className="btn btn-outline btn-sm" onClick={()=>setEditing(normalizeType(t))}>Modifier</button>
              <button className="btn btn-outline btn-sm" onClick={()=>duplicate(t)}>Dupliquer</button>
              <button className="btn btn-outline btn-sm" onClick={()=>toggleStatut(t)}>{t.statut==='actif'?'Désactiver':'Activer'}</button>
              <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(t)}>Supprimer</button>
            </div>
          </div>
        ))}
        {filtered.length===0 && <EmptyState glyph="⌘" title="Aucun type de cotisation" sub="Créez un type pour commencer à enregistrer des paiements."/>}
      </div>

      {editing && (
        <Modal title={editing.id?'Modifier le type':'Nouveau type de cotisation'} onClose={()=>setEditing(null)} width="560px">
          <CotisationTypeForm initial={editing} settings={settings} onCancel={()=>setEditing(null)} onSave={save}/>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            {typeALiés.length>0 && <button className="btn btn-outline" onClick={()=>{toggleStatut(confirmDelete); setConfirmDelete(null);}}>Désactiver plutôt</button>}
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          {typeALiés.length>0 ? (
            <p>Ce type est lié à <b>{typeALiés.length}</b> paiement(s) déjà enregistré(s). La suppression n'effacera pas ces paiements, mais ce type ne sera plus proposé pour de nouveaux paiements. Il est recommandé de le <b>désactiver</b> plutôt que de le supprimer, afin de conserver un historique cohérent.</p>
          ) : (
            <p>Supprimer le type <b>{confirmDelete.nom}</b> ?</p>
          )}
        </Modal>
      )}
    </div>
  );
}

  const set = (k,v)=>setForm(f=>({...f,[k]:v}));

  function validate(toSave){
    const errs = {};
    if(!toSave.nom.trim()) errs.nom = 'Le nom est obligatoire.';
    if(Number(toSave.montant) < 0) errs.montant = 'Le montant ne peut pas être négatif.';
    if(Number(toSave.tolerance) < 0) errs.tolerance = 'La tolérance ne peut pas être négative.';
    if(Number(toSave.penalite) < 0) errs.penalite = 'La pénalité ne peut pas être négative.';
    return errs;
  }
  return (
    <div>
      <Field label="Nom" error={errors.nom}><input className="input" value={form.nom} onChange={e=>set('nom', e.target.value)} placeholder="Ex. Cotisation mensuelle"/></Field>
      <Field label="Description" hint="Facultatif — visible par les gestionnaires"><textarea className="textarea" value={form.description} onChange={e=>set('description', e.target.value)}/></Field>
      <div className="two-col">
        <Field label={"Montant ("+settings.devise+")"} error={errors.montant}><input className="input" type="number" min="0" value={form.montant} onChange={e=>set('montant', e.target.value)}/></Field>
        <Field label="Périodicité">
          <select className="select" value={form.periodicite} onChange={e=>set('periodicite', e.target.value)}>
            {PERIODICITES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
        </Field>
      </div>
      <div className="two-col">
        <Field label="Catégorie">
          <select className="select" value={form.categorie} onChange={e=>set('categorie', e.target.value)}>
            <option value="obligatoire">Obligatoire</option>
            <option value="optionnelle">Optionnelle</option>
          </select>
        </Field>
        <Field label="Statut">
          <select className="select" value={form.statut} onChange={e=>set('statut', e.target.value)}>
            <option value="actif">Actif</option>
            <option value="inactif">Inactif</option>
          </select>
        </Field>
      </div>
      <div className="two-col">
        <Field label="Date de début" hint="Facultatif"><input className="input" type="date" value={form.dateDebut} onChange={e=>set('dateDebut', e.target.value)}/></Field>

/* ---------------------------- Paiements ---------------------------- */
function nextReceiptNo(paiements){
  const nums = paiements.map(p=>parseInt((p.recuNo||'').replace(/\D/g,''))||0);
  return 'REC-' + (Math.max(0,...nums)+1).toString().padStart(5,'0');
}
const PAIEMENTS_PAGE_SIZE = 30;
function Paiements({paiements, setPaiements, membres, types, settings, onOpenReceipt}){
  const [editing, setEditing] = useState(null);
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [pageNum, setPageNum] = useState(1);
  // Revenir à la page 1 dès que la recherche ou le filtre change,
  // sinon on peut se retrouver sur une page vide.
  useEffect(()=>{ setPageNum(1); }, [query, statutFilter]);

  function emptyPaiement(){
    const actifs = types.filter(t=>normalizeType(t).statut==='actif');
    const t0 = actifs[0] || types[0];
    return {id:'', membreId: membres[0] ? membres[0].id : '', typeId: t0 ? t0.id : '', montantDu: t0?t0.montant:0, montantPaye:0, date: todayISO(), mode:'espèces', note:''};
  }
  function save(form){
    let list;
    if(form.id){
      list = paiements.map(p=>p.id===form.id?form:p);
    }else{
      const withRecu = {...form, id:uid('pay'), recuNo: nextReceiptNo(paiements)};
      list = [...paiements, withRecu];
    }
    setPaiements(list);
    setEditing(null);
  }
  function remove(id){ setPaiements(paiements.filter(p=>p.id!==id)); }

  const membreName = (id) => { const m = membres.find(x=>x.id===id); return m ? m.prenom+' '+m.nom : '—'; };
  const typeName = (id) => { const t = types.find(x=>x.id===id); return t ? t.nom : '—'; };

  const enriched = paiements.map(p=>{
    const reste = Number(p.montantDu||0) - Number(p.montantPaye||0);
    const statut = reste<=0 ? 'payé' : (Number(p.montantPaye||0)>0 ? 'partiel' : 'impayé');
    return {...p, reste, statut};
  });

  const filtered = enriched.filter(p=>{
    const q = query.toLowerCase();
    const matchQ = !q || (membreName(p.membreId)+' '+typeName(p.typeId)).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || p.statut===statutFilter;
    return matchQ && matchS;
  }).sort((a,b)=> b.date.localeCompare(a.date));

  // Pagination d'affichage : au-delà de quelques centaines de paiements, rendre
  // toutes les lignes d'un coup dans le DOM ralentit sérieusement l'interface.
  // On ne découpe qu'au moment du rendu — le filtrage/tri ci-dessus reste sur
  // la liste complète, donc le comportement de recherche ne change pas.
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAIEMENTS_PAGE_SIZE));
  const safePageNum = Math.min(pageNum, totalPages);
  const pageItems = filtered.slice((safePageNum-1)*PAIEMENTS_PAGE_SIZE, safePageNum*PAIEMENTS_PAGE_SIZE);

  const statutCls = {payé:'badge-green', partiel:'badge-gold', impayé:'badge-red'};

  return (
    <div>
      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            <option value="payé">Payé</option>
            <option value="partiel">Partiel</option>
            <option value="impayé">Impayé</option>
          </select>
        </div>
        <button className="btn btn-primary" onClick={()=>setEditing(emptyPaiement())}>+ Enregistrer un paiement</button>
      </div>

      <div className="card">
        {filtered.length===0 ? <EmptyState glyph="⇄" title="Aucun paiement" sub="Enregistrez un paiement pour un membre."/> : (
          <>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Membre</th><th>Cotisation</th><th>Date</th><th>Dû</th><th>Payé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                  {pageItems.map(p=>(
                    <tr key={p.id}>
                      <td style={{fontWeight:600}}>{membreName(p.membreId)}</td>
                      <td>{typeName(p.typeId)}</td>
                      <td className="mono" style={{fontSize:12.5}}>{fmtDate(p.date)}</td>
                      <td className="mono">{fmtMoney(p.montantDu, settings.devise)}</td>
                      <td className="mono">{fmtMoney(p.montantPaye, settings.devise)}</td>
                      <td className="mono">{fmtMoney(p.reste, settings.devise)}</td>
                      <td><Badge cls={statutCls[p.statut]}>{p.statut}</Badge></td>
                      <td>
                        <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                          <button className="btn btn-outline btn-sm" onClick={()=>onOpenReceipt(p)}>Reçu</button>
                          <button className="btn btn-outline btn-sm" onClick={()=>setEditing(p)}>Modifier</button>
                          <button className="btn btn-danger btn-sm" onClick={()=>remove(p.id)}>Suppr.</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {totalPages>1 && (
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, padding:'12px 4px 2px', flexWrap:'wrap'}}>
                <span style={{fontSize:13, color:'var(--muted)'}}>
                  {filtered.length} paiement(s) — page {safePageNum} / {totalPages}
                </span>
                <div style={{display:'flex', gap:8}}>
                  <button className="btn btn-outline btn-sm" disabled={safePageNum<=1} onClick={()=>setPageNum(n=>Math.max(1,n-1))}>← Précédent</button>
                  <button className="btn btn-outline btn-sm" disabled={safePageNum>=totalPages} onClick={()=>setPageNum(n=>Math.min(totalPages,n+1))}>Suivant →</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {editing && (
        <Modal title={editing.id?'Modifier le paiement':'Enregistrer un paiement'} onClose={()=>setEditing(null)} width="520px">
          <PaiementForm initial={editing} membres={membres} types={types} onCancel={()=>setEditing(null)} onSave={save}/>
        </Modal>
      )}
    </div>
  );
}
function PaiementForm({initial, membres, types, onCancel, onSave}){
  const [form, setForm] = useState(initial);
  const [errors, setErrors] = useState({});
  const set = (k,v)=>setForm(f=>({...f,[k]:v}));
  useEffect(()=>{
    if(!initial.id){
      const t = types.find(x=>x.id===form.typeId);
      if(t) set('montantDu', t.montant);
    }
  }, [form.typeId]);

  function validate(toSave){
    const errs = {};
    if(!toSave.membreId) errs.membreId = 'Sélectionnez un membre.';
    if(!toSave.typeId) errs.typeId = 'Sélectionnez un type de cotisation.';
    if(Number(toSave.montantDu) < 0) errs.montantDu = 'Le montant dû ne peut pas être négatif.';
    if(Number(toSave.montantPaye) < 0) errs.montantPaye = 'Le montant payé ne peut pas être négatif.';
    if(!toSave.date) errs.date = 'La date est obligatoire.';
    else{
      const membre = membres.find(m=>m.id===toSave.membreId);
      if(membre && membre.dateAdhesion && toSave.date < membre.dateAdhesion) errs.date = 'Ce paiement est antérieur à la date d\'adhésion du membre.';
    }
    return errs;
  }
  return (
    <div>
      <Field label="Membre" error={errors.membreId}>
        <select className="select" value={form.membreId} onChange={e=>set('membreId', e.target.value)}>
          {membres.map(m=><option key={m.id} value={m.id}>{m.prenom} {m.nom}</option>)}
        </select>
      </Field>
      <Field label="Type de cotisation" error={errors.typeId}>
        <select className="select" value={form.typeId} onChange={e=>set('typeId', e.target.value)}>
          {types.filter(t=>normalizeType(t).statut==='actif' || t.id===form.typeId).map(t=>
            <option key={t.id} value={t.id}>{t.nom}{normalizeType(t).statut!=='actif' ? ' (inactif)' : ''}</option>
          )}
        </select>
      </Field>
      <div className="two-col">
        <Field label="Montant dû" error={errors.montantDu}><input className="input" type="number" min="0" value={form.montantDu} onChange={e=>set('montantDu', Number(e.target.value))}/></Field>
        <Field label="Montant payé" error={errors.montantPaye}><input className="input" type="number" min="0" value={form.montantPaye} onChange={e=>set('montantPaye', Number(e.target.value))}/></Field>
      </div>
      <div className="two-col">
        <Field label="Date" error={errors.date}><input className="input" type="date" value={form.date} onChange={e=>set('date', e.target.value)}/></Field>
        <Field label="Mode de paiement">
          <select className="select" value={form.mode} onChange={e=>set('mode', e.target.value)}>
            <option>espèces</option><option>mobile money</option><option>virement</option><option>chèque</option>
          </select>
        </Field>
      </div>
      <Field label="Note"><textarea className="textarea" value={form.note} onChange={e=>set('note', e.target.value)}/></Field>
      <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
        <button className="btn btn-outline" onClick={onCancel}>Annuler</button>
        <button className="btn btn-primary" onClick={()=>{
          const errs = validate(form);
          setErrors(errs);
          if(Object.keys(errs).length) return;
          onSave(form);
        }}>Enregistrer</button>
      </div>
    </div>
  );
}

/* ---------------------------- Réactions (fil social, posts & messages) ---------------------------- */
const REACTIONS = [
  {type:'like', emoji:'👍', label:"J'aime"},
  {type:'love', emoji:'❤️', label:"J'adore"},
  {type:'haha', emoji:'😂', label:'Haha'},
  {type:'wow', emoji:'😮', label:'Wouah'},
  {type:'sad', emoji:'😢', label:'Triste'},
  {type:'clap', emoji:'👏', label:'Bravo'},
];
const REACTION_MAP = Object.fromEntries(REACTIONS.map(r=>[r.type, r]));
/* Fusionne l'ancien format (likes: [userId,...]) et le nouveau (reactions: {userId:type})
   pour rester compatible avec les publications déjà enregistrées. Fonctionne aussi bien
   sur une publication que sur un message de tchat (mêmes champs likes/reactions). */
function getReactions(item){
  const map = {};
  (item.likes||[]).forEach(uid => { map[uid] = 'like'; });
  Object.entries(item.reactions||{}).forEach(([uid, type]) => { map[uid] = type; });
  return map;
}
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

const STORY_TTL_MS = 24*60*60*1000;

/* Découpe un texte pour mettre en valeur les mentions @Nom et les hashtags #mot-clé,
   sans jamais modifier le texte original stocké (uniquement à l'affichage). */
function RichText({texte, onHashtagClick}){
  if(!texte) return null;
  const parts = texte.split(/(@[\p{L}0-9_]+(?:\s[\p{L}0-9_]+)?|#[\p{L}0-9_]+)/gu);
  return parts.map((part, i) => {
    if(/^@[\p{L}0-9_]/u.test(part)) return <span key={i} className="mention-chip">{part}</span>;
    if(/^#[\p{L}0-9_]/u.test(part)) return <span key={i} className="hashtag-chip" onClick={()=>onHashtagClick && onHashtagClick(part.slice(1))}>{part}</span>;
    return <React.Fragment key={i}>{part}</React.Fragment>;
  });
}
/* Retrouve, parmi les contacts connus, ceux dont le nom complet apparaît en @mention dans le texte. */
function extractMentions(texte, contacts){
  if(!texte) return [];
  const found = [];
  (contacts||[]).forEach(c=>{
    const re = new RegExp('@'+c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}0-9_])', 'iu');
    if(re.test(texte)) found.push(c.id);
  });
  return found;
}

function StoriesBar({stories, meId, meName, mePhoto, onAddStory, onOpenStory, uploading}){
  const mine = stories.filter(s=>s.auteurId===meId);
  const mineUnseen = mine.some(s=>!(s.seenBy||[]).includes(meId));
  const others = [];
  const seenAuthors = new Set();
  stories.filter(s=>s.auteurId!==meId).forEach(s=>{
    if(!seenAuthors.has(s.auteurId)){ seenAuthors.add(s.auteurId); others.push(s); }
  });
  function authorUnseen(authorId){ return stories.filter(s=>s.auteurId===authorId).some(s=>!(s.seenBy||[]).includes(meId)); }
  return (
    <div className="stories-bar no-print">
      <div className="story-item">
        <div className={"story-ring "+(mine.length ? (mineUnseen?'unseen':'seen') : 'empty')} onClick={()=>mine.length && onOpenStory(meId)}>

          <label className="story-add-badge" onClick={e=>e.stopPropagation()} title="Ajouter une story">

        </div>
        <div className="story-label">Votre story</div>

      {others.map(s=>(
        <button key={s.auteurId} className="story-item story-item-btn" onClick={()=>onOpenStory(s.auteurId)}>
          <div className={"story-ring "+(authorUnseen(s.auteurId)?'unseen':'seen')}>
            <div className="story-avatar-wrap"><Avatar photo={s.auteurPhoto} name={s.auteurNom}/></div>
          </div>
          <div className="story-label">{(s.auteurNom||'').split(' ')[0]}</div>
        </button>
      ))}
    </div>
  );
}
function StoryViewer({stories, authorId, onClose, onSeen}){
  const items = stories.filter(s=>s.auteurId===authorId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const [idx, setIdx] = useState(0);
  const cur = items[idx];
  useEffect(()=>{ if(cur) onSeen(cur); }, [cur && cur.id]);
  useEffect(()=>{
    if(!cur || (cur.media && cur.media.type==='video')) return;
    const t = setTimeout(()=> (idx<items.length-1 ? setIdx(idx+1) : onClose()), 5000);
    return ()=>clearTimeout(t);
  }, [idx, cur && cur.id]);
  if(!cur) return null;
  return (
    <div className="story-viewer-overlay" onClick={onClose}>
      <div className="story-viewer" onClick={e=>e.stopPropagation()}>
        <div className="story-progress">
          {items.map((it,i)=>(<div key={it.id} className="story-progress-bar"><div className="fill" style={{width: i<idx?'100%':i===idx?'100%':'0%', transition: i===idx?'width 5s linear':'none'}}/></div>))}
        </div>
        <div className="story-viewer-head">
          <Avatar photo={cur.auteurPhoto} name={cur.auteurNom}/>
          <div style={{flex:1, minWidth:0}}>
            <div className="name">{cur.auteurNom}</div>
            <div className="meta">{fmtDateTime(cur.date)}</div>
          </div>
          <button className="story-close" onClick={onClose}>✕</button>
        </div>
        <div className="story-media">
          {cur.media && cur.media.type==='video' ? <video src={cur.media.data} autoPlay controls onEnded={()=> idx<items.length-1 ? setIdx(idx+1) : onClose()}/> : <img src={cur.media && cur.media.data} alt=""/>}
        </div>
        {cur.texte && <div className="story-caption">{cur.texte}</div>}
        <div className="story-tap-zones">
          <div className="zone left" onClick={()=> idx>0 && setIdx(idx-1)}></div>
          <div className="zone right" onClick={()=> idx<items.length-1 ? setIdx(idx+1) : onClose()}></div>
        </div>
      </div>
    </div>
  );
}

                <div style={{flex:1, minWidth:0}}>
                  <div className="notif-text">{n.text}</div>
                  <div className="notif-time">{fmtDateTime(n.date)}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

/* ---------------------------- Sondages & Événements (blocs de publication) ---------------------------- */
function PollCard({post, meId, onVote}){
  const poll = post.poll;
  const voterSet = new Set();
  poll.options.forEach(o=>(o.votes||[]).forEach(v=>voterSet.add(v)));
  const totalVoters = voterSet.size;
  const myVotes = poll.options.filter(o=>(o.votes||[]).includes(meId)).map(o=>o.id);
  return (
    <div className="poll-card">
      <div className="poll-question">📊 {poll.question}</div>
      <div className="poll-options">
        {poll.options.map(o=>{
          const votes = (o.votes||[]).length;
          const pct = totalVoters ? Math.round(votes/totalVoters*100) : 0;
          const mine = myVotes.includes(o.id);
          return (
            <button key={o.id} className={"poll-option "+(mine?'voted':'')} onClick={()=>onVote(post, o.id)}>
              <div className="poll-option-fill" style={{width:pct+'%'}}></div>
              <span className="poll-option-label">{mine ? '✓ ' : ''}{o.texte}</span>
              <span className="poll-option-pct">{pct}%</span>
            </button>
          );
        })}
      </div>
      <div className="poll-meta">{totalVoters} vote{totalVoters>1?'s':''}{poll.multiple ? ' · Choix multiple autorisé' : ''}</div>
    </div>
  );
}
function EventCard({post, meId, onRsvp}){
  const ev = post.event;
  const rsvps = ev.rsvps||{};
  const counts = {yes:0, maybe:0, no:0};
  Object.values(rsvps).forEach(s=>{ if(counts[s]!==undefined) counts[s]++; });
  const mine = rsvps[meId];
  const d = new Date(ev.date);
  const valid = !isNaN(d);
  const dateLabel = valid ? (d.toLocaleDateString('fr-FR',{weekday:'long', day:'2-digit', month:'long'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit', minute:'2-digit'})) : ev.date;
  return (
    <div className="event-card">
      <div className="event-card-head">
        <div className="event-date-badge">
          <div className="ed-day">{valid ? d.getDate() : '--'}</div>
          <div className="ed-month">{valid ? d.toLocaleDateString('fr-FR',{month:'short'}) : ''}</div>
        </div>
        <div style={{flex:1, minWidth:0}}>
          <div className="event-title">{ev.titre}</div>
          <div className="event-when">🗓️ {dateLabel}</div>
          {ev.lieu && <div className="event-where">📍 {ev.lieu}</div>}
        </div>
      </div>
      {ev.description && <div className="event-desc">{ev.description}</div>}
      <div className="event-rsvp-row">
        <button className={"event-rsvp-btn "+(mine==='yes'?'active yes':'')} onClick={()=>onRsvp(post,'yes')}>✅ Participe{counts.yes>0 ? ' · '+counts.yes : ''}</button>
        <button className={"event-rsvp-btn "+(mine==='maybe'?'active maybe':'')} onClick={()=>onRsvp(post,'maybe')}>🤔 Peut-être{counts.maybe>0 ? ' · '+counts.maybe : ''}</button>
        <button className={"event-rsvp-btn "+(mine==='no'?'active no':'')} onClick={()=>onRsvp(post,'no')}>❌ Absent{counts.no>0 ? ' · '+counts.no : ''}</button>
      </div>
    </div>
  );
}

function Activites({activites, setActivites, membres, users, currentMembre, session, chatMessages, setChatMessages, unreadChat, unreadFeed, onSeenFeed, onSeenChat}){
  const meId = currentMembre ? 'm:'+currentMembre.id : 'u:'+(session && session.username || 'moi');
  const meName = currentMembre ? (currentMembre.prenom+' '+currentMembre.nom) : ((session && session.username) || 'Moi');
  const mePhoto = (session && session.photo) || (currentMembre && currentMembre.photo) || '';
  // L'Administrateur (rôle 'admin' ou compte "Admin total") peut modérer tout le
  // contenu du module Activités : publications, commentaires et messages de chat,
  // même ceux d'un autre membre.
  const isAdmin = !!(session && (session.role==='admin' || session.isAdminTotal));

  const [tab, setTab] = useState('feed');
  const [texte, setTexte] = useState('');
  const [media, setMedia] = useState(null);
  const [medias, setMedias] = useState([]);
  const [openComments, setOpenComments] = useState({});
  const [reactionPicker, setReactionPicker] = useState({});
  const [commentDraft, setCommentDraft] = useState({});
  const [chatText, setChatText] = useState('');
  const [chatUploading, setChatUploading] = useState(false);
  const [recording, setRecording] = useState(false);
  const [chatMode, setChatMode] = useState('group'); // 'group' | 'private'
  const [activeContactId, setActiveContactId] = useState(null);
  const [contactSearch, setContactSearch] = useState('');
  const [typingUsers, setTypingUsers] = useState([]); // [{id, name, ts, scope, to}]
  const [postMenuOpen, setPostMenuOpen] = useState(null);
  const [editingPostId, setEditingPostId] = useState(null);
  const [editTexte, setEditTexte] = useState('');
  const [editMedias, setEditMedias] = useState([]);
  const [shareModalPost, setShareModalPost] = useState(null);
  const [shareTexte, setShareTexte] = useState('');
  const [burstPostId, setBurstPostId] = useState(null);
  const [activeHashtag, setActiveHashtag] = useState(null);
  const [viewingStoryAuthor, setViewingStoryAuthor] = useState(null);
  const [storyUploading, setStoryUploading] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const [lastSeenNotif, setLastSeenNotif] = useState('');
  const [replyDraft, setReplyDraft] = useState(null);
  const [msgReactionPicker, setMsgReactionPicker] = useState(null);
  const [onlineIds, setOnlineIds] = useState([]);
  const [seenReceipts, setSeenReceipts] = useState({});
  const [composerMode, setComposerMode] = useState('texte'); // 'texte' | 'sondage' | 'evenement'
  const [pollQuestion, setPollQuestion] = useState('');
  const [pollOptions, setPollOptions] = useState(['','']);
  const [pollMultiple, setPollMultiple] = useState(false);
  const [eventTitre, setEventTitre] = useState('');
  const [eventDate, setEventDate] = useState('');
  const [eventLieu, setEventLieu] = useState('');
  const [eventDesc, setEventDesc] = useState('');
  const chat = chatMessages || [];
  const chatBodyRef = useRef(null);
  const typingChannelRef = useRef(null);
  const lastTypingSentRef = useRef(0);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);
  const lastSeenPrivateRef = useRef({});

  useEffect(()=>{
    try{ setLastSeenNotif(localStorage.getItem('cercle_lastseen_notif_'+(session&&session.username)) || ''); }catch(e){}
  }, [session && session.username]);

  // Liste des autres comptes actifs pour la messagerie privée : identifiant harmonisé
  // avec meId ('m:'+membreId si un membre est lié, sinon 'u:'+username), nom et photo
  // résolus depuis le membre lié ou, à défaut, depuis le compte lui-même.
  const contacts = (users||[])
    .filter(u => u.id!==(session && session.id) && u.actif!==false)
    .map(u => {
      const m = membres.find(x=>x.id===u.membreId);
      return {
        id: u.membreId ? 'm:'+u.membreId : 'u:'+u.username,
        name: m ? (m.prenom+' '+m.nom) : u.username,
        photo: u.photo || (m && m.photo) || '',
        poste: u.poste,
      };
    });
  const activeContact = contacts.find(c=>c.id===activeContactId) || null;
  const peopleById = {}; contacts.forEach(c=>{ peopleById[c.id]=c; }); peopleById[meId] = {id:meId, name:meName, photo:mePhoto};
  const nameForId = (id) => (peopleById[id]||{}).name || 'Quelqu\'un';
  const photoForId = (id) => (peopleById[id]||{}).photo || '';

  function privateThreadWith(contactId){
    return chat.filter(m => m.destinataireId && ((m.auteurId===meId && m.destinataireId===contactId) || (m.auteurId===contactId && m.destinataireId===meId)));
  }
  const contactsSorted = [...contacts].map(c=>{
    const thread = privateThreadWith(c.id);
    const last = thread.length ? thread.reduce((a,b)=> (a.date>b.date?a:b)) : null;
    const unread = thread.filter(m=>m.auteurId===c.id && (!lastSeenPrivateRef.current[c.id] || m.date>lastSeenPrivateRef.current[c.id])).length;
    return {...c, last, unread, online: onlineIds.includes(c.id)};
  }).sort((a,b)=>{
    if(a.last && b.last) return b.last.date.localeCompare(a.last.date);
    if(a.last) return -1;
    if(b.last) return 1;
    return a.name.localeCompare(b.name);
  });
  const filteredContacts = contactsSorted.filter(c => !contactSearch.trim() || c.name.toLowerCase().includes(contactSearch.trim().toLowerCase()));

  const groupMessages = chat.filter(m=>!m.destinataireId);
  const privateMessages = activeContact ? privateThreadWith(activeContact.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')) : [];
  const visibleMessages = chatMode==='group' ? groupMessages : privateMessages;

  // Présence temps réel : qui est actuellement connecté au module Activités.
  useEffect(()=>{
    const channel = cercleSupabase.channel('cercle_presence', {config:{presence:{key:meId}}});
    channel.on('presence', {event:'sync'}, ()=>{
      setOnlineIds(Object.keys(channel.presenceState()));
    }).subscribe(async (status)=>{
      if(status==='SUBSCRIBED'){ try{ await channel.track({name:meName, ts:Date.now()}); }catch(e){} }
    });
    return ()=>{ cercleSupabase.removeChannel(channel); };
  }, [meId]);

  // Canal de diffusion "en train d'écrire" + "vu à" : indépendant des tables (pas de persistance),
  // basé sur le broadcast temps réel Supabase, actif tant que le module Activités est ouvert.
  // scope 'group' = discussion de groupe ; scope 'private' + to=meId = message privé qui m'est destiné.
  useEffect(()=>{
    const channel = cercleSupabase.channel('cercle_chat_typing', {config:{broadcast:{self:false}}});
    channel.on('broadcast', {event:'typing'}, ({payload})=>{
      if(!payload || payload.id===meId) return;
      if(payload.scope==='private' && payload.to!==meId) return;
      setTypingUsers(prev=>{
        const others = prev.filter(t=>!(t.id===payload.id && t.scope===payload.scope));
        return [...others, {id:payload.id, name:payload.name, ts:Date.now(), scope:payload.scope, to:payload.to}];
      });
    }).on('broadcast', {event:'seen'}, ({payload})=>{
      if(!payload || payload.to!==meId) return;
      setSeenReceipts(prev=>({...prev, [payload.from]: payload.ts}));
    }).subscribe();
    typingChannelRef.current = channel;
    return ()=>{ cercleSupabase.removeChannel(channel); typingChannelRef.current = null; };
  }, [meId]);

  // Signale au contact ouvert que ses messages viennent d'être vus.
  useEffect(()=>{
    if(chatMode==='private' && activeContact && typingChannelRef.current){
      typingChannelRef.current.send({type:'broadcast', event:'seen', payload:{from:meId, to:activeContact.id, ts:new Date().toISOString()}});
    }
  }, [activeContactId, chat.length]);

  // Purge les indicateurs "en train d'écrire" restés inactifs plus de 3s.
  useEffect(()=>{
    const t = setInterval(()=>{
      setTypingUsers(prev=>{
        const now = Date.now();
        const next = prev.filter(v=> now-v.ts < 3000);
        return next.length===prev.length ? prev : next;
      });
    }, 1000);
    return ()=>clearInterval(t);
  }, []);

  function notifyTyping(){
    if(!typingChannelRef.current) return;
    if(chatMode==='private' && !activeContact) return;
    const now = Date.now();
    if(now - lastTypingSentRef.current < 1200) return;
    lastTypingSentRef.current = now;
    const payload = {id:meId, name:meName.split(' ')[0], scope: chatMode};
    if(chatMode==='private') payload.to = activeContact.id;
    typingChannelRef.current.send({type:'broadcast', event:'typing', payload});
  }
  function handleChatTextChange(e){
    setChatText(e.target.value);
    notifyTyping();
  }
  const visibleTyping = typingUsers.filter(t => chatMode==='group' ? t.scope==='group' : (t.scope==='private' && activeContact && t.id===activeContact.id));

  // Marque le tchat / le fil comme "lu" (utilisé pour la pastille de notification globale dans la navigation)
  // dès que l'onglet correspondant est actif, y compris à l'arrivée sur la page.
  useEffect(()=>{
    if(tab==='chat'){
      onSeenChat && onSeenChat();
      if(chatBodyRef.current) chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    } else if(tab==='feed'){
      onSeenFeed && onSeenFeed();
    }
  }, [chat, tab]);

  // Marque la conversation privée ouverte comme lue (pastille locale dans la liste des contacts).
  useEffect(()=>{
    if(chatMode==='private' && activeContact){
      lastSeenPrivateRef.current[activeContact.id] = new Date().toISOString();
      if(chatBodyRef.current) chatBodyRef.current.scrollTop = chatBodyRef.current.scrollHeight;
    }
  }, [activeContactId, chat]);

  const [mediaUploading, setMediaUploading] = useState(false);
  function pickFile(kind){
    return async (e) => {
      const f = e.target.files[0]; if(!f) return;
      const maxMB = kind==='video' ? 12 : 5;
      if(f.size > maxMB*1024*1024){
        showToast("Fichier trop volumineux (max "+maxMB+" Mo).");
        e.target.value=''; return;
      }
      setMediaUploading(true);
      try{
        const url = await uploadToStorage(f, 'activites');
        setMedia({type:kind, data:url, name:f.name});
      }catch(err){ showToast("Échec de l'envoi du média."); }
      setMediaUploading(false);
      e.target.value='';
    };
  }
  async function pickImages(e){
    const files = Array.from(e.target.files||[]); if(!files.length) return;
    const room = Math.max(0, 6-medias.length);
    if(room<=0){ showToast("Maximum 6 photos par publication."); e.target.value=''; return; }
    setMediaUploading(true);
    const uploaded = [];
    for(const f of files.slice(0, room)){
      if(f.size > 5*1024*1024){ showToast("Photo trop volumineuse ignorée (max 5 Mo) : "+f.name); continue; }
      try{ const url = await uploadToStorage(f, 'activites'); uploaded.push({type:'image', data:url, name:f.name}); }
      catch(err){ showToast("Échec de l'envoi d'une photo."); }
    }
    setMedias(m=>[...m, ...uploaded]);
    setMediaUploading(false);
    e.target.value='';
  }

  function publier(){
    const t = texte.trim();
    if(!t && !media && medias.length===0) return;
    const post = {
      id: uid('act'), date: new Date().toISOString(),
      auteurId: meId, auteurNom: meName, auteurPhoto: mePhoto,
      texte: t, media: media, medias: medias.length?medias:null,
      mentions: extractMentions(t, contacts),
      likes: [], comments: []
    };
    setActivites([post, ...activites]);
    setTexte(''); setMedia(null); setMedias([]);
  }

  // ---- Sondages ----
  function updatePollOption(i, val){ setPollOptions(opts=>opts.map((o,j)=>j===i?val:o)); }
  function addPollOption(){ setPollOptions(opts=> opts.length<5 ? [...opts,''] : opts); }
  function removePollOption(i){ setPollOptions(opts=> opts.length>2 ? opts.filter((_,j)=>j!==i) : opts); }
  function publierSondage(){
    const q = pollQuestion.trim();
    const opts = pollOptions.map(o=>o.trim()).filter(Boolean);
    if(!q || opts.length<2) return;
    const post = {
      id: uid('act'), date: new Date().toISOString(),
      auteurId: meId, auteurNom: meName, auteurPhoto: mePhoto,
      texte:'', media:null, medias:null, mentions:[], reactions:{}, comments:[],
      poll: { question:q, multiple:pollMultiple, options: opts.map(t=>({id:uid('opt'), texte:t, votes:[]})) }
    };
    setActivites([post, ...activites]);
    setPollQuestion(''); setPollOptions(['','']); setPollMultiple(false); setComposerMode('texte');
  }
  function votePoll(post, optionId){
    const poll = post.poll;
    const already = (poll.options.find(o=>o.id===optionId)||{votes:[]}).votes.includes(meId);
    let updatedOptions;
    if(poll.multiple){
      updatedOptions = poll.options.map(o=> o.id===optionId ? {...o, votes: already ? o.votes.filter(v=>v!==meId) : [...o.votes, meId]} : o);
    } else {
      updatedOptions = poll.options.map(o=>{
        if(o.id===optionId) return {...o, votes: already ? [] : [meId]};
        return {...o, votes:(o.votes||[]).filter(v=>v!==meId)};
      });
    }
    const updated = {...post, poll:{...poll, options:updatedOptions}};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }

  // ---- Événements ----
  function publierEvenement(){
    const titre = eventTitre.trim();
    if(!titre || !eventDate) return;
    const post = {
      id: uid('act'), date: new Date().toISOString(),
      auteurId: meId, auteurNom: meName, auteurPhoto: mePhoto,
      texte:'', media:null, medias:null, mentions:[], reactions:{}, comments:[],
      event: { titre, date: eventDate, lieu: eventLieu.trim(), description: eventDesc.trim(), rsvps:{} }
    };
    setActivites([post, ...activites]);
    setEventTitre(''); setEventDate(''); setEventLieu(''); setEventDesc(''); setComposerMode('texte');
  }
  function rsvpEvent(post, status){
    const current = (post.event.rsvps||{})[meId];
    const nextRsvps = {...(post.event.rsvps||{})};
    if(current===status) delete nextRsvps[meId]; else nextRsvps[meId] = status;
    const updated = {...post, event:{...post.event, rsvps: nextRsvps}};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }

  // ---- Épinglage (modération) ----
  function togglePin(post){
    setActivites(activites.map(a=>a.id===post.id?{...a, isPinned:!a.isPinned}:a));
    setPostMenuOpen(null);
  }

  async function ajouterStory(e){
    const f = e.target.files[0]; if(!f) return;
    const isVideo = f.type.startsWith('video');
    if(f.size > (isVideo?12:5)*1024*1024){ showToast("Fichier trop volumineux (max "+(isVideo?12:5)+" Mo)."); e.target.value=''; return; }
    setStoryUploading(true);
    try{
      const url = await uploadToStorage(f, 'activites');
      const story = {id:uid('sty'), type:'story', date:new Date().toISOString(), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, media:{type:isVideo?'video':'image', data:url}, texte:'', seenBy:[meId]};
      setActivites([story, ...activites]);
    }catch(err){ showToast("Échec de l'envoi de la story."); }
    setStoryUploading(false);
    e.target.value='';
  }
  function marquerStoryVue(story){
    if((story.seenBy||[]).includes(meId)) return;
    setActivites(activites.map(a=>a.id===story.id ? {...a, seenBy:[...(a.seenBy||[]), meId]} : a));
  }

  function setReaction(post, type){
    const current = getReactions(post);
    const nextMap = {...current};
    if(nextMap[meId] === type) delete nextMap[meId];
    else nextMap[meId] = type;
    const updated = {...post, reactions: nextMap, likes: undefined};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }
  function onMainReactionClick(post){
    const mine = getReactions(post)[meId];
    setReaction(post, mine || 'like');
  }
  function toggleReactionPicker(id){
    setReactionPicker(p=>({...p, [id]: !p[id]}));
  }
  function handleDoubleTapLike(post){
    if(!getReactions(post)[meId]) setReaction(post, 'love');
    setBurstPostId(post.id);
    setTimeout(()=>setBurstPostId(b=> b===post.id ? null : b), 700);
  }

  function addComment(post){
    const txt = (commentDraft[post.id]||'').trim();
    if(!txt) return;
    const c = {id:uid('cmt'), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, texte:txt, date:new Date().toISOString(), mentions:extractMentions(txt, contacts)};
    const updated = {...post, comments:[...(post.comments||[]), c]};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
    setCommentDraft({...commentDraft, [post.id]:''});
  }

  function removeComment(post, commentId){
    if(!confirm('Supprimer ce commentaire ?')) return;
    const updated = {...post, comments:(post.comments||[]).filter(c=>c.id!==commentId)};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
  }

  function removePost(id){
    // Auteur de la publication OU Administrateur.
    if(!confirm('Supprimer cette publication ?')) return;
    setActivites(activites.filter(a=>a.id!==id));
    setPostMenuOpen(null);
  }
  function startEdit(post){
    setEditingPostId(post.id);
    setEditTexte(post.texte||'');
    setEditMedias(post.medias||[]);
    setPostMenuOpen(null);
  }
  function saveEdit(post){
    const t = editTexte.trim();
    const updated = {...post, texte:t, medias: editMedias.length?editMedias:null, mentions: extractMentions(t, contacts), edited:true, editedAt:new Date().toISOString()};
    setActivites(activites.map(a=>a.id===post.id?updated:a));
    setEditingPostId(null);
  }
  function openShare(post){ setShareModalPost(post); setShareTexte(''); setPostMenuOpen(null); }
  function confirmShare(){
    const post = shareModalPost; if(!post) return;
    const snap = {id:post.id, auteurId:post.auteurId, auteurNom:post.auteurNom, auteurPhoto:post.auteurPhoto, texte:post.texte, media:post.media||null, medias:post.medias||null, date:post.date};
    const t = shareTexte.trim();
    const newPost = {id:uid('act'), date:new Date().toISOString(), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, texte:t, media:null, medias:null, reactions:{}, comments:[], repostOf:snap, mentions:extractMentions(t, contacts)};
    setActivites([newPost, ...activites]);
    setShareModalPost(null); setShareTexte('');
  }

  async function sendChatMessage({texte, media}){
    const destinataireId = chatMode==='private' && activeContact ? activeContact.id : null;
    const msg = {id:uid('msg'), auteurId:meId, auteurNom:meName, auteurPhoto:mePhoto, destinataireId, texte: texte||'', media: media||null, date:new Date().toISOString(), replyTo: replyDraft||null};
    setChatMessages && setChatMessages(c=>[...c, msg]);
    setReplyDraft(null);
    await cercleSupabase.from('chat_messages').insert({id:msg.id, data:{auteurId:msg.auteurId, auteurNom:msg.auteurNom, auteurPhoto:msg.auteurPhoto, destinataireId:msg.destinataireId, texte:msg.texte, media:msg.media, date:msg.date, replyTo:msg.replyTo}});
  }
  async function sendChat(){
    const t = chatText.trim(); if(!t) return;
    setChatText('');
    await sendChatMessage({texte:t});
  }
  async function updateChatMessage(id, patch){
    const current = chat.find(m=>m.id===id); if(!current) return;
    const merged = {...current, ...patch};
    setChatMessages && setChatMessages(c=>c.map(x=>x.id===id?merged:x));
    await cercleSupabase.from('chat_messages').update({data:{auteurId:merged.auteurId, auteurNom:merged.auteurNom, auteurPhoto:merged.auteurPhoto, destinataireId:merged.destinataireId||null, texte:merged.texte||'', media:merged.media||null, date:merged.date, reactions:merged.reactions||{}, replyTo:merged.replyTo||null}}).eq('id', id);
  }
  function setMsgReaction(m, type){
    const current = getReactions(m);
    const next = {...current};
    if(next[meId]===type) delete next[meId]; else next[meId] = type;
    updateChatMessage(m.id, {reactions:next, likes:undefined});
    setMsgReactionPicker(null);
  }
  async function removeChatMessage(m){
    // Auteur du message OU Administrateur (droit total sur la messagerie).
    if(!confirm('Supprimer ce message ?')) return;
    setChatMessages && setChatMessages(c=>c.filter(x=>x.id!==m.id));
    await cercleSupabase.from('chat_messages').delete().eq('id', m.id);
  }
  async function pickChatFile(e){
    const f = e.target.files[0]; if(!f) return;
    if(f.size > 15*1024*1024){ showToast('Fichier trop volumineux (max 15 Mo).'); e.target.value=''; return; }
    setChatUploading(true);
    try{
      const url = await uploadToStorage(f, 'chat');
      await sendChatMessage({media:{type:'file', data:url, name:f.name}});
    }catch(err){ showToast("Échec de l'envoi du fichier."); }
    setChatUploading(false);
    e.target.value='';
  }
  async function startRecording(){
    if(recording) return;
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mr = new MediaRecorder(stream);
      chunksRef.current = [];
      mr.ondataavailable = (e)=>{ if(e.data.size>0) chunksRef.current.push(e.data); };
      mr.onstop = async ()=>{
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(chunksRef.current, {type:'audio/webm'});
        if(blob.size > 0){
          setChatUploading(true);
          try{
            const file = new File([blob], 'vocal_'+Date.now()+'.webm', {type:'audio/webm'});
            const url = await uploadToStorage(file, 'chat');
            await sendChatMessage({media:{type:'audio', data:url, name:file.name}});
          }catch(err){ showToast("Échec de l'envoi du message vocal."); }
          setChatUploading(false);
        }
      };
      mr.start();
      mediaRecorderRef.current = mr;
      setRecording(true);
    }catch(err){
      showToast("Impossible d'accéder au microphone.");
    }
  }
  function stopRecording(){
    if(mediaRecorderRef.current && mediaRecorderRef.current.state==='recording'){
      mediaRecorderRef.current.stop();
    }
    setRecording(false);
  }

  // ---- Dérivés : posts du fil vs stories (24h), filtre hashtag ----
  const allStories = activites.filter(a=>a.type==='story' && (Date.now() - new Date(a.date).getTime()) < STORY_TTL_MS);
  let sorted = [...activites].filter(a=>a.type!=='story').sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  if(activeHashtag){
    const needle = '#'+activeHashtag.toLowerCase();
    sorted = sorted.filter(a => (a.texte||'').toLowerCase().includes(needle));
  }
  sorted = [...sorted].sort((a,b)=> (b.isPinned?1:0)-(a.isPinned?1:0));

  // ---- Notifications calculées à partir des données existantes (pas de table dédiée) ----
  const notifications = [];
  activites.filter(a=>a.type!=='story').forEach(a=>{
    if(a.auteurId===meId){
      Object.entries(getReactions(a)).forEach(([uidR,type])=>{
        if(uidR===meId) return;
        notifications.push({id:'r_'+a.id+'_'+uidR, date:a.date, name:nameForId(uidR), photo:photoForId(uidR), text:nameForId(uidR)+' a réagi '+(REACTION_MAP[type]||REACTION_MAP.like).emoji+' à votre publication'});
      });
      (a.comments||[]).forEach(c=>{
        if(c.auteurId===meId) return;
        notifications.push({id:'c_'+c.id, date:c.date, name:c.auteurNom, photo:c.auteurPhoto, text:c.auteurNom+' a commenté votre publication : "'+c.texte.slice(0,60)+'"'});
      });
    }
    if((a.mentions||[]).includes(meId) && a.auteurId!==meId){
      notifications.push({id:'m_'+a.id, date:a.date, name:a.auteurNom, photo:a.auteurPhoto, text:a.auteurNom+' vous a mentionné dans une publication'});
    }
    (a.comments||[]).forEach(c=>{
      if((c.mentions||[]).includes(meId) && c.auteurId!==meId){
        notifications.push({id:'cm_'+c.id, date:c.date, name:c.auteurNom, photo:c.auteurPhoto, text:c.auteurNom+' vous a mentionné dans un commentaire'});
      }
    });
  });
  notifications.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const unreadNotif = notifications.filter(n=> n.date > (lastSeenNotif||'')).length;
  function toggleNotif(){
    setNotifOpen(o=>{
      const next = !o;
      if(next){
        const now = new Date().toISOString();
        setLastSeenNotif(now);
        try{ localStorage.setItem('cercle_lastseen_notif_'+(session&&session.username), now); }catch(e){}
      }
      return next;
    });
  }

  // ---- Mentions : autocomplétion dans le composeur ----
  const mentionMatch = (()=>{ const m = texte.match(/@([\p{L}0-9_]*)$/u); return m ? m[1] : null; })();
  const mentionResults = mentionMatch!==null ? contacts.filter(c=>c.name.toLowerCase().includes(mentionMatch.toLowerCase())).slice(0,5) : [];
  function pickMention(c){ setTexte(t => t.replace(/@([\p{L}0-9_]*)$/u, '@'+c.name+' ')); }

  const lastMineMsgId = (()=>{
    if(chatMode!=='private' || !activeContact) return null;
    const mineMsgs = visibleMessages.filter(m=>m.auteurId===meId);
    return mineMsgs.length ? mineMsgs[mineMsgs.length-1].id : null;
  })();

  return (
    <div>
      {viewingStoryAuthor && <StoryViewer stories={allStories} authorId={viewingStoryAuthor} onClose={()=>setViewingStoryAuthor(null)} onSeen={marquerStoryVue}/>}
      {notifOpen && <NotificationsPanel items={notifications} onClose={()=>setNotifOpen(false)}/>}
      {shareModalPost && (
        <Modal title="Partager la publication" onClose={()=>setShareModalPost(null)}>
          <div className="repost-preview">
            <div className="post-head"><Avatar photo={shareModalPost.auteurPhoto} name={shareModalPost.auteurNom}/><div className="who"><div className="name">{shareModalPost.auteurNom}</div><div className="meta">{fmtDateTime(shareModalPost.date)}</div></div></div>
            {shareModalPost.texte && <p className="post-text">{shareModalPost.texte}</p>}
          </div>
          <Field label="Ajouter un commentaire (optionnel)">
            <textarea className="textarea" value={shareTexte} onChange={e=>setShareTexte(e.target.value)} placeholder="Votre avis sur cette publication…"/>
          </Field>
          <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
            <button className="btn btn-outline" onClick={()=>setShareModalPost(null)}>Annuler</button>
            <button className="btn btn-primary" onClick={confirmShare}>Partager</button>
          </div>
        </Modal>
      )}
      <div className="feed-wrap">
        <div className="tabs no-print" style={{marginBottom:16, alignItems:'center'}}>
          <button className={"tab "+(tab==='feed'?'active':'')} onClick={()=>setTab('feed')} style={{position:'relative'}}>
            📣 Fil d'actualité
            {unreadFeed>0 && tab!=='feed' && <span className="chat-unread-dot">{unreadFeed>9?'9+':unreadFeed}</span>}
          </button>
          <button className={"tab "+(tab==='chat'?'active':'')} onClick={()=>setTab('chat')} style={{position:'relative'}}>
            💬 Discussion de groupe
            {unreadChat>0 && tab!=='chat' && <span className="chat-unread-dot">{unreadChat>9?'9+':unreadChat}</span>}
          </button>
          <button className="notif-bell" onClick={toggleNotif} title="Notifications">
            🔔{unreadNotif>0 && <span className="chat-unread-dot">{unreadNotif>9?'9+':unreadNotif}</span>}
          </button>
        </div>

        {tab==='feed' && (
          <React.Fragment>
            <StoriesBar stories={allStories} meId={meId} meName={meName} mePhoto={mePhoto} onAddStory={ajouterStory} onOpenStory={setViewingStoryAuthor} uploading={storyUploading}/>

            <div className="card composer">
              <div className="composer-mode-switch no-print">
                <button className={"composer-mode-btn "+(composerMode==='texte'?'active':'')} onClick={()=>setComposerMode('texte')}>📝 Publication</button>
                <button className={"composer-mode-btn "+(composerMode==='sondage'?'active':'')} onClick={()=>setComposerMode('sondage')}>📊 Sondage</button>
                <button className={"composer-mode-btn "+(composerMode==='evenement'?'active':'')} onClick={()=>setComposerMode('evenement')}>📅 Événement</button>
              </div>

              {composerMode==='texte' && (
                <React.Fragment>
                  <div className="composer-top">
                    <Avatar photo={mePhoto} name={meName}/>
                    <div style={{flex:1, position:'relative'}}>
                      <div className="composer-label">Partager avec le groupe</div>
                      <textarea className="composer-input" placeholder={"Quoi de neuf, "+meName.split(' ')[0]+" ? Écrivez un message, une annonce, un compte-rendu… (@mentionner, #mot-clé)"} value={texte} onChange={e=>setTexte(e.target.value)}/>
                      {mentionResults.length>0 && (
                        <div className="mention-dropdown">
                          {mentionResults.map(c=>(
                            <button key={c.id} className="mention-dropdown-item" onClick={()=>pickMention(c)}>
                              <Avatar photo={c.photo} name={c.name}/><span>{c.name}</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                  {media && (
                    <div className="composer-media-preview">
                      <button className="composer-media-remove" onClick={()=>setMedia(null)}>✕</button>
                      {media.type==='video' && <video src={media.data} controls/>}
                      {media.type==='audio' && <audio src={media.data} controls/>}
                    </div>
                  )}
                  {medias.length>0 && (
                    <div className="composer-gallery-preview">
                      {medias.map((m,i)=>(
                        <div key={i} className="composer-gallery-thumb">
                          <img src={m.data} alt=""/>
                          <button onClick={()=>setMedias(medias.filter((_,j)=>j!==i))}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div className="composer-actions">
                    <div className="composer-attach">
                      <label className="composer-attach-btn"><span className="ic">🖼️</span><span className="label-text">Photos</span><input type="file" accept="image/*" multiple hidden onChange={pickImages}/></label>
                      <label className="composer-attach-btn"><span className="ic">🎬</span><span className="label-text">Vidéo</span><input type="file" accept="video/*" hidden onChange={pickFile('video')}/></label>
                      <label className="composer-attach-btn"><span className="ic">🎙️</span><span className="label-text">Audio</span><input type="file" accept="audio/*" hidden onChange={pickFile('audio')}/></label>
                    </div>
                    <button className="btn btn-primary btn-sm" disabled={mediaUploading || (!texte.trim() && !media && medias.length===0)} onClick={publier}>{mediaUploading ? 'Envoi du média…' : 'Publier'}</button>
                  </div>
                </React.Fragment>
              )}

              {composerMode==='sondage' && (
                <div className="poll-composer">
                  <div className="composer-label">Question du sondage</div>
                  <input className="input" placeholder="Posez votre question…" value={pollQuestion} onChange={e=>setPollQuestion(e.target.value)}/>
                  <div className="composer-label" style={{marginTop:12}}>Options</div>
                  {pollOptions.map((opt,i)=>(
                    <div key={i} className="poll-option-input-row">
                      <input className="input" placeholder={"Option "+(i+1)} value={opt} onChange={e=>updatePollOption(i, e.target.value)}/>
                      {pollOptions.length>2 && <button className="poll-option-remove" onClick={()=>removePollOption(i)} title="Retirer">✕</button>}
                    </div>
                  ))}
                  {pollOptions.length<5 && <button className="link-btn" style={{marginTop:8, display:'block'}} onClick={addPollOption}>+ Ajouter une option</button>}
                  <label className="poll-multiple-check">
                    <input type="checkbox" checked={pollMultiple} onChange={e=>setPollMultiple(e.target.checked)}/> Autoriser plusieurs choix
                  </label>
                  <div className="composer-actions" style={{borderTop:'none', paddingTop:4}}>
                    <div></div>
                    <button className="btn btn-primary btn-sm" disabled={!pollQuestion.trim() || pollOptions.filter(o=>o.trim()).length<2} onClick={publierSondage}>Publier le sondage</button>
                  </div>
                </div>
              )}

              {composerMode==='evenement' && (
                <div className="event-composer">
                  <div className="composer-label">Titre de l'événement</div>
                  <input className="input" placeholder="Ex : Assemblée générale annuelle" value={eventTitre} onChange={e=>setEventTitre(e.target.value)}/>
                  <div className="two-col" style={{marginTop:12}}>
                    <div>
                      <div className="composer-label">Date et heure</div>
                      <input className="input" type="datetime-local" value={eventDate} onChange={e=>setEventDate(e.target.value)}/>
                    </div>
                    <div>
                      <div className="composer-label">Lieu</div>
                      <input className="input" placeholder="Ex : Salle des fêtes, Cocody" value={eventLieu} onChange={e=>setEventLieu(e.target.value)}/>
                    </div>
                  </div>
                  <div className="composer-label" style={{marginTop:12}}>Description (optionnel)</div>
                  <textarea className="textarea" placeholder="Détails de l'événement…" value={eventDesc} onChange={e=>setEventDesc(e.target.value)}/>
                  <div className="composer-actions" style={{borderTop:'none', paddingTop:4}}>
                    <div></div>
                    <button className="btn btn-primary btn-sm" disabled={!eventTitre.trim() || !eventDate} onClick={publierEvenement}>Publier l'événement</button>
                  </div>
                </div>
              )}
            </div>

            {activeHashtag && (
              <div className="hashtag-filter-chip">
                Filtré par <strong>#{activeHashtag}</strong>
                <button onClick={()=>setActiveHashtag(null)}>✕</button>
              </div>
            )}

            {sorted.length===0 ? (
              <div className="card" style={{padding:24}}><EmptyState glyph="📣" title="Aucune publication" sub="Soyez le premier à partager une photo, une vidéo ou un message."/></div>
            ) : sorted.map(post=>{
              const postReactions = getReactions(post);
              const myReaction = postReactions[meId];
              const commentsOpen = !!openComments[post.id];
              const reactionCounts = {};
              Object.values(postReactions).forEach(t=>{ reactionCounts[t] = (reactionCounts[t]||0)+1; });
              const topReactionEmojis = Object.entries(reactionCounts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t])=>(REACTION_MAP[t]||REACTION_MAP.like).emoji);
              const nbReactions = Object.keys(postReactions).length;
              const nbComments = (post.comments||[]).length;
              const isEditing = editingPostId===post.id;
              const gallery = post.medias || (post.media && post.media.type==='image' ? [post.media] : null);
              return (
                <div className={"card post-card"+(post.isPinned?' pinned':'')} key={post.id}>
                  <div className="post-head">
                    <Avatar photo={post.auteurPhoto} name={post.auteurNom}/>
                    <div className="who">
                      <div className="name">{post.auteurNom}</div>
                      <div className="meta">{post.isPinned && <span className="pinned-badge">📌 Épinglé · </span>}{fmtDateTime(post.date)}{post.edited && <span> · Modifié</span>}</div>
                    </div>
                    {(post.auteurId===meId || isAdmin) && (
                      <div style={{position:'relative'}}>
                        <button className="post-menu-btn" onClick={()=>setPostMenuOpen(postMenuOpen===post.id?null:post.id)} title="Options">⋮</button>
                        {postMenuOpen===post.id && (
                          <React.Fragment>
                            <div className="reaction-picker-overlay" onClick={()=>setPostMenuOpen(null)}></div>
                            <div className="post-menu-dropdown">
                              {post.auteurId===meId && !post.poll && !post.event && <button onClick={()=>startEdit(post)}>✏️ Modifier</button>}
                              {isAdmin && <button onClick={()=>togglePin(post)}>{post.isPinned ? '📌 Désépingler' : '📌 Épingler en haut'}</button>}
                              <button onClick={()=>removePost(post.id)}>🗑️ Supprimer</button>
                            </div>
                          </React.Fragment>
                        )}
                      </div>
                    )}
                  </div>

                  {isEditing ? (
                    <div className="post-edit-zone">
                      <textarea className="textarea" value={editTexte} onChange={e=>setEditTexte(e.target.value)}/>
                      {editMedias.length>0 && (
                        <div className="composer-gallery-preview">
                          {editMedias.map((m,i)=>(
                            <div key={i} className="composer-gallery-thumb">
                              <img src={m.data} alt=""/>
                              <button onClick={()=>setEditMedias(editMedias.filter((_,j)=>j!==i))}>✕</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:8}}>
                        <button className="btn btn-outline btn-sm" onClick={()=>setEditingPostId(null)}>Annuler</button>
                        <button className="btn btn-primary btn-sm" onClick={()=>saveEdit(post)}>Enregistrer</button>
                      </div>
                    </div>
                  ) : (
                    <React.Fragment>
                      {post.texte && <p className="post-text"><RichText texte={post.texte} onHashtagClick={setActiveHashtag}/></p>}
                      {post.repostOf && (
                        <div className="repost-preview">
                          <div className="post-head"><Avatar photo={post.repostOf.auteurPhoto} name={post.repostOf.auteurNom}/><div className="who"><div className="name">{post.repostOf.auteurNom}</div><div className="meta">{fmtDateTime(post.repostOf.date)}</div></div></div>
                          {post.repostOf.texte && <p className="post-text">{post.repostOf.texte}</p>}
                          {post.repostOf.media && post.repostOf.media.type==='image' && <div className="post-media"><img src={post.repostOf.media.data} alt=""/></div>}
                          {post.repostOf.medias && post.repostOf.medias.length>0 && <div className="post-media"><img src={post.repostOf.medias[0].data} alt=""/></div>}
                        </div>
                      )}
                      {gallery && gallery.length>0 && (
                        <div className={"post-gallery n"+Math.min(gallery.length,4)} onDoubleClick={()=>handleDoubleTapLike(post)}>
                          {gallery.slice(0,4).map((m,i)=>(
                            <div className="post-gallery-cell" key={i}>
                              <img src={m.data} alt=""/>
                              {i===3 && gallery.length>4 && <div className="post-gallery-more">+{gallery.length-4}</div>}
                            </div>
                          ))}
                          {burstPostId===post.id && <div className="post-media-burst">❤️</div>}
                        </div>
                      )}
                      {post.media && post.media.type!=='image' && (
                        <div className="post-media">
                          {post.media.type==='video' && <video src={post.media.data} controls/>}
                          {post.media.type==='audio' && <audio src={post.media.data} controls/>}
                        </div>
                      )}
                      {post.poll && <PollCard post={post} meId={meId} onVote={votePoll}/>}
                      {post.event && <EventCard post={post} meId={meId} onRsvp={rsvpEvent}/>}
                    </React.Fragment>
                  )}

                  {!isEditing && (nbReactions>0 || nbComments>0) && (
                    <div className="post-stats">
                      <span className="likes">{nbReactions>0 && <>{topReactionEmojis.join('')} {nbReactions}</>}</span>
                      <span>{nbComments>0 && (nbComments+" commentaire(s)")}</span>
                    </div>
                  )}
                  {!isEditing && (
                    <div className="post-actions">
                      <div className="reaction-wrap">
                        <button className={"post-action-btn"+(myReaction?' liked':'')} onClick={()=>onMainReactionClick(post)}>
                          {myReaction ? REACTION_MAP[myReaction].emoji : '🤍'} {myReaction ? REACTION_MAP[myReaction].label : "J'aime"}
                        </button>
                        <button className="post-reaction-more" onClick={()=>toggleReactionPicker(post.id)} title="Choisir une réaction">▾</button>
                        {reactionPicker[post.id] && (
                          <React.Fragment>
                            <div className="reaction-picker-overlay" onClick={()=>toggleReactionPicker(post.id)}></div>
                            <div className="reaction-picker">
                              {REACTIONS.map(r=>(
                                <button key={r.type} className="reaction-picker-btn" title={r.label}
                                  onClick={()=>{ setReaction(post, r.type); setReactionPicker(p=>({...p, [post.id]:false})); }}>{r.emoji}</button>
                              ))}
                            </div>
                          </React.Fragment>
                        )}
                      </div>
                      <button className="post-action-btn" onClick={()=>setOpenComments({...openComments, [post.id]:!commentsOpen})}>💬 Commenter</button>
                      <button className="post-action-btn" onClick={()=>openShare(post)}>🔁 Partager</button>
                    </div>
                  )}
                  {!isEditing && commentsOpen && (
                    <div className="post-comments">
                      {(post.comments||[]).map(c=>(
                        <div key={c.id}>
                          <div className="comment-row">
                            <Avatar photo={c.auteurPhoto} name={c.auteurNom}/>
                            <div className="comment-bubble">
                              <div className="cname">{c.auteurNom}</div>
                              <div className="ctext"><RichText texte={c.texte} onHashtagClick={setActiveHashtag}/></div>
                            </div>
                            {(c.auteurId===meId || isAdmin) && (
                              <button className="post-menu-btn" style={{fontSize:12}} onClick={()=>removeComment(post, c.id)} title="Supprimer le commentaire">🗑️</button>
                            )}
                          </div>
                          <div className="comment-time">{fmtDateTime(c.date)}</div>
                        </div>
                      ))}
                      <div className="comment-form">
                        <Avatar photo={mePhoto} name={meName}/>
                        <input placeholder="Écrire un commentaire... (@mentionner)" value={commentDraft[post.id]||''}
                          onChange={e=>setCommentDraft({...commentDraft, [post.id]:e.target.value})}
                          onKeyDown={e=>{ if(e.key==='Enter') addComment(post); }}/>
                        <button disabled={!(commentDraft[post.id]||'').trim()} onClick={()=>addComment(post)}>Envoyer</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </React.Fragment>
        )}

        {tab==='chat' && (
          <div>
            <div className="chat-subnav no-print">
              <button className={"chat-subnav-btn "+(chatMode==='group'?'active':'')} onClick={()=>setChatMode('group')}>👥 Groupe</button>
              <button className={"chat-subnav-btn "+(chatMode==='private'?'active':'')} onClick={()=>setChatMode('private')}>✉️ Messages privés</button>
            </div>

            {chatMode==='private' && !activeContact && (
              <div className="card">
                <div className="contact-search-wrap">
                  <input className="input" placeholder="Rechercher un membre…" value={contactSearch} onChange={e=>setContactSearch(e.target.value)}/>
                </div>
                <div className="contact-list">
                  {filteredContacts.length===0 ? (
                    <div style={{padding:16}}><EmptyState glyph="✉️" title="Aucun membre" sub="Aucun compte disponible pour la messagerie privée."/></div>
                  ) : filteredContacts.map(c=>(
                    <button key={c.id} className="contact-row" onClick={()=>setActiveContactId(c.id)}>
                      <div className="contact-avatar-wrap">
                        <Avatar photo={c.photo} name={c.name}/>
                        {c.online && <span className="online-dot" title="En ligne"></span>}
                      </div>

/* ---------------------------- Rapports ---------------------------- */
function toCSV(rows, headers){
  const esc = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(';')];
  rows.forEach(r=> lines.push(headers.map(h=>esc(r[h])).join(';')));
  return lines.join('\n');
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function monthKey(d){ if(!d) return null; const dt = new Date(d); if(isNaN(dt)) return null; return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('fr-FR',{month:'short', year:'2-digit'}); }
function last6Months(){
  const out = []; const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  return out;
}
/* Mini graphique en barres — SVG/CSS pur, sans librairie externe. */
function BarChart({data, color}){
  if(!data || data.length===0) return <div className="hint">Pas assez de données pour ce graphique.</div>;
  const max = Math.max(1, ...data.map(d=>d.value));
  return (
    <div className="chart-bars">
      {data.map((d,i)=>(
        <div className="chart-bar-col" key={i} title={d.label+' : '+d.value}>
          <div className="chart-bar-value">{d.value}</div>
          <div className="chart-bar" style={{height:Math.max(3, d.value/max*100)+'%', background: d.color || color || 'var(--primary)'}}></div>
          <div className="chart-bar-label">{d.label}</div>
        </div>
      ))}
    </div>
  );
}
/* Mini graphique d'évolution — SVG pur. */
function LineChart({points, color}){
  if(!points || points.length===0) return <div className="hint">Pas assez de données pour ce graphique.</div>;
  const W=100, H=34, pad=4;
  const max = Math.max(1, ...points.map(p=>p.value));
  const step = points.length>1 ? (W-pad*2)/(points.length-1) : 0;
  const coords = points.map((p,i)=>({x: pad+i*step, y: H-pad-(p.value/max)*(H-pad*2)}));
  const path = coords.map((c,i)=>(i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="chart-line-svg">
        <path d={path} fill="none" stroke={color||'var(--primary)'} strokeWidth="1.6" vectorEffect="non-scaling-stroke"/>
        {coords.map((c,i)=><circle key={i} cx={c.x} cy={c.y} r="1.4" fill={color||'var(--primary)'}/>)}
      </svg>
      <div className="chart-line-labels">{points.map((p,i)=><span key={i}>{p.label}</span>)}</div>
    </div>
  );
}
