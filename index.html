<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AG</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C2540A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="AG">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<style>
:root{
  --ink:#24221D; --muted:#6B6558; --paper:#F7F5EF; --surface:#FFFFFF;
  --border:#E4E0D3; --primary:#C2540A; --primary-light:#E07C2E; --primary-dark:#7A3607;
  --gold:#E8A33D; --gold-light:#F5C878; --danger:#B3452C; --success:#3F7D52;
  --shadow: 0 1px 2px rgba(36,34,29,.06), 0 4px 16px rgba(36,34,29,.06);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#EDE9DD; --muted:#A7A090; --paper:#181712; --surface:#211F19;
  --border:#33312A; --primary:#E07C2E; --primary-light:#F0A35A; --primary-dark:#5C2A05;
  --gold:#F0B24E; --gold-light:#F5C878; --danger:#D96A4C; --success:#5AA173;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-light);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
a{color:inherit;}

/* ---------- Layout ---------- */
#root{min-height:100vh;}
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:230px; background:var(--primary-dark); color:#EFEAD9; flex-shrink:0;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-brand{padding:22px 20px 18px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,.10);}
.brand-seal{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, var(--primary-dark) 100%);
  display:flex;align-items:center;justify-content:center; color:var(--primary-dark); font-weight:700; font-family:'Fraunces',serif; font-size:16px;
  flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), 0 0 0 3px var(--primary-dark), 0 0 0 4px rgba(255,255,255,.14);
}
.brand-text .name{font-family:'Fraunces',serif; font-size:17px; font-weight:600; line-height:1.1; letter-spacing:-.01em;}
.brand-text .sub{font-family:'JetBrains Mono',monospace; font-size:10px; color:#B9C4B9; letter-spacing:.1em; text-transform:uppercase; margin-top:3px;}
.nav{flex:1; overflow-y:auto; padding:14px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:13.5px; color:#D9D3C0; text-decoration:none; border:none; background:none; width:100%; text-align:left;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff; box-shadow: inset 3px 0 0 var(--gold);}
.nav-icon{width:16px; text-align:center; opacity:.9; font-size:14px;}
.nav-badge{
  display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px;
  border-radius:99px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; margin-left:auto;
}
.bottom-nav-item{position:relative;}
.bn-badge{
  position:absolute; top:2px; right:8px; min-width:15px; height:15px; padding:0 3px;
  display:flex; align-items:center; justify-content:center; border-radius:99px; background:var(--danger);
  color:#fff; font-size:9px; font-weight:700; line-height:1;
}
.sidebar-footer{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#AEB8AE;}
.user-chip{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:600; color:#fff; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 2px rgba(255,255,255,.12);}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.logout-btn{background:none;border:none;color:#D9D3C0; font-size:12px; text-decoration:underline; padding:0;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--surface); padding:14px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  border-bottom:1px solid var(--border);
  position:relative;
}
.topbar::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px;
  background:linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}
.topbar-left{display:flex; align-items:center; gap:13px; min-width:0;}
.topbar-brand-icon{
  font-size:17px; line-height:1; width:36px; height:36px; border-radius:10px; flex-shrink:0;
  background:var(--paper); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.page-title{font-size:19px; font-weight:600; display:flex; align-items:center; gap:9px; letter-spacing:-.01em;}
.page-eyebrow{font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-weight:600;}
.page-role{font-size:12px; color:var(--muted); margin-top:1px;}
.content{padding:24px 28px 60px; flex:1;}

.topbar-right{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.clock-chip{
  font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); font-weight:600;
  letter-spacing:.02em; padding:7px 11px; border:1px solid var(--border); border-radius:99px; background:var(--paper);
}
.theme-toggle{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
  transition:border-color .12s ease, transform .1s ease;
}
.theme-toggle:hover{border-color:var(--gold); transform:translateY(-1px);}
.avatar-menu-wrap{position:relative; flex-shrink:0;}
.avatar-trigger{
  display:flex; align-items:center; gap:6px; background:none; border:none; padding:2px; border-radius:99px;
}
.avatar-circle{
  width:36px; height:36px; border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
  overflow:hidden; box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--border);
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}
.avatar-dropdown .head{display:flex; align-items:center; gap:10px;}
.avatar-dropdown .head-avatar{width:38px;height:38px;border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light)); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; overflow:hidden;}
.avatar-dropdown .head-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-photo-row{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
.profile-photo-preview{width:64px;height:64px;border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light)); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:22px; flex-shrink:0; overflow:hidden;}
.profile-photo-preview img{width:100%;height:100%;object-fit:cover;}
.avatar-caret{font-size:10px; color:var(--muted);}
.avatar-dropdown{
  position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:0 12px 32px rgba(0,0,0,.16); min-width:190px; z-index:40; overflow:hidden;
  animation:dropIn .12s ease;
}
@keyframes dropIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
.avatar-dropdown .head{padding:12px 14px; border-bottom:1px solid var(--border);}
.avatar-dropdown .head .u{font-weight:700; font-size:13.5px;}
.avatar-dropdown .head .r{font-size:11.5px; color:var(--muted); margin-top:1px;}
.avatar-dropdown button{
  display:block; width:100%; text-align:left; padding:10px 14px; font-size:13px; background:none; border:none; color:var(--danger); font-weight:600;
}
.avatar-dropdown button:hover{background:var(--paper);}
.avatar-menu-overlay{position:fixed; inset:0; z-index:35;}

/* ---------- Generic UI ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:7px; border:1px solid transparent;
  padding:8px 14px; font-size:13px; font-weight:600; transition:all .12s ease;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold); color:#2B2004;}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-danger{background:transparent; color:var(--danger); border-color:#E7C7BA;}
.btn-danger:hover{background:#FBEDE7;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}
.card-pad{padding:20px;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.stat-card .value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px; color:var(--primary-dark);}
.stat-card .delta{font-size:11.5px; color:var(--muted); margin-top:4px;}
.stat-card .accent-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; letter-spacing:.02em;}
.badge-green{background:#E4F1E6; color:var(--success);}
.badge-red{background:#FBEAE3; color:var(--danger);}
.badge-gold{background:#FBF1D9; color:#8A6A16;}
.badge-gray{background:#EEEBE1; color:var(--muted);}
.badge-blue{background:#E3EBF6; color:#2F5FA8;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:2px solid var(--border);}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#FBFAF6;}
.table-wrap{overflow-x:auto;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.search-input{
  border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; min-width:220px; background:var(--surface);
}
.select, .input, .textarea{
  border:1px solid var(--border); border-radius:8px; padding:8px 11px; font-size:13.5px; width:100%; background:var(--surface); color:var(--ink);
}
.textarea{resize:vertical; min-height:70px;}
label.field-label{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; display:block;}
.field{margin-bottom:14px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(24,22,17,.45); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px; backdrop-filter:blur(1px);
}
.modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.icon-btn{background:none;border:none;font-size:18px;color:var(--muted); line-height:1;}
.icon-btn:hover{color:var(--ink);}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}
.empty-state .title{font-weight:600; color:var(--ink); margin-bottom:4px;}

.avatar-photo{width:38px;height:38px;border-radius:50%; object-fit:cover; background:var(--border); flex-shrink:0;}
.avatar-fallback{width:38px;height:38px;border-radius:50%; background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;}

/* Membership card - signature element */
.member-card{
  width:340px; border-radius:16px; padding:0; position:relative; overflow:hidden;
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
  color:#fff; box-shadow:0 12px 30px rgba(18,53,48,.35);
}
.member-card::before{
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(circle at 90% 8%, rgba(201,150,43,.28), transparent 45%);
}
.member-card-top{padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:flex-start; position:relative;}
.member-card-org{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#C9D6C9;}
.member-card-org b{color:#fff;}
.member-card-seal{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.member-card-body{display:flex; gap:14px; padding:6px 18px 14px; position:relative;}
.member-card-photo{width:64px;height:64px;border-radius:10px; object-fit:cover; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); flex-shrink:0;}
.member-card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.15;}
.member-card-role{font-size:11.5px; color:#D9E4D6; margin-top:2px;}
.member-card-mat{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-light); margin-top:6px; letter-spacing:.03em;}
.member-card-strip{
  display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:rgba(0,0,0,.18);
  border-top:1px dashed rgba(255,255,255,.35); position:relative;
}
.member-card-strip .stub-dot{position:absolute; width:14px;height:14px;border-radius:50%; background:var(--paper); top:-7px;}
.member-card-strip .stub-dot.l{left:-7px;} .member-card-strip .stub-dot.r{right:-7px;}
.member-card-status{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#D9E4D6;}
.member-card img.qr{width:52px;height:52px; border-radius:6px; background:#fff; padding:3px;}

/* Receipt - carnet à souche style */
.receipt{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  position:relative; padding:22px 24px;
}
.receipt::before, .receipt::after{
  content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--paper); border:1px solid var(--border);
  top:50%; transform:translateY(-50%);
}
.receipt::before{left:-9px;} .receipt::after{right:-9px;}
.receipt-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px dashed var(--border); padding-bottom:12px; margin-bottom:12px;}
.receipt-no{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); font-weight:600;}
.receipt-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
.receipt-row .k{color:var(--muted);}
.receipt-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:2px dashed var(--border); font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--primary-dark);}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-fill{width:100%; border-radius:5px 5px 0 0; background:var(--primary); position:relative; min-height:3px;}
.bar-fill.gold{background:var(--gold);}
.bar-label{font-size:10.5px; color:var(--muted); text-align:center;}
.bar-val{font-size:11px; font-weight:600; color:var(--ink);}

.progress-track{width:100%; height:8px; border-radius:99px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--success); border-radius:99px;}

.login-shell{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr;}
.login-brandpanel{
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
  color:#fff; padding:56px 52px; display:flex; flex-direction:column; justify-content:center; gap:20px;
  position:relative; overflow:hidden;
}
.login-brandpanel::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 88% 8%, rgba(201,150,43,.30), transparent 45%), radial-gradient(circle at 8% 94%, rgba(255,255,255,.08), transparent 40%);
}
.login-brand-seal{
  width:68px; height:68px; border-radius:18px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 14px 28px rgba(0,0,0,.28);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  color:var(--primary-dark); position:relative; z-index:1;
}
.login-brand-name{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.15; position:relative; z-index:1;}
.login-brand-sigle{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#D9E4D6; margin-top:4px; position:relative; z-index:1;}
.login-brand-desc{font-size:14px; line-height:1.65; color:#E7EFE6; max-width:420px; position:relative; z-index:1;}
.login-brand-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5; color:var(--gold-light);
  max-width:420px; position:relative; z-index:1; border-left:2px solid var(--gold); padding-left:12px;
}
.login-brand-values{display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1;}
.value-pill{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:rgba(255,255,255,.12); color:#EAF0E8; border:1px solid rgba(255,255,255,.18);
}
.login-brand-meta{display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:1;}
.login-brand-meta-row{display:flex; align-items:center; gap:11px; font-size:13px; color:#EAF0E8;}
.login-brand-meta-row .ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.13); display:flex;align-items:center;justify-content:center; font-size:13px; flex-shrink:0;}
.login-brand-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:#C9D6C9; position:relative; z-index:1; margin-top:auto; padding-top:18px;
}
.dashboard-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:14.5px; color:var(--primary-dark); margin-top:6px;
  border-left:2px solid var(--gold); padding-left:11px;
}
.dashboard-values{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.value-pill-light{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:var(--surface); border:1px solid var(--border); color:var(--muted);
}

.login-formpanel{background:var(--paper); display:flex; align-items:center; justify-content:center; padding:32px;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:36px 32px;}
.login-title{font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin-bottom:2px;}
.login-sub{font-size:12.5px; color:var(--muted); margin-bottom:26px;}
.demo-hint{margin-top:18px; font-size:11.5px; color:var(--muted); background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:10px 12px; line-height:1.6;}
.login-switch{margin-top:16px; text-align:center; font-size:12.5px; color:var(--muted);}
.link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; padding:0; text-decoration:underline;}
.link-btn:hover{color:var(--primary-light);}

@media(max-width:860px){
  .login-shell{grid-template-columns:1fr; grid-auto-rows:min-content;}
  .login-brandpanel{padding:36px 28px; gap:14px;}
  .login-brand-name{font-size:24px;}
  .login-brand-desc{display:none;}
  .login-brand-badge{display:none;}
  .login-formpanel{padding:28px 20px 44px;}
}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{color:var(--primary-dark); border-bottom-color:var(--gold);}

.check-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}

@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .print-only{display:block !important;}
}
.print-only{display:none;}

/* ---------- Rapports : filtres, graphiques, en-tête d'impression ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
.filter-field{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); font-weight:600;}
.filter-field input, .filter-field select{min-width:132px;}
.chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
@media(max-width:680px){.chart-grid{grid-template-columns:1fr;}}
.chart-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;}
.chart-title{font-weight:600; font-size:12.5px; margin-bottom:12px; color:var(--ink);}
.chart-bars{display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:8px;}
.chart-bar-col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
.chart-bar{width:100%; max-width:34px; border-radius:6px 6px 2px 2px; min-height:2px; transition:height .3s ease;}
.chart-bar-value{font-size:10.5px; font-weight:700; color:var(--ink); margin-bottom:4px;}
.chart-bar-label{font-size:9.5px; color:var(--muted); margin-top:6px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:56px;}
.chart-line-svg{width:100%; height:110px; display:block;}
.chart-line-labels{display:flex; justify-content:space-between; font-size:9.5px; color:var(--muted); margin-top:4px;}
.report-print-header{align-items:center; gap:12px; margin-bottom:18px; padding-bottom:14px; border-bottom:2px solid var(--ink);}
.report-print-header img, .rp-logo-fallback{width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0;}
.rp-logo-fallback{background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:18px;}
.report-print-header .rp-name{font-family:'Fraunces',serif; font-weight:700; font-size:16px;}
.report-print-header .rp-title{font-size:12.5px; color:var(--muted); margin-top:2px;}
.report-print-header .rp-meta{margin-left:auto; text-align:right; font-size:10.5px; color:var(--muted);}
@media print{ .report-print-header{display:flex !important;} }

.hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.section-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 12px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.two-col{grid-template-columns:1fr;}}
.pill-tabs{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:6px 12px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--muted);}
.pill.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* ---------- Dashboard modules ---------- */
.dashboard-hero{margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.dashboard-hero .hello{font-family:'Fraunces',serif; font-size:23px; font-weight:600;}
.dashboard-hero .date{font-size:12.5px; color:var(--muted); margin-top:3px; text-transform:capitalize;}
.module-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
@media(min-width:720px){.module-grid{grid-template-columns:repeat(3, 1fr);}}
@media(min-width:1100px){.module-grid{grid-template-columns:repeat(4, 1fr);}}
.module-card{
  background:var(--surface); border:1px solid var(--border); border-top:4px solid var(--accent, var(--border));
  border-radius:16px; padding:26px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
  font:inherit; color:inherit; width:100%; min-height:150px; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}
.module-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(36,34,29,.14);}
.module-card:active{transform:translateY(-1px);}
.module-icon{font-size:36px; line-height:1;}
.module-title{font-family:'Fraunces',serif; font-size:15px; font-weight:700;}

/* ---------- Bottom mobile nav ---------- */
.bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:var(--surface); border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.bottom-nav::-webkit-scrollbar{display:none;}
.bottom-nav-track{display:flex; gap:2px; min-width:max-content;}
.bottom-nav-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; padding:6px 12px; min-width:64px; border-radius:10px;
  font-size:10.5px; color:var(--muted); font-weight:600;
}
.bottom-nav-item .bn-icon{font-size:19px; line-height:1;}
.bottom-nav-item.active{color:var(--primary);}
.bottom-nav-item.active .bn-icon{transform:translateY(-1px);}

/* ---------- Settings ---------- */
.logo-upload{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.logo-preview{width:56px;height:56px;border-radius:12px; object-fit:cover; background:var(--paper); border:1px solid var(--border);}
.logo-preview-fallback{
  width:56px;height:56px;border-radius:12px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  display:flex;align-items:center;justify-content:center; color:var(--primary-dark); font-family:'Fraunces',serif; font-weight:700; font-size:21px; flex-shrink:0;
}
.color-field{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--surface);}
.color-field input[type=color]{width:34px; height:34px; border:none; padding:0; background:none; border-radius:6px; cursor:pointer;}
.danger-zone{border:1px solid #E7C7BA !important; background:#FBEDE7 !important;}
.save-flash{margin-left:10px; font-size:12.5px; color:var(--success); font-weight:600;}
.field-error{margin-top:4px; font-size:12px; color:var(--danger); font-weight:600;}

/* ---------- Indicateur de synchronisation (refresh silencieux en arrière-plan) ---------- */
.sync-indicator{
  position:fixed; top:0; left:0; right:0; height:2.5px; z-index:6000;
  background:linear-gradient(90deg, transparent, var(--primary), var(--gold), transparent);
  background-size:200% 100%;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.sync-indicator.active{opacity:1; animation:sync-slide 1.1s linear infinite;}
@keyframes sync-slide{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

/* ---------- Toast (notifications non bloquantes) ---------- */
.toast-host{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  z-index:5000; display:flex; flex-direction:column; gap:8px;
  width:min(420px, calc(100vw - 32px));
}
.toast{
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
  border-radius:12px; box-shadow:var(--shadow); cursor:pointer;
  font-size:13.5px; line-height:1.4; color:#fff; animation:toast-in .18s ease-out;
}
.toast-error{background:var(--danger);}
.toast-success{background:var(--success);}
.toast span{flex:1;}
.toast-close{background:none; border:none; color:#fff; opacity:.8; cursor:pointer; font-size:13px; padding:0 2px; flex-shrink:0;}
.toast-close:hover{opacity:1;}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@media(max-width:640px){
  .toast-host{bottom:calc(64px + env(safe-area-inset-bottom, 0px));}
}

/* ---------- Responsive overhaul ---------- */
@media(max-width:900px){
  .sidebar{display:none;}
  .bottom-nav{display:block;}
  .main{padding-bottom:70px;}
  .page-role{display:none;}
  .topbar{padding:12px 16px;}
  .content{padding:16px 16px 24px;}
  .page-title{font-size:17px;}
  .page-eyebrow{font-size:10px;}
}
@media(max-width:640px){
  .content{padding:14px 12px 20px;}
  .card-pad{padding:16px;}
  .grid{gap:12px;}
  .toolbar{flex-direction:column; align-items:stretch;}
  .toolbar .search-input{width:100%; min-width:0;}
  .btn{padding:10px 14px; font-size:13.5px;}
  .btn-sm{padding:7px 11px; font-size:12px;}
  input.input, select.select, textarea.textarea, .search-input{font-size:16px; padding:10px 12px;}
  .modal-overlay{padding:0; align-items:flex-end;}
  .modal{max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:92dvh;}
  .modal-header{padding:16px 18px;}
  .modal-body{padding:16px 18px;}
  .modal-footer{padding:14px 18px; flex-wrap:wrap;}
  table{font-size:12.5px;}
  th,td{padding:9px 8px;}
  .module-card{padding:20px 12px; min-height:130px;}
  .module-icon{font-size:30px;}
  .dashboard-hero .hello{font-size:19px;}
  .clock-chip{font-size:11.5px;}
}
@media(max-width:360px){
  .module-grid{grid-template-columns:1fr 1fr; gap:10px;}
}

/* ---------- Fil d'activités (feed social) ---------- */
.feed-wrap{max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:16px;}
.composer{padding:16px;}
.composer-top{display:flex; gap:10px; align-items:flex-start;}
.composer-input{flex:1; border:none; resize:none; min-height:44px; font-family:inherit; font-size:14.5px; background:transparent; color:var(--ink); outline:none; padding-top:8px;}
.composer-media-preview{margin-top:10px; position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.composer-media-preview img, .composer-media-preview video{display:block; width:100%; max-height:320px; object-fit:contain; background:#000;}
.composer-media-preview audio{display:block; width:100%; padding:14px;}
.composer-media-remove{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:13px; line-height:1;}
.composer-actions{display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); flex-wrap:wrap; gap:8px;}
.composer-attach{display:flex; gap:4px;}
.composer-attach-btn{display:flex; align-items:center; gap:6px; padding:7px 10px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;}
.composer-attach-btn:hover{background:var(--paper);}
.composer-attach-btn .ic{font-size:16px;}

.post-card{padding:16px;}
.post-head{display:flex; align-items:center; gap:10px;}
.post-head .who{flex:1;}
.post-head .name{font-weight:600; font-size:13.5px;}
.post-head .meta{font-size:11.5px; color:var(--muted); margin-top:1px;}
.post-menu-btn{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 8px; border-radius:6px;}
.post-menu-btn:hover{background:var(--paper);}
.post-text{margin:10px 0 0; font-size:14px; line-height:1.5; white-space:pre-wrap;}
.post-media{margin-top:10px; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.post-media img, .post-media video{display:block; width:100%; max-height:460px; object-fit:contain; background:#000;}
.post-media audio{display:block; width:100%; padding:14px; box-sizing:border-box;}
.post-stats{display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-top:10px; padding-bottom:6px;}
.post-stats .likes{display:flex; align-items:center; gap:4px;}
.post-actions{display:flex; border-top:1px solid var(--border); padding-top:4px;}
.post-action-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:8px 0; background:none; border:none; border-radius:8px; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;}
.post-action-btn:hover{background:var(--paper);}
.post-action-btn.liked{color:var(--primary);}
.reaction-wrap{flex:1; display:flex; align-items:stretch; position:relative;}
.reaction-wrap .post-action-btn{flex:1;}
.post-reaction-more{background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; padding:8px 8px; border-radius:8px;}
.post-reaction-more:hover{background:var(--paper); color:var(--ink);}
.reaction-picker-overlay{position:fixed; inset:0; z-index:19; background:transparent;}
.reaction-picker{
  position:absolute; bottom:100%; left:0; margin-bottom:6px; display:flex; gap:2px; background:var(--surface);
  border:1px solid var(--border); border-radius:999px; padding:5px 7px; box-shadow:var(--shadow); z-index:20;
}
.reaction-picker-btn{background:none; border:none; font-size:21px; line-height:1; cursor:pointer; padding:3px 5px; border-radius:50%; transition:transform .12s ease;}
.reaction-picker-btn:hover{transform:scale(1.3); background:var(--paper);}
.post-comments{margin-top:8px; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px;}
.comment-row{display:flex; gap:8px; align-items:flex-start;}
.comment-bubble{background:var(--paper); border-radius:14px; padding:7px 12px; flex:1;}
.comment-bubble .cname{font-weight:600; font-size:12.5px;}
.comment-bubble .ctext{font-size:13px; margin-top:1px; white-space:pre-wrap;}
.comment-time{font-size:10.5px; color:var(--muted); margin:3px 0 0 12px;}
.comment-form{display:flex; gap:8px; align-items:center; margin-top:2px;}
.comment-form input{flex:1; border:1px solid var(--border); border-radius:18px; padding:8px 14px; font-size:13px; background:var(--paper); color:var(--ink); outline:none; font-family:inherit;}
.comment-form input:focus{border-color:var(--primary);}
.comment-form button{border:none; background:none; color:var(--primary); font-weight:700; font-size:12.5px; cursor:pointer; padding:6px 4px;}
.comment-form button:disabled{color:var(--muted); cursor:default;}

.composer-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:5px;}

.chat-unread-dot{
  display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 4px;
  border-radius:99px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; margin-left:6px; vertical-align:2px;
}
.chat-card{display:flex; flex-direction:column; height:min(560px, calc(100vh - 260px)); min-height:360px; overflow:hidden;}
.chat-card-body{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; background:var(--paper);}
.chat-msg-row{display:flex; align-items:flex-end; gap:7px; max-width:82%;}
.chat-msg-row.mine{align-self:flex-end; flex-direction:row-reverse;}
.chat-msg-row.theirs{align-self:flex-start;}
.chat-msg-row .avatar-photo, .chat-msg-row .avatar-fallback{width:24px;height:24px;font-size:10px; flex-shrink:0;}
.chat-msg{max-width:100%; padding:7px 11px; border-radius:14px; font-size:12.5px; line-height:1.4;}
.chat-msg .who{font-size:10.5px; font-weight:700; opacity:.7; margin-bottom:1px;}
.chat-msg.mine{background:var(--primary); color:#fff; border-bottom-right-radius:3px;}
.chat-msg.theirs{background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:3px;}
.chat-msg audio{display:block; max-width:220px; height:34px;}
.chat-file-link{display:flex; align-items:center; gap:6px; text-decoration:none; color:inherit; font-weight:600; font-size:12.5px;}
.chat-msg.mine .chat-file-link{color:#fff;}
.chat-typing{display:flex; align-items:center; gap:7px; padding:2px 4px 4px; font-size:11.5px; color:var(--muted); font-style:italic;}
.chat-typing-dots{display:inline-flex; gap:3px;}
.chat-typing-dots span{width:5px;height:5px;border-radius:50%; background:var(--muted); animation:typingBounce 1.1s infinite ease-in-out;}
.chat-typing-dots span:nth-child(2){animation-delay:.15s;}
.chat-typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-3px); opacity:1;}}
.chat-card-foot{display:flex; align-items:center; gap:6px; padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0;}
.chat-card-foot input{flex:1; border:1px solid var(--border); border-radius:18px; padding:9px 14px; font-size:13.5px; background:var(--paper); color:var(--ink); outline:none; font-family:inherit; min-width:0;}
.chat-card-foot input:focus{border-color:var(--primary);}
.chat-card-foot button{border:none; background:var(--primary); color:#fff; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.chat-card-foot button:disabled{background:var(--border); color:var(--muted); cursor:default;}
.chat-icon-btn{border:none; background:transparent; color:var(--muted); border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.chat-icon-btn:hover{background:var(--paper); color:var(--primary);}
.chat-icon-btn.recording{background:var(--danger); color:#fff; animation:recPulse 1.1s infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(179,69,44,.45);} 50%{box-shadow:0 0 0 6px rgba(179,69,44,0);}}
.chat-recording-hint{font-size:11.5px; color:var(--danger); font-weight:600; white-space:nowrap;}
.chat-subnav{display:flex; gap:6px; margin-bottom:12px;}
.chat-subnav-btn{padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--border);}
.chat-subnav-btn.active{color:#fff; background:var(--primary); border-color:var(--primary);}
.contact-search-wrap{padding:12px 14px; border-bottom:1px solid var(--border);}
.contact-list{max-height:min(560px, calc(100vh - 320px)); overflow-y:auto;}
.contact-row{display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; background:none; border:none; border-bottom:1px solid var(--border); text-align:left;}
.contact-row:last-child{border-bottom:none;}
.contact-row:hover{background:var(--paper);}
.contact-row-name{font-weight:600; font-size:13.5px;}
.contact-row-preview{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px;}
.chat-thread-head{display:flex; align-items:center; gap:9px; padding:11px 14px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;}
.chat-thread-head .name{font-weight:600; font-size:13.5px;}
.chat-back-btn{border:none; background:none; color:var(--muted); font-size:17px; padding:2px 4px; border-radius:6px; flex-shrink:0;}
.chat-back-btn:hover{color:var(--primary); background:var(--paper);}
@media (max-width:640px){
  .chat-card{height:min(500px, calc(100vh - 230px));}
}

/* ---------- Stories ---------- */
.stories-bar{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch;}
.story-item{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; width:64px; background:none; border:none; cursor:pointer; font-family:inherit;}
.story-ring{position:relative; width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef} = React;

/* ---------------------------- Helpers ---------------------------- */
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = (d) => { if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n, devise) => (Number(n)||0).toLocaleString('fr-FR') + ' ' + (devise || 'FCFA');

/* ---------------------------- Couche de données Supabase ----------------------------
   Toutes les tables (sauf app_users et settings) stockent leurs lignes sous la forme
   {id, data}. On garde ici la même interface que l'ancien stockage local (LS.get/LS.set)
   pour ne pas avoir à réécrire chaque module : DB.list(table) charge un tableau
   d'objets {id, ...data}, DB.sync(table, prevList, nextList) calcule la différence et
   pousse les insert/update/delete vers Supabase. */
const TABLES_LISTES = ['membres','cotisation_types','paiements','activites','documents'];

/* Applique un événement realtime Supabase (insert/update/delete) directement à un
   état React local, sans retélécharger toute la table. Avant, chaque changement
   (même sur une seule ligne) déclenchait un SELECT complet de la table — coûteux
   quand elle contient beaucoup de lignes (ex. paiements). */
function applyRealtimeRowChange(setState, payload, extra){
  const {eventType, new: newRow, old: oldRow} = payload;
  if(eventType==='DELETE'){
    const id = oldRow && oldRow.id;
    if(!id) return;
    setState(prev => prev.filter(x=>x.id!==id));
    return;
  }
  if(!newRow) return;
  const item = {...newRow.data, id:newRow.id, ...(extra ? extra(newRow) : null)};
  setState(prev => {
    const idx = prev.findIndex(x=>x.id===item.id);
    if(idx===-1) return [...prev, item];
    const copy = [...prev]; copy[idx] = item; return copy;
  });
}

const DB = {
  async list(table){
    const { data, error } = await cercleSupabase.from(table).select('id, data');
    if(error){ console.error('DB.list', table, error); return []; }
    return (data||[]).map(row => ({...row.data, id: row.id}));
  },
  async getSettings(){
    const { data, error } = await cercleSupabase.from('settings').select('data').eq('id','main').single();
    if(error || !data) return {nomAssociation:'Cercle', devise:'FCFA'};
    return data.data || {};
  },
  async setSettings(v){
    await cercleSupabase.from('settings').upsert({ id:'main', data: v, updated_at: new Date().toISOString() });
  },
  async sync(table, prevList, nextList){
    const prevIds = new Set((prevList||[]).map(x=>x.id));
    const nextIds = new Set((nextList||[]).map(x=>x.id));
    const toDelete = [...prevIds].filter(id => !nextIds.has(id));
    const toUpsert = (nextList||[]).map(item => {
      const {id, ...rest} = item;
      return { id: id || uid(table.slice(0,3)), data: rest, updated_at: new Date().toISOString() };
    });
    // On vérifie désormais l'erreur renvoyée par Supabase (ex. RLS qui refuse
    // la suppression) : avant, l'échec était silencieux et l'élément
    // "supprimé" localement revenait dès le prochain rechargement des données.
    // ATTENTION : quand aucune policy RLS "DELETE" ne matche, Postgres ne
    // renvoie PAS d'erreur — il supprime juste 0 ligne. Il faut donc aussi
    // vérifier combien de lignes ont réellement été supprimées, avec .select().
    if(toDelete.length){
      const { data, error } = await cercleSupabase.from(table).delete().in('id', toDelete).select('id');
      if(error){ console.error('DB.sync delete', table, error); throw error; }
      if(!data || data.length < toDelete.length){
        const err = new Error(`Suppression refusée par la base (RLS) sur "${table}" : ${data ? data.length : 0}/${toDelete.length} ligne(s) supprimée(s).`);
        console.error('DB.sync delete blocked by RLS', table, {expected: toDelete, deleted: data});
        throw err;
      }
    }
    if(toUpsert.length){
      const { error } = await cercleSupabase.from(table).upsert(toUpsert);
      if(error){ console.error('DB.sync upsert', table, error); throw error; }
    }
  }
};

/* Redimensionne/compresse une image côté navigateur avant upload (via canvas),
   pour éviter d'envoyer des photos de smartphone en pleine résolution (souvent
   plusieurs Mo) sur une connexion mobile parfois lente. Ne touche jamais aux
   fichiers non-image (vidéo, audio, documents) : la compression de vidéo/audio
   côté client demanderait une librairie beaucoup plus lourde. Les GIF et SVG
   sont aussi laissés intacts (un ré-encodage casserait l'animation / le vectoriel).
   En cas d'échec, ou si le résultat n'est pas plus petit, on repart du fichier d'origine. */
async function compressImage(file, {maxDim=1600, quality=0.82}={}){
  try{
    if(!file || !file.type || !file.type.startsWith('image/')) return file;
    if(file.type==='image/gif' || file.type==='image/svg+xml') return file;
    const bitmap = await createImageBitmap(file).catch(()=>null);
    if(!bitmap) return file;
    const {width, height} = bitmap;
    if(width<=maxDim && height<=maxDim && file.size < 400*1024) return file; // déjà petite
    const scale = Math.min(1, maxDim/Math.max(width, height));
    const outW = Math.max(1, Math.round(width*scale));
    const outH = Math.max(1, Math.round(height*scale));
    const canvas = document.createElement('canvas');
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(bitmap, 0, 0, outW, outH);
    const outType = file.type==='image/png' ? 'image/png' : 'image/jpeg';
    const blob = await new Promise(resolve => canvas.toBlob(resolve, outType, quality));
    if(!blob || blob.size >= file.size) return file;
    const newName = file.name.replace(/\.\w+$/, outType==='image/jpeg' ? '.jpg' : '.png');
    return new File([blob], newName, {type: outType});
  }catch(e){
    console.error('compressImage', e);
    return file;
  }
}

/* Upload d'un fichier (photo, média de publication, document) vers Supabase Storage.
   Remplace l'ancien encodage base64 en localStorage : on stocke désormais une URL. */
async function uploadToStorage(file, folder){
  const toUpload = await compressImage(file);
  const ext = (toUpload.name.split('.').pop() || 'bin').toLowerCase();
  const path = folder + '/' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const { error } = await cercleSupabase.storage.from('cercle-media').upload(path, toUpload);
  if(error){ console.error('uploadToStorage', error); throw error; }
  const { data } = cercleSupabase.storage.from('cercle-media').getPublicUrl(path);
  return data.publicUrl;
}

/* ---------------------------- Notifications toast (remplace alert()) ----------------------------
   Petites notifications non bloquantes, empilées en bas de l'écran, qui se
   ferment automatiquement (ou au clic). Avant, chaque erreur interrompait
   l'utilisateur avec une boîte alert() qui bloquait toute l'interface le
   temps d'un clic sur "OK". */
let toastIdSeq = 0;
function showToast(message, type='error'){
  window.dispatchEvent(new CustomEvent('cercle-toast', {detail:{id: ++toastIdSeq, message, type}}));
}
function ToastHost(){
  const [toasts, setToasts] = useState([]);
  useEffect(()=>{
    function onToast(e){
      const t = e.detail;
      setToasts(prev => [...prev, t]);
      setTimeout(()=>{ setToasts(prev => prev.filter(x=>x.id!==t.id)); }, t.type==='success' ? 3500 : 6000);
    }
    window.addEventListener('cercle-toast', onToast);
    return ()=>window.removeEventListener('cercle-toast', onToast);
  }, []);
  function dismiss(id){ setToasts(prev => prev.filter(x=>x.id!==id)); }
  if(!toasts.length) return null;
  return (
    <div className="toast-host no-print">
      {toasts.map(t=>(
        <div key={t.id} className={"toast toast-"+t.type} onClick={()=>dismiss(t.id)}>
          <span>{t.message}</span>
          <button className="toast-close" onClick={(e)=>{e.stopPropagation(); dismiss(t.id);}} aria-label="Fermer">✕</button>
        </div>
      ))}
    </div>
  );
}

/* Modules accessibles à un utilisateur : soit accès admin total (tout débloqué),
   soit la liste cochée à la création du compte. 'dashboard' est toujours inclus.
   Fallback sur l'ancien système par rôle pour les comptes créés avant cette mise à jour. */
function computeAccessibleModuleIds(user){
  if(!user) return [];
  if(user.isAdminTotal) return NAV.map(n=>n.id);
  if(user.modulesAccess) return NAV.filter(n => n.id==='dashboard' || user.modulesAccess[n.id]).map(n=>n.id);
  return NAV.filter(n => n.roles.includes(user.role)).map(n=>n.id);
}

/* ---------------------------- Mon profil (photo, nom d'utilisateur, mot de passe) ---------------------------- */
function MonProfilModal({session, onClose, onSaved}){
  const [username, setUsername] = useState(session.username || '');
  const [photo, setPhoto] = useState(session.photo || '');
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [saving, setSaving] = useState(false);
  const [status, setStatus] = useState(null);

  async function handlePhotoChange(e){
    const f = e.target.files[0];
    if(!f) return;
    setUploadingPhoto(true);
    try{
      const url = await uploadToStorage(f, 'profils');
      setPhoto(url);
    }catch(err){
      setStatus({type:'err', msg:"Échec de l'envoi de la photo."});
    }
    setUploadingPhoto(false);
  }

  async function handleSave(){
    if(!username.trim()){ setStatus({type:'err', msg:"Le nom d'utilisateur ne peut pas être vide."}); return; }
    if(newPassword && newPassword.length < 6){ setStatus({type:'err', msg:"Le mot de passe doit contenir au moins 6 caractères."}); return; }
    if(newPassword && newPassword !== confirmPassword){ setStatus({type:'err', msg:"Les mots de passe ne correspondent pas."}); return; }

    setSaving(true); setStatus(null);
    try{
      const usernameChanged = username.trim() !== session.username;
      const photoChanged = photo !== (session.photo || '');

      if(usernameChanged){
        const { error } = await cercleSupabase.from('app_users').update({username: username.trim()}).eq('id', session.id);
        if(error) throw new Error("Ce nom d'utilisateur est peut-être déjà pris.");
      }
      if(photoChanged){
        const { id, username: _u, ...rest } = session;
        const { error } = await cercleSupabase.from('app_users').update({data:{...rest, photo}, updated_at:new Date().toISOString()}).eq('id', session.id);
        if(error) throw error;
      }
      if(newPassword){
        const { error } = await cercleSupabase.auth.updateUser({password:newPassword});
        if(error) throw error;
      }
      onSaved({...session, username:username.trim(), photo});
      onClose();
    }catch(err){
      setStatus({type:'err', msg: err.message || "Échec de l'enregistrement."});
    }
    setSaving(false);
  }

  return (
    <Modal title="Mon profil" onClose={onClose}
      footer={<>
        <button className="btn btn-outline" onClick={onClose}>Annuler</button>
        <button className="btn btn-primary" disabled={saving || uploadingPhoto} onClick={handleSave}>{saving ? 'Enregistrement…' : 'Enregistrer'}</button>
      </>}>
      <div className="profile-photo-row">
        <div className="profile-photo-preview">
          {photo ? <img src={photo} alt={username}/> : (username||'?').slice(0,2).toUpperCase()}
        </div>
        <div>
          <input id="profile-photo-input" type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoChange}/>
          <button type="button" className="btn btn-outline btn-sm" disabled={uploadingPhoto} onClick={()=>document.getElementById('profile-photo-input').click()}>
            {uploadingPhoto ? 'Envoi…' : 'Choisir une photo'}
          </button>
          {photo && <button type="button" className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>setPhoto('')}>Retirer</button>}
        </div>
      </div>

      <Field label="Nom d'utilisateur">
        <input className="input" value={username} onChange={e=>setUsername(e.target.value)}/>
      </Field>

      <div style={{marginTop:6, marginBottom:6, padding:'12px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--paper)'}}>
        <div style={{fontSize:11.5, textTransform:'uppercase', letterSpacing:'.06em', color:'var(--muted)', fontWeight:700, marginBottom:8}}>
          Changer le mot de passe
        </div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
          <input className="input" type="password" placeholder="Nouveau mot de passe" value={newPassword} onChange={e=>setNewPassword(e.target.value)}/>
          <input className="input" type="password" placeholder="Confirmer" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)}/>
        </div>
        <div className="hint" style={{marginTop:6}}>Laisser vide pour ne pas changer le mot de passe.</div>
      </div>

      {status && <div style={{fontSize:12.5, marginTop:8, color: status.type==='ok' ? 'var(--success)' : 'var(--danger)'}}>{status.msg}</div>}
    </Modal>
  );
}

/* ---------------------------- Membres ---------------------------- */
function emptyMembre(){
  return {id:'', matricule:'', nom:'', prenom:'', fonction:'', departement:'', statut:'actif', telephone:'', email:'', adresse:'', dateAdhesion:todayISO(), photo:''};
}
function nextMatricule(membres){
  const nums = membres.map(m => parseInt((m.matricule||'').replace(/\D/g,''))||0);
  const next = (Math.max(0,...nums) + 1).toString().padStart(4,'0');
  return 'GRP-' + next;
}

function MembreForm({initial, onSave, onCancel, membres}){
  const [form, setForm] = useState(initial);
  const [errors, setErrors] = useState({});
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  function validate(toSave){
    const errs = {};
    if(!toSave.prenom.trim()) errs.prenom = 'Le prénom est obligatoire.';
    if(!toSave.nom.trim()) errs.nom = 'Le nom est obligatoire.';
    const mat = (toSave.matricule||'').trim().toLowerCase();
    if(mat){
      const dup = membres.some(m => m.id!==toSave.id && (m.matricule||'').trim().toLowerCase()===mat);
      if(dup) errs.matricule = 'Ce matricule est déjà utilisé par un autre membre.';
    }
    if(toSave.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(toSave.email.trim())) errs.email = 'Adresse email invalide.';
    return errs;
  }
  return (
    <div>
      <div style={{display:'flex', gap:16, alignItems:'center', marginBottom:16}}>
        <Avatar photo={form.photo} name={form.prenom+' '+form.nom}/>
        <div>
          <label className="btn btn-outline btn-sm">
            Choisir une photo
            <input type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
              const f = e.target.files[0]; if(!f) return;
              try{ const url = await uploadToStorage(f, 'membres'); set('photo', url); }
              catch(err){ showToast("Échec de l'envoi de la photo."); }
            }}/>
          </label>
          {form.photo && <button className="btn btn-outline btn-sm" style={{marginLeft:8}} onClick={()=>set('photo','')}>Retirer</button>}
        </div>
      </div>
      <div className="two-col">
        <Field label="Prénom" error={errors.prenom}><input className="input" value={form.prenom} onChange={e=>set('prenom',e.target.value)} required/></Field>
        <Field label="Nom" error={errors.nom}><input className="input" value={form.nom} onChange={e=>set('nom',e.target.value)} required/></Field>
      </div>
      <div className="two-col">
        <Field label="Matricule" hint="Généré automatiquement si laissé vide" error={errors.matricule}>
          <input className="input mono" value={form.matricule} onChange={e=>set('matricule',e.target.value)} placeholder={nextMatricule(membres)}/>
        </Field>
        <Field label="Statut">
          <select className="select" value={form.statut} onChange={e=>set('statut',e.target.value)}>
            {STATUTS_MEMBRE.map(s=><option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
          </select>
        </Field>
      </div>
      <div className="two-col">
        <Field label="Fonction"><input className="input" value={form.fonction} onChange={e=>set('fonction',e.target.value)} placeholder="Ex: Membre, Secrétaire…"/></Field>
        <Field label="Département / Commission"><input className="input" value={form.departement} onChange={e=>set('departement',e.target.value)}/></Field>
      </div>
      <div className="two-col">
        <Field label="Téléphone"><input className="input" value={form.telephone} onChange={e=>set('telephone',e.target.value)}/></Field>
        <Field label="Email" error={errors.email}><input className="input" type="email" value={form.email} onChange={e=>set('email',e.target.value)}/></Field>
      </div>
      <Field label="Adresse"><input className="input" value={form.adresse} onChange={e=>set('adresse',e.target.value)}/></Field>
      <Field label="Date d'adhésion"><input className="input" type="date" value={form.dateAdhesion} onChange={e=>set('dateAdhesion',e.target.value)}/></Field>
      <div style={{display:'flex', justifyContent:'flex-end', gap:10, marginTop:6}}>
        <button className="btn btn-outline" onClick={onCancel}>Annuler</button>
        <button className="btn btn-primary" onClick={()=>{
          const toSave = {...form};
          if(!toSave.matricule) toSave.matricule = nextMatricule(membres);
          const errs = validate(toSave);
          setErrors(errs);
          if(Object.keys(errs).length) return;
          onSave(toSave);
        }}>Enregistrer</button>
      </div>
    </div>
  );
}

const MEMBRES_PAGE_SIZE = 30;
function Membres({membres, setMembres, settings, canEdit, users, setUsers}){
  const [query, setQuery] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [editing, setEditing] = useState(null); // membre being edited or 'new'
  const [viewing, setViewing] = useState(null); // fiche
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [pageNum, setPageNum] = useState(1);
  useEffect(()=>{ setPageNum(1); }, [query, statutFilter]);

  const filtered = membres.filter(m=>{
    const q = query.toLowerCase();
    const matchQ = !q || (m.nom+' '+m.prenom+' '+m.matricule+' '+m.fonction).toLowerCase().includes(q);
    const matchS = statutFilter==='tous' || m.statut===statutFilter;
    return matchQ && matchS;
  });

  // Pagination d'affichage (même logique que pour Paiements) : on ne réduit
  // que le nombre de lignes rendues dans le DOM, pas la liste filtrée elle-même.
  const totalPages = Math.max(1, Math.ceil(filtered.length / MEMBRES_PAGE_SIZE));
  const safePageNum = Math.min(pageNum, totalPages);
  const pageItems = filtered.slice((safePageNum-1)*MEMBRES_PAGE_SIZE, safePageNum*MEMBRES_PAGE_SIZE);

  function save(form){
    if(form.id){
      setMembres(membres.map(m=>m.id===form.id?form:m));
    }else{
      setMembres([...membres, {...form, id:uid('mem')}]);
    }
    setEditing(null);
  }
  function remove(id){
    setMembres(membres.filter(m=>m.id!==id));
    // Le membre disparaît, mais un compte utilisateur peut encore lui être lié
    // (accès à l'appli, messagerie...). On le désactive et on le détache pour
    // qu'il n'apparaisse plus dans les contacts / discussions, sans effacer
    // l'historique des messages déjà envoyés.
    if(setUsers && users){
      const linked = users.filter(u=>u.membreId===id);
      if(linked.length){
        setUsers(users.map(u=>u.membreId===id ? {...u, actif:false, membreId:''} : u));
      }
    }
    setConfirmDelete(null);
    if(viewing && viewing.id===id) setViewing(null);
  }

  return (
    <div>
      <div className="toolbar">
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <input className="search-input" placeholder="Rechercher un membre…" value={query} onChange={e=>setQuery(e.target.value)}/>
          <select className="select" style={{width:150}} value={statutFilter} onChange={e=>setStatutFilter(e.target.value)}>
            <option value="tous">Tous les statuts</option>
            {STATUTS_MEMBRE.map(s=><option key={s} value={s}>{s[0].toUpperCase()+s.slice(1)}</option>)}
          </select>
        </div>
        {canEdit && <button className="btn btn-primary" onClick={()=>setEditing(emptyMembre())}>+ Ajouter un membre</button>}
      </div>

      <div className="card">
        {filtered.length===0 ? <EmptyState glyph="☺" title="Aucun membre trouvé" sub="Ajustez votre recherche ou ajoutez un nouveau membre."/> : (
          <>
            <div className="table-wrap">
              <table>
                <thead><tr><th></th><th>Nom</th><th>Matricule</th><th>Fonction</th><th>Statut</th><th>Contact</th><th></th></tr></thead>
                <tbody>
                  {pageItems.map(m=>(
                    <tr key={m.id}>
                      <td><Avatar photo={m.photo} name={m.prenom+' '+m.nom}/></td>
                      <td style={{cursor:'pointer', fontWeight:600}} onClick={()=>setViewing(m)}>{m.prenom} {m.nom}</td>
                      <td className="mono">{m.matricule}</td>
                      <td>{m.fonction || '—'}</td>
                      <td><Badge cls={statutBadge(m.statut)}>{m.statut}</Badge></td>
                      <td style={{fontSize:12.5, color:'var(--muted)'}}>{m.telephone || m.email || '—'}</td>
                      <td>
                        <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                          <button className="btn btn-outline btn-sm" onClick={()=>setViewing(m)}>Fiche</button>
                          {canEdit && <button className="btn btn-outline btn-sm" onClick={()=>setEditing(m)}>Modifier</button>}
                          {canEdit && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(m)}>Suppr.</button>}
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {totalPages>1 && (
              <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, padding:'12px 4px 2px', flexWrap:'wrap'}}>
                <span style={{fontSize:13, color:'var(--muted)'}}>
                  {filtered.length} membre(s) — page {safePageNum} / {totalPages}
                </span>
                <div style={{display:'flex', gap:8}}>
                  <button className="btn btn-outline btn-sm" disabled={safePageNum<=1} onClick={()=>setPageNum(n=>Math.max(1,n-1))}>← Précédent</button>
                  <button className="btn btn-outline btn-sm" disabled={safePageNum>=totalPages} onClick={()=>setPageNum(n=>Math.min(totalPages,n+1))}>Suivant →</button>
                </div>
              </div>
            )}
          </>
        )}
      </div>

      {editing && (
        <Modal title={editing.id ? 'Modifier le membre' : 'Ajouter un membre'} onClose={()=>setEditing(null)} width="620px">
          <MembreForm initial={editing} onSave={save} onCancel={()=>setEditing(null)} membres={membres}/>
        </Modal>
      )}

      {viewing && (
        <Modal title="Fiche du membre" onClose={()=>setViewing(null)} width="620px">
          <div style={{display:'flex', justifyContent:'center', marginBottom:18}}>
            <MemberCard membre={viewing} settings={settings}/>
          </div>
          <div className="two-col">
            <Field label="Téléphone"><div>{viewing.telephone || '—'}</div></Field>
            <Field label="Email"><div>{viewing.email || '—'}</div></Field>
            <Field label="Adresse"><div>{viewing.adresse || '—'}</div></Field>
            <Field label="Date d'adhésion"><div>{fmtDate(viewing.dateAdhesion)}</div></Field>
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
            <button className="btn btn-outline" onClick={()=>window.print()}>🖨 Imprimer la carte</button>
            {canEdit && <button className="btn btn-primary" onClick={()=>{setEditing(viewing); setViewing(null);}}>Modifier</button>}
          </div>
        </Modal>
      )}

      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          <p>Voulez-vous vraiment supprimer <b>{confirmDelete.prenom} {confirmDelete.nom}</b> ? Cette action est irréversible. Si un compte utilisateur lui est lié, il sera désactivé et ne pourra plus se connecter ni apparaître dans les discussions.</p>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------- Utilisateurs ---------------------------- */
function Utilisateurs({users, setUsers, membres, currentUser}){
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  async function save(form){
    const modulesAccess = form.isAdminTotal ? {} : (form.modulesAccess || {});
    const list = users.map(u => u.id===form.id
      ? {...u, role:form.role, poste:form.poste, membreId:form.membreId, actif:form.actif, isAdminTotal:!!form.isAdminTotal, modulesAccess}
      : u);
    setUsers(list);
    setEditing(null);
  }
  function remove(id){ setUsers(users.filter(u=>u.id!==id)); setConfirmDelete(null); }
  const membreName = (id) => { const m = membres.find(x=>x.id===id); return m ? m.prenom+' '+m.nom : '—'; };
  const modulesSummary = (u) => {
    if(u.isAdminTotal) return 'Tous les modules';
    const ids = computeAccessibleModuleIds(u).filter(id=>id!=='dashboard');
    if(ids.length===0) return 'Accueil uniquement';
    return ids.map(id => (NAV.find(n=>n.id===id)||{}).label).join(', ');
  };

  return (
    <div>
      <div className="toolbar">
        <div className="page-eyebrow">{users.length} compte(s)</div>
      </div>
      <div className="hint" style={{marginBottom:14}}>Les nouveaux comptes sont créés par chaque membre via « Créer mon profil » sur l'écran de connexion. Ici, tu peux ajuster le rôle, le poste et les accès d'un compte déjà créé.</div>
      <div className="card">
        <div className="table-wrap">
          <table>
            <thead><tr><th>Utilisateur</th><th>Poste</th><th>Rôle</th><th>Membre lié</th><th>Modules</th><th>Statut</th><th></th></tr></thead>
            <tbody>
              {users.map(u=>(
                <tr key={u.id}>
                  <td style={{fontWeight:600}}>{u.username}</td>
                  <td>{posteLabel(u.poste)}</td>
                  <td><Badge cls="badge-gold">{roleLabel(u.role)}</Badge></td>
                  <td>{membreName(u.membreId)}</td>
                  <td style={{maxWidth:220, fontSize:12, color:'var(--muted)'}}>
                    {u.isAdminTotal ? <Badge cls="badge-green">Admin total</Badge> : modulesSummary(u)}
                  </td>
                  <td><Badge cls={u.actif?'badge-green':'badge-gray'}>{u.actif?'Actif':'Désactivé'}</Badge></td>
                  <td>
                    <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                      <button className="btn btn-outline btn-sm" onClick={()=>setEditing({...u, modulesAccess: u.modulesAccess||{}})}>Modifier</button>
                      {u.id!==currentUser.id && <button className="btn btn-danger btn-sm" onClick={()=>setConfirmDelete(u)}>Suppr.</button>}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {editing && (
        <Modal title="Modifier le compte" onClose={()=>setEditing(null)}>
          <UserForm initial={editing} membres={membres} onCancel={()=>setEditing(null)} onSave={save}/>
        </Modal>
      )}
      {confirmDelete && (
        <Modal title="Confirmer la suppression" onClose={()=>setConfirmDelete(null)}
          footer={<>
            <button className="btn btn-outline" onClick={()=>setConfirmDelete(null)}>Annuler</button>
            <button className="btn btn-danger" style={{background:'var(--danger)', color:'#fff'}} onClick={()=>remove(confirmDelete.id)}>Supprimer</button>
          </>}>
          <p>Supprimer le compte <b>{confirmDelete.username}</b> ?</p>
        </Modal>
      )}
    </div>
  );
}
/* Réinitialisation de mot de passe par l'Administrateur.
   Le mot de passe d'un compte Supabase Auth ne peut pas être écrasé directement depuis le
   navigateur sans exposer une clé d'administration (risque de sécurité important) : l'app
   envoie donc un lien de réinitialisation à l'email du compte, l'utilisateur choisit ensuite
   lui-même son nouveau mot de passe en toute sécurité. */
function PasswordReset({user, membres}){
  const linkedMembre = membres.find(m=>m.id===user.membreId);
  const [email, setEmail] = useState((linkedMembre && linkedMembre.email) || '');
  const [status, setStatus] = useState(null);
  const [sending, setSending] = useState(false);

  async function sendReset(){
    if(!email.trim()){ setStatus({type:'err', msg:"Renseigne l'email du compte pour envoyer le lien."}); return; }
    setSending(true); setStatus(null);
    try{
      const { error } = await cercleSupabase.auth.resetPasswordForEmail(email.trim(), {redirectTo: window.location.origin + window.location.pathname.replace(/index\.html$/, '') + 'login.html'});
      if(error) throw error;
      setStatus({type:'ok', msg:"Lien de réinitialisation envoyé à "+email+"."});
    }catch(err){
      setStatus({type:'err', msg:"Échec de l'envoi : "+(err.message || 'erreur inconnue')});
    }
    setSending(false);
  }

  return (
    <div>
      <div className="hint" style={{marginBottom:8}}>
        Envoie un lien de réinitialisation à l'email du compte ; l'utilisateur choisira lui-même son nouveau mot de passe.
      </div>
      <div style={{display:'flex', gap:8}}>
        <input className="input" type="email" placeholder="Email du compte" value={email} onChange={e=>setEmail(e.target.value)} style={{flex:1}}/>
        <button type="button" className="btn btn-outline btn-sm" disabled={sending} onClick={sendReset}>{sending ? 'Envoi…' : 'Envoyer le lien'}</button>
      </div>
      {status && <div style={{fontSize:12, marginTop:6, color: status.type==='ok' ? 'var(--success)' : 'var(--danger)'}}>{status.msg}</div>}
    </div>
  );
}
