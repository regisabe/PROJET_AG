/* Pied de pagination réutilisé par les tableaux de Rapports : n'affecte que le
   rendu (le nombre de lignes affiché), jamais les listes utilisées pour les
   totaux, graphiques ou exports CSV/PDF, qui restent calculés sur tout l'ensemble filtré. */
function PaginationFooter({total, totalPages, safePageNum, setPageNum, label}){
  if(totalPages<=1) return null;
  return (
    <div className="no-print" style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, padding:'12px 4px 2px', flexWrap:'wrap'}}>
      <span style={{fontSize:13, color:'var(--muted)'}}>{total} {label} — page {safePageNum} / {totalPages}</span>
      <div style={{display:'flex', gap:8}}>
        <button className="btn btn-outline btn-sm" disabled={safePageNum<=1} onClick={()=>setPageNum(n=>Math.max(1,n-1))}>← Précédent</button>
        <button className="btn btn-outline btn-sm" disabled={safePageNum>=totalPages} onClick={()=>setPageNum(n=>Math.min(totalPages,n+1))}>Suivant →</button>
      </div>
    </div>
  );
}

const REPORTS_PAGE_SIZE = 30;
function Rapports({membres, paiements, types, activites, documents, settings}){
  const [tab, setTab] = useState('membres');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [statutFilter, setStatutFilter] = useState('tous');
  const [departementFilter, setDepartementFilter] = useState('tous');
  const [typeFilter, setTypeFilter] = useState('tous');
  const [pageNum, setPageNum] = useState(1);
  // Un seul tableau est visible à la fois (selon l'onglet), donc une seule page
  // suffit ; on revient à la page 1 dès qu'on change d'onglet ou de filtre.
  useEffect(()=>{ setPageNum(1); }, [tab, dateFrom, dateTo, statutFilter, departementFilter, typeFilter]);
  function paginate(list){
    const totalPages = Math.max(1, Math.ceil(list.length / REPORTS_PAGE_SIZE));
    const safePageNum = Math.min(pageNum, totalPages);
    const pageItems = list.slice((safePageNum-1)*REPORTS_PAGE_SIZE, safePageNum*REPORTS_PAGE_SIZE);
    return {totalPages, safePageNum, pageItems};
  }

  const membreName = (id) => { const m = membres.find(x=>x.id===id); return m ? m.prenom+' '+m.nom : '—'; };
  const typeName = (id) => { const t = types.find(x=>x.id===id); return t ? t.nom : '—'; };
  const inPeriod = (d) => (!dateFrom || (d && d>=dateFrom)) && (!dateTo || (d && d<=dateTo));
  const departements = [...new Set(membres.map(m=>m.departement).filter(Boolean))].sort();

  function resetFilters(){ setDateFrom(''); setDateTo(''); setStatutFilter('tous'); setDepartementFilter('tous'); setTypeFilter('tous'); }
  const filtersActive = !!(dateFrom || dateTo || statutFilter!=='tous' || departementFilter!=='tous' || typeFilter!=='tous');
  const activeFiltersLabel = [
    (dateFrom || dateTo) ? `Période : ${dateFrom||'…'} → ${dateTo||'…'}` : null,
    statutFilter!=='tous' ? `Statut : ${statutFilter}` : null,
    departementFilter!=='tous' ? `Département : ${departementFilter}` : null,
    typeFilter!=='tous' ? `Cotisation : ${typeName(typeFilter)}` : null,
  ].filter(Boolean).join(' · ');

  /* --- Membres --- */
  const filteredMembres = membres.filter(m =>
    inPeriod(m.dateAdhesion) &&
    (statutFilter==='tous' || m.statut===statutFilter) &&
    (departementFilter==='tous' || m.departement===departementFilter)
  );
  const statutData = STATUTS_MEMBRE.map(s => ({label: s.charAt(0).toUpperCase()+s.slice(1), value: filteredMembres.filter(m=>m.statut===s).length, color: s==='actif'?'var(--success)':s==='suspendu'?'var(--danger)':'var(--muted)'}));
  const departementData = departements.map(dep => ({label: dep, value: filteredMembres.filter(m=>m.departement===dep).length})).sort((a,b)=>b.value-a.value).slice(0,8);

  /* --- Cotisations / Impayés / Financier --- */
  const enrichedPaiements = paiements.map(p=>({...p, reste: Number(p.montantDu||0)-Number(p.montantPaye||0)}));
  const filteredPaiements = enrichedPaiements.filter(p => inPeriod(p.date) && (typeFilter==='tous' || p.typeId===typeFilter));
  const impayes = filteredPaiements.filter(p=>p.reste>0);
  const totalEncaisse = filteredPaiements.reduce((s,p)=>s+Number(p.montantPaye||0),0);
  const totalDu = filteredPaiements.reduce((s,p)=>s+Number(p.montantDu||0),0);
  const cotisationTypeData = types.map(t => ({label: t.nom, value: filteredPaiements.filter(p=>p.typeId===t.id).reduce((s,p)=>s+Number(p.montantPaye||0),0)})).filter(d=>d.value>0);
  const impayesTypeData = types.map(t => ({label: t.nom, value: impayes.filter(p=>p.typeId===t.id).length})).filter(d=>d.value>0);
  const months = last6Months();
  const evolutionEncaisse = months.map(mk => ({label: monthLabel(mk), value: filteredPaiements.filter(p=>monthKey(p.date)===mk).reduce((s,p)=>s+Number(p.montantPaye||0),0)}));
  const evolutionDu = months.map(mk => ({label: monthLabel(mk), value: filteredPaiements.filter(p=>monthKey(p.date)===mk).reduce((s,p)=>s+Number(p.montantDu||0),0)}));

  /* --- Activités --- */
  const mediaTypeLabel = {image:'Photo', video:'Vidéo', audio:'Audio'};
  const filteredActivites = (activites||[]).filter(a => inPeriod((a.date||'').slice(0,10)));
  const activitesParMois = months.map(mk => ({label: monthLabel(mk), value: (activites||[]).filter(a=>monthKey(a.date)===mk).length}));
  const activitesParType = ['texte','image','video','audio'].map(t => ({
    label: t==='texte' ? 'Texte seul' : (mediaTypeLabel[t]||t),
    value: filteredActivites.filter(a => t==='texte' ? !a.media : (a.media && a.media.type===t)).length
  })).filter(d=>d.value>0);
  const totalReactions = filteredActivites.reduce((s,a)=> s + (a.comments? a.comments.length:0) + (a.reactions ? Object.keys(a.reactions).length : (a.likes? a.likes.length:0)), 0);

  /* --- Documents --- */
  const filteredDocuments = (documents||[]).filter(d => inPeriod(d.date));
  const docTypeData = [...new Set((documents||[]).map(d=>d.type).filter(Boolean))].map(t => ({label:t, value: filteredDocuments.filter(d=>d.type===t).length})).sort((a,b)=>b.value-a.value);

  function exportMembres(){
    const rows = filteredMembres.map(m=>({Matricule:m.matricule, Prenom:m.prenom, Nom:m.nom, Fonction:m.fonction, Departement:m.departement, Statut:m.statut, Telephone:m.telephone, Email:m.email, DateAdhesion:m.dateAdhesion}));
    downloadFile(toCSV(rows, Object.keys(rows[0]||{Matricule:''})), 'rapport_membres.csv', 'text/csv;charset=utf-8');
  }
  function exportCotisations(){
    const rows = filteredPaiements.map(p=>({Recu:p.recuNo, Membre:membreName(p.membreId), Cotisation:typeName(p.typeId), Date:p.date, Du:p.montantDu, Paye:p.montantPaye, Reste:p.reste}));
    downloadFile(toCSV(rows, Object.keys(rows[0]||{Recu:''})), 'rapport_cotisations.csv', 'text/csv;charset=utf-8');
  }
  function exportImpayes(){
    const rows = impayes.map(p=>({Membre:membreName(p.membreId), Cotisation:typeName(p.typeId), Date:p.date, Reste:p.reste}));
    downloadFile(toCSV(rows, Object.keys(rows[0]||{Membre:''})), 'rapport_impayes.csv', 'text/csv;charset=utf-8');
  }
  function exportActivites(){
    const rows = filteredActivites.map(a=>({Date:fmtDate(a.date), Auteur:a.auteurNom, Type: a.media ? (mediaTypeLabel[a.media.type]||a.media.type) : 'Texte', Reactions: a.reactions?Object.keys(a.reactions).length:(a.likes?a.likes.length:0), Commentaires: a.comments?a.comments.length:0}));
    downloadFile(toCSV(rows, Object.keys(rows[0]||{Date:''})), 'rapport_activites.csv', 'text/csv;charset=utf-8');
  }
  function exportDocuments(){
    const rows = filteredDocuments.map(d=>({Titre:d.titre, Type:d.type, Date:d.date, MembreLie: membreName(d.membreId)}));
    downloadFile(toCSV(rows, Object.keys(rows[0]||{Titre:''})), 'rapport_documents.csv', 'text/csv;charset=utf-8');
  }

  return (
    <div>
      <div className="tabs no-print">
        <button className={"tab "+(tab==='membres'?'active':'')} onClick={()=>setTab('membres')}>Membres</button>
        <button className={"tab "+(tab==='cotisations'?'active':'')} onClick={()=>setTab('cotisations')}>Cotisations</button>
        <button className={"tab "+(tab==='impayes'?'active':'')} onClick={()=>setTab('impayes')}>Impayés</button>
        <button className={"tab "+(tab==='financier'?'active':'')} onClick={()=>setTab('financier')}>Financier</button>
        <button className={"tab "+(tab==='activites'?'active':'')} onClick={()=>setTab('activites')}>Activités</button>
        <button className={"tab "+(tab==='documents'?'active':'')} onClick={()=>setTab('documents')}>Documents</button>

/* ---------------------------- Paramètres ---------------------------- */
function Parametres({settings, setSettings, membres, types, paiements, activites, documents}){
  const [tab, setTab] = useState('general');
  const [form, setForm] = useState(settings);
  const [flash, setFlash] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  function save(next){
    const toSave = next || form;
    setSettings(toSave);
    setFlash(true);
    setTimeout(()=>setFlash(false), 1800);
  }

  function exportBackup(){
    const backup = { settings, membres, cotisation_types: types, paiements, activites, documents };
    downloadFile(JSON.stringify(backup, null, 2), 'sauvegarde_cercle.json', 'application/json');
  }
  async function importBackup(e){
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const data = JSON.parse(reader.result);
        if(!confirm("Cette sauvegarde va remplacer les données partagées vues par tous les membres connectés. Continuer ?")) return;
        if(data.settings) await DB.setSettings(data.settings);
        if(data.membres) await DB.sync('membres', [], data.membres);
        if(data.cotisation_types) await DB.sync('cotisation_types', [], data.cotisation_types);
        if(data.paiements) await DB.sync('paiements', [], data.paiements);
        if(data.activites) await DB.sync('activites', [], data.activites);
        if(data.documents) await DB.sync('documents', [], data.documents);
        showToast('Sauvegarde restaurée. La page va se recharger.', 'success');
        setTimeout(()=>window.location.reload(), 1200);
      }catch(err){ showToast('Fichier invalide.'); }
    };
    reader.readAsText(f);
  }
  async function resetAllData(){
    if(!confirm("Cette action supprime DÉFINITIVEMENT les données partagées de tous les membres (membres, paiements, activités, documents) et ne peut pas être annulée. Continuer ?")) return;
    if(!confirm("Dernière confirmation : vraiment tout effacer pour tout le monde ?")) return;
    for(const t of TABLES_LISTES) await cercleSupabase.from(t).delete().neq('id','__none__');
    window.location.reload();
  }

  return (
    <div>
      <div className="tabs no-print">
        <button className={"tab "+(tab==='general'?'active':'')} onClick={()=>setTab('general')}>Général</button>
        <button className={"tab "+(tab==='apparence'?'active':'')} onClick={()=>setTab('apparence')}>Apparence</button>
        <button className={"tab "+(tab==='donnees'?'active':'')} onClick={()=>setTab('donnees')}>Données</button>
      </div>

      {tab==='general' && (
        <div className="card card-pad" style={{maxWidth:640}}>
          <div className="section-title">Informations du groupe</div>
          <div className="logo-upload">
            {form.logo
              ? <img className="logo-preview" src={form.logo} alt="Logo"/>
              : <div className="logo-preview-fallback">{(form.nomAssociation||'C').slice(0,1)}</div>}
            <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
              <label className="btn btn-outline btn-sm">
                Changer le logo
                <input type="file" accept="image/*" style={{display:'none'}} onChange={async e=>{
                  const f=e.target.files[0]; if(!f) return;
                  try{ const url = await uploadToStorage(f, 'settings'); set('logo', url); }
                  catch(err){ showToast("Échec de l'envoi du logo."); }
                }}/>
              </label>
              {form.logo && <button className="btn btn-outline btn-sm" onClick={()=>set('logo','')}>Retirer</button>}
            </div>
          </div>
          <div className="two-col">
            <Field label="Nom du groupe / association"><input className="input" value={form.nomAssociation||''} onChange={e=>set('nomAssociation', e.target.value)}/></Field>
            <Field label="Sigle"><input className="input" value={form.sigle||''} onChange={e=>set('sigle', e.target.value)}/></Field>
          </div>
          <Field label="Objet / description">
            <textarea className="textarea" value={form.description||''} onChange={e=>set('description', e.target.value)} placeholder="Ex. Association d'entraide et de solidarité entre membres"/>
          </Field>
          <Field label="Devise / phrase d'engagement" hint="Affichée en exergue sur l'écran de connexion et le tableau de bord">
            <input className="input" value={form.motto||''} onChange={e=>set('motto', e.target.value)} placeholder="Ex. Unis aujourd'hui, engagés pour demain, bâtisseurs de l'avenir."/>
          </Field>
          <Field label="Valeurs" hint="Séparées par des virgules">
            <input className="input" value={form.valeurs||''} onChange={e=>set('valeurs', e.target.value)} placeholder="Ex. Unité, Respect, Transparence, Responsabilité, Solidarité"/>
          </Field>
          <div className="two-col">
            <Field label="Monnaie"><input className="input" value={form.devise||''} onChange={e=>set('devise', e.target.value)}/></Field>
            <Field label="Téléphone"><input className="input" value={form.telephone||''} onChange={e=>set('telephone', e.target.value)}/></Field>
          </div>
          <div className="two-col">
            <Field label="Email de contact"><input className="input" type="email" value={form.email||''} onChange={e=>set('email', e.target.value)}/></Field>
            <Field label="Site web"><input className="input" value={form.siteWeb||''} onChange={e=>set('siteWeb', e.target.value)}/></Field>
          </div>
          <Field label="Adresse"><input className="input" value={form.adresse||''} onChange={e=>set('adresse', e.target.value)}/></Field>
          <button className="btn btn-primary" onClick={()=>save()}>Enregistrer les paramètres</button>
          {flash && <span className="save-flash">✓ Enregistré</span>}
        </div>
      )}

      {tab==='apparence' && (
        <div className="card card-pad" style={{maxWidth:480}}>
          <div className="section-title">Couleurs du groupe</div>
          <p style={{fontSize:13, color:'var(--muted)', marginTop:0}}>Personnalisez les couleurs principales utilisées dans l'application (boutons, accents, mise en avant).</p>
          <div className="two-col">
            <Field label="Couleur principale">
              <div className="color-field">
                <input type="color" value={form.couleurPrimaire||'#C2540A'} onChange={e=>set('couleurPrimaire', e.target.value)}/>
                <span className="mono" style={{fontSize:12, color:'var(--muted)'}}>{(form.couleurPrimaire||'#C2540A').toUpperCase()}</span>
              </div>
            </Field>
            <Field label="Couleur d'accent">
              <div className="color-field">
                <input type="color" value={form.couleurAccent||'#E8A33D'} onChange={e=>set('couleurAccent', e.target.value)}/>
                <span className="mono" style={{fontSize:12, color:'var(--muted)'}}>{(form.couleurAccent||'#E8A33D').toUpperCase()}</span>
              </div>
            </Field>
          </div>
          <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={()=>save()}>Appliquer</button>
            <button className="btn btn-outline" onClick={()=>{ const next={...form, couleurPrimaire:'#C2540A', couleurAccent:'#E8A33D'}; setForm(next); save(next); }}>Réinitialiser les couleurs</button>
          </div>
          {flash && <span className="save-flash">✓ Enregistré</span>}
        </div>
      )}

      {tab==='donnees' && (
        <div className="grid grid-2">
          <div className="card card-pad">
            <div className="section-title">Sauvegarde des données</div>
            <p style={{fontSize:13, color:'var(--muted)', marginTop:0}}>Les données sont stockées localement dans ce navigateur. Exportez régulièrement une sauvegarde pour éviter toute perte.</p>
            <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
              <button className="btn btn-outline" onClick={exportBackup}>⇩ Exporter une sauvegarde</button>
              <label className="btn btn-outline">
                ⇧ Importer une sauvegarde
                <input type="file" accept="application/json" style={{display:'none'}} onChange={importBackup}/>
              </label>
            </div>
          </div>
          <div className="card card-pad danger-zone">
            <div className="section-title" style={{color:'var(--danger)'}}>Zone sensible</div>
            <p style={{fontSize:13, color:'var(--muted)', marginTop:0}}>Réinitialise complètement l'application : toutes les données locales seront supprimées définitivement.</p>
            <button className="btn btn-danger" onClick={resetAllData}>Réinitialiser toutes les données</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------- App shell ---------------------------- */
function App(){
  const [ready, setReady] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [session, setSession] = useState(null);
  const [page, setPage] = useState('activites');
  const [dark, setDark] = useState(false);
  const [clock, setClock] = useState(new Date());
  const [userMenuOpen, setUserMenuOpen] = useState(false);
  const [profileModalOpen, setProfileModalOpen] = useState(false);

  const [settings, setSettingsState] = useState({nomAssociation:'Cercle', devise:'FCFA'});
  const [membres, setMembresState] = useState([]);
  const [users, setUsersState] = useState([]);
  const [types, setTypesState] = useState([]);
  const [paiements, setPaiementsState] = useState([]);
  const [activites, setActivitesState] = useState([]);
  const [documents, setDocumentsState] = useState([]);
  const [chatMessages, setChatMessagesState] = useState([]);
  const [lastSeen, setLastSeenState] = useState({feed:'', chat:''});
  const [receiptModal, setReceiptModal] = useState(null);

  // Charge le profil applicatif (app_users) lié au compte Supabase Auth connecté.
  async function loadProfile(authUser){
    if(!authUser) return null;
    const { data, error } = await cercleSupabase.from('app_users').select('id, username, data').eq('id', authUser.id).single();
    if(error || !data) return null;
    return {...data.data, id:data.id, username:data.username};
  }

  async function loadAllTables(){
    const [s, m, u, t, p, a, d, c] = await Promise.all([
      DB.getSettings(),
      DB.list('membres'),
      cercleSupabase.from('app_users').select('id, username, data').then(({data})=>(data||[]).map(r=>({...r.data, id:r.id, username:r.username}))),
      DB.list('cotisation_types'),
      DB.list('paiements'),
      DB.list('activites'),
      DB.list('documents'),
      cercleSupabase.from('chat_messages').select('id, data, created_at').order('created_at', {ascending:true}).limit(200).then(({data})=>(data||[]).map(row=>({...row.data, id:row.id}))),
    ]);
    setSettingsState(s); setMembresState(m); setUsersState(u); setTypesState(t);
    setPaiementsState(p); setActivitesState(a); setDocumentsState(d); setChatMessagesState(c);
  }

  useEffect(()=>{
    let alive = true;
    (async ()=>{
      const { data:{ session: authSession } } = await cercleSupabase.auth.getSession();
      if(!authSession){ window.location.href = 'login.html'; return; }
      const profile = await loadProfile(authSession.user);
      if(!profile || profile.actif===false){
        await cercleSupabase.auth.signOut();
        window.location.href = 'login.html';
        return;
      }
      if(!alive) return;
      setSession(profile);
      try{
        const raw = localStorage.getItem('cercle_lastseen_'+profile.username);
        setLastSeenState(raw ? JSON.parse(raw) : {feed:'', chat:''});
      }catch(e){}
      await loadAllTables();
      if(alive) setReady(true);
    })();

    const { data: authListener } = cercleSupabase.auth.onAuthStateChange((event) => {
      if(event === 'SIGNED_OUT') window.location.href = 'login.html';
    });

    // Synchronisation temps réel : tout changement (venant d'un autre membre connecté
    // ailleurs) recharge la table concernée pour que tout le monde voie la même chose.
    const channel = cercleSupabase.channel('cercle_realtime')
      .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, async ()=>{ if(alive) setSettingsState(await DB.getSettings()); })
      .on('postgres_changes', {event:'*', schema:'public', table:'membres'}, (payload)=>{ if(alive) applyRealtimeRowChange(setMembresState, payload); })
      .on('postgres_changes', {event:'*', schema:'public', table:'app_users'}, (payload)=>{
        if(alive) applyRealtimeRowChange(setUsersState, payload, (row)=>({username:row.username}));
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'cotisation_types'}, (payload)=>{ if(alive) applyRealtimeRowChange(setTypesState, payload); })
      .on('postgres_changes', {event:'*', schema:'public', table:'paiements'}, (payload)=>{ if(alive) applyRealtimeRowChange(setPaiementsState, payload); })
      .on('postgres_changes', {event:'*', schema:'public', table:'activites'}, (payload)=>{ if(alive) applyRealtimeRowChange(setActivitesState, payload); })
      .on('postgres_changes', {event:'*', schema:'public', table:'documents'}, (payload)=>{ if(alive) applyRealtimeRowChange(setDocumentsState, payload); })
      .on('postgres_changes', {event:'*', schema:'public', table:'chat_messages'}, async ()=>{
        const { data } = await cercleSupabase.from('chat_messages').select('id, data, created_at').order('created_at', {ascending:true}).limit(200);
        if(alive) setChatMessagesState((data||[]).map(row=>({...row.data, id:row.id})));
      })
      .subscribe();

    return ()=>{ alive = false; authListener.subscription.unsubscribe(); cercleSupabase.removeChannel(channel); };
  }, []);

  // Si la synchronisation vers Supabase échoue (droits insuffisants, réseau…),
  // on prévient l'utilisateur et on recharge les vraies données du serveur au
  // lieu de laisser l'interface afficher un état local qui n'a jamais été
  // enregistré (c'est ce qui donnait l'impression qu'un élément supprimé
  // "revenait" tout seul).
  function syncOrRevert(table, prevList, nextList, setLocalState){
    DB.sync(table, prevList, nextList).catch(async (err)=>{
      showToast("Cette modification n'a pas pu être enregistrée (droits insuffisants ou erreur réseau). Les données affichées vont être resynchronisées.");
      setLocalState(await DB.list(table));
    });
  }

  const setMembres = (v) => { const prev = membres; setMembresState(v); syncOrRevert('membres', prev, v, setMembresState); };
  const setUsers = (v) => {
    const prev = users;
    setUsersState(v);
    // app_users : seule la partie "data" (rôle, poste, membre lié, accès, statut) est modifiable ici,
    // les comptes eux-mêmes sont créés via l'inscription sur login.html.
    (async () => {
      try {
        for (const u of v) {
          const before = prev.find(x=>x.id===u.id);
          if(!before) continue; // pas de création de compte depuis l'app
          const {id, username, ...rest} = u;
          const { error } = await cercleSupabase.from('app_users').update({data:rest, updated_at:new Date().toISOString()}).eq('id', id);
          if(error) throw error;
        }
        const removed = prev.filter(u => !v.find(x=>x.id===u.id));
        for (const u of removed) {
          // .select() après delete() pour savoir si une ligne a VRAIMENT été supprimée :
          // si la policy RLS "DELETE" ne matche pas, Supabase répond succès + 0 ligne,
          // sans erreur — c'est ce qui donnait l'impression que l'utilisateur "revenait".
          const { data, error } = await cercleSupabase.from('app_users').delete().eq('id', u.id).select('id');
          if(error) throw error;
          if(!data || data.length === 0){
            throw new Error(`Suppression de l'utilisateur "${u.username}" refusée par la base (RLS).`);
          }
        }
      } catch(err){
        console.error('setUsers sync', err);
        showToast("Cette modification n'a pas pu être enregistrée (droits insuffisants ou erreur réseau). Les données affichées vont être resynchronisées.");
        const { data } = await cercleSupabase.from('app_users').select('id, username, data');
        setUsersState((data||[]).map(r=>({...r.data, id:r.id, username:r.username})));
      }
    })();
  };
  const setTypes = (v) => { const prev = types; setTypesState(v); syncOrRevert('cotisation_types', prev, v, setTypesState); };
  const setPaiements = (v) => { const prev = paiements; setPaiementsState(v); syncOrRevert('paiements', prev, v, setPaiementsState); };
  const setActivites = (v) => { const prev = activites; setActivitesState(v); syncOrRevert('activites', prev, v, setActivitesState); };
  const setDocuments = (v) => { const prev = documents; setDocumentsState(v); syncOrRevert('documents', prev, v, setDocumentsState); };
  const setSettings = (v) => { setSettingsState(v); DB.setSettings(v); };

  async function handleLogout(){ await cercleSupabase.auth.signOut(); window.location.href = 'login.html'; }
  // Met à jour la session locale et la liste des utilisateurs après modification du profil.
  function handleProfileSaved(updated){
    setSession(updated);
    setUsersState(prev => prev.map(u => u.id===updated.id ? {...u, username:updated.username, photo:updated.photo} : u));
  }
  function goTo(p){ setPage(p); }
  function markSeen(kind){
    setLastSeenState(prev=>{
      const next = {...prev, [kind]: new Date().toISOString()};
      try{ localStorage.setItem('cercle_lastseen_'+session.username, JSON.stringify(next)); }catch(e){}
      return next;
    });
  }

  useEffect(()=>{
    if(settings.couleurPrimaire) document.documentElement.style.setProperty('--primary', settings.couleurPrimaire);
    if(settings.couleurAccent) document.documentElement.style.setProperty('--gold', settings.couleurAccent);
  }, [settings.couleurPrimaire, settings.couleurAccent]);

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  useEffect(()=>{
    const t = setInterval(()=>setClock(new Date()), 1000);
    return ()=>clearInterval(t);
  }, []);

  // Filet de sécurité pour la synchronisation : sur mobile ou réseau instable, la connexion
  // temps réel (websocket) peut se couper sans prévenir (mise en veille, changement de réseau…),
  // ce qui retarde l'arrivée des nouvelles données jusqu'à un rechargement manuel de la page.
  // On réactualise donc automatiquement toutes les données à intervalle régulier, et
  // immédiatement quand l'app revient au premier plan.
  useEffect(()=>{
    if(!ready) return;
    let polling = false;
    async function refresh(){
      if(polling) return;
      polling = true;
      setSyncing(true);
      try{ await loadAllTables(); } finally { polling = false; setSyncing(false); }
    }
    const interval = setInterval(refresh, 20000);
    function onVisible(){ if(document.visibilityState==='visible') refresh(); }
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', refresh);
    return ()=>{ clearInterval(interval); document.removeEventListener('visibilitychange', onVisible); window.removeEventListener('focus', refresh); };
  }, [ready]);

  if(!ready || !session) return null;

  const accessibleModuleIds = computeAccessibleModuleIds(session);
  const visibleNav = NAV.filter(n => accessibleModuleIds.includes(n.id) && (n.id!=='dashboard' || session.role!=='membre'));
  const currentNav = NAV.find(n=>n.id===page) || NAV[0];
  const currentMembre = membres.find(m=>m.id===session.membreId);
  const canEdit = ['admin','responsable','secretaire'].includes(session.role);

  // Notifications globales (tchat + publications), visibles même en dehors de la page Activités.
  const meId = currentMembre ? 'm:'+currentMembre.id : 'u:'+session.username;
  const unreadChat = chatMessages.filter(m => m.auteurId!==meId && (!m.destinataireId || m.destinataireId===meId) && (!lastSeen.chat || m.date > lastSeen.chat)).length;
  const unreadFeed = activites.reduce((n,a)=>{
    let c = (a.auteurId!==meId && (!lastSeen.feed || a.date>lastSeen.feed)) ? 1 : 0;
    c += (a.comments||[]).filter(cm=>cm.auteurId!==meId && (!lastSeen.feed || cm.date>lastSeen.feed)).length;
    return n+c;
  }, 0);
  const activitesBadge = unreadChat + unreadFeed;

  function renderPage(){
    switch(page){
      case 'dashboard': return <Dashboard settings={settings} currentUser={session} modules={visibleNav.filter(n=>n.id!=='dashboard')} onNavigate={goTo}/>;
      case 'membres': return <Membres membres={membres} setMembres={setMembres} settings={settings} canEdit={session.role!=='membre' && session.role!=='tresorier'} users={users} setUsers={setUsers}/>;
      case 'utilisateurs': return <Utilisateurs users={users} setUsers={setUsers} membres={membres} currentUser={session}/>;
      case 'cotisations': return <CotisationsModule types={types} setTypes={setTypes} settings={settings} paiements={paiements} setPaiements={setPaiements} membres={membres} onOpenReceipt={setReceiptModal} session={session}/>;
      case 'activites': return <Activites activites={activites} setActivites={setActivites} membres={membres} users={users} currentMembre={currentMembre} session={session} chatMessages={chatMessages} setChatMessages={setChatMessagesState} unreadChat={unreadChat} unreadFeed={unreadFeed} onSeenFeed={()=>markSeen('feed')} onSeenChat={()=>markSeen('chat')}/>;
      case 'documents': return <Documents documents={documents} setDocuments={setDocuments} membres={membres}/>;
      case 'rapports': return <Rapports membres={membres} paiements={paiements} types={types} activites={activites} documents={documents} settings={settings}/>;
      case 'parametres': return <Parametres settings={settings} setSettings={setSettings} membres={membres} types={types} paiements={paiements} activites={activites} documents={documents}/>;
      default: return null;
    }
  }

  const timeStr = clock.toLocaleTimeString('fr-FR');

  return (
    <div className="app-shell">
      <div className={"sync-indicator "+(syncing?'active':'')} aria-hidden="true"></div>
      <ToastHost/>
      <aside className="sidebar no-print">
        <div className="sidebar-brand">
          <div className="brand-seal">
            {settings.logo
              ? <img src={settings.logo} alt="Logo" style={{width:'100%',height:'100%',borderRadius:'50%',objectFit:'cover'}}/>
              : (settings.nomAssociation||'C').slice(0,1)}
          </div>
          <div className="brand-text">
            <div className="name">{settings.nomAssociation || 'Cercle'}</div>
            <div className="sub">Gestion de groupe</div>
          </div>
        </div>
        <nav className="nav">
          {visibleNav.map(n=>(
            <button key={n.id} className={"nav-item "+(page===n.id?'active':'')} onClick={()=>goTo(n.id)}>
              <span className="nav-icon">{n.icon}</span>{n.label}
              {n.id==='activites' && activitesBadge>0 && <span className="nav-badge">{activitesBadge>9?'9+':activitesBadge}</span>}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="user-chip">
            <div className="user-avatar">
              {(session.photo || (currentMembre && currentMembre.photo))
                ? <img src={session.photo || currentMembre.photo} alt={session.username}/>
                : session.username.slice(0,2).toUpperCase()}
            </div>
            <div>
              <div style={{color:'#fff', fontWeight:600, fontSize:12.5}}>{session.username}</div>
              <div style={{fontSize:11}}>{posteLabel(session.poste)}{session.isAdminTotal ? ' · Admin total' : ''}</div>
            </div>
          </div>
          <button className="logout-btn" onClick={handleLogout}>Se déconnecter</button>
        </div>
      </aside>

      <div className="main">
        <div className="topbar no-print">
          <div className="topbar-left">
            <span className="topbar-brand-icon">{settings.logo ? <img src={settings.logo} alt="" style={{width:22,height:22,borderRadius:6,objectFit:'cover'}}/> : '🤝🏽'}</span>
            <div style={{minWidth:0}}>
              <div className="page-eyebrow">{currentNav.label}</div>
              <div className="page-title">{settings.nomAssociation || 'Cercle'}</div>
              <div className="page-role">{session.username} · {posteLabel(session.poste)}</div>
            </div>
          </div>
          <div className="topbar-right">
            <span className="clock-chip">{timeStr}</span>
            <button className="theme-toggle" onClick={()=>setDark(d=>!d)} aria-label="Basculer le thème" title={dark ? 'Passer en mode clair' : 'Passer en mode sombre'}>
              {dark ? '☀️' : '🌙'}
            </button>
            <div className="avatar-menu-wrap">
              <button className="avatar-trigger" onClick={()=>setUserMenuOpen(v=>!v)}>
                <div className="avatar-circle">
                  {(session.photo || (currentMembre && currentMembre.photo))
                    ? <img src={session.photo || currentMembre.photo} alt={session.username}/>
                    : session.username.slice(0,1).toUpperCase()}
                </div>
                <span className="avatar-caret">▾</span>
              </button>
              {userMenuOpen && (
                <React.Fragment>
                  <div className="avatar-menu-overlay" onClick={()=>setUserMenuOpen(false)}></div>
                  <div className="avatar-dropdown">
                    <div className="head">
                      <div className="head-avatar">
                        {(session.photo || (currentMembre && currentMembre.photo))
                          ? <img src={session.photo || currentMembre.photo} alt={session.username}/>
                          : session.username.slice(0,1).toUpperCase()}
                      </div>
                      <div>
                        <div className="u">{session.username}</div>
                        <div className="r">{roleLabel(session.role)}</div>
                      </div>
                    </div>
                    <button style={{color:'var(--ink)'}} onClick={()=>{setUserMenuOpen(false); setProfileModalOpen(true);}}>Modifier le profil</button>
                    <button onClick={handleLogout}>Se déconnecter</button>
                  </div>
                </React.Fragment>
              )}
            </div>
          </div>
        </div>
        <div className="content">
          {renderPage()}
        </div>

        <nav className="bottom-nav no-print">
          <div className="bottom-nav-track">
            {visibleNav.map(n=>(
              <button key={n.id} className={"bottom-nav-item "+(page===n.id?'active':'')} onClick={()=>goTo(n.id)}>
                <span className="bn-icon">{n.icon}</span>{n.label}
                {n.id==='activites' && activitesBadge>0 && <span className="bn-badge">{activitesBadge>9?'9+':activitesBadge}</span>}
              </button>
            ))}
          </div>
        </nav>
      </div>

      {receiptModal && (
        <Modal title="Reçu de paiement" onClose={()=>setReceiptModal(null)} width="460px">
          <ReceiptView paiement={receiptModal} membres={membres} types={types} settings={settings}/>
        </Modal>
      )}
      {profileModalOpen && (
        <MonProfilModal session={session} onClose={()=>setProfileModalOpen(false)} onSaved={handleProfileSaved}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
