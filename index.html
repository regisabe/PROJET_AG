<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>L'AG — L'Avenir de Gbegbessou</title>
<meta name="description" content="Application de gestion de groupe : membres, cotisations, paiements, activités et documents de L'AG — L'Avenir de Gbegbessou.">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#C2540A">
<link rel="icon" type="image/x-icon" href="./icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">

<!-- iOS "Add to Home Screen" -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L'AG">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#24221D; --muted:#6B6558; --paper:#F7F5EF; --surface:#FFFFFF;
  --border:#E4E0D3; --primary:#C2540A; --primary-light:#E07C2E; --primary-dark:#7A3607;
  --gold:#E8A33D; --gold-light:#F5C878; --danger:#B3452C; --success:#3F7D52;
  --shadow: 0 1px 2px rgba(36,34,29,.06), 0 4px 16px rgba(36,34,29,.06);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#EDE9DD; --muted:#A7A090; --paper:#181712; --surface:#211F19;
  --border:#33312A; --primary:#E07C2E; --primary-light:#F0A35A; --primary-dark:#5C2A05;
  --gold:#F0B24E; --gold-light:#F5C878; --danger:#D96A4C; --success:#5AA173;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 4px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--gold-light);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
a{color:inherit;}

/* ---------- Layout ---------- */
#root{min-height:100vh;}
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:230px; background:var(--primary-dark); color:#EFEAD9; flex-shrink:0;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-brand{padding:22px 20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-seal{
  width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #7A3607 100%);
  display:flex;align-items:center;justify-content:center; color:var(--primary-dark); font-weight:700; font-family:'Fraunces',serif; font-size:15px;
  flex-shrink:0; box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.brand-text .name{font-family:'Fraunces',serif; font-size:17px; font-weight:600; line-height:1.1;}
.brand-text .sub{font-size:10.5px; color:#B9C4B9; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}
.nav{flex:1; overflow-y:auto; padding:14px 10px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
  font-size:13.5px; color:#D9D3C0; text-decoration:none; border:none; background:none; width:100%; text-align:left;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:var(--primary); color:#fff; box-shadow: inset 3px 0 0 var(--gold);}
.nav-icon{width:16px; text-align:center; opacity:.9; font-size:14px;}
.sidebar-footer{padding:14px 16px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:#AEB8AE;}
.user-chip{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--primary); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:600; color:#fff;}
.logout-btn{background:none;border:none;color:#D9D3C0; font-size:12px; text-decoration:underline; padding:0;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--surface); padding:14px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:5;
  border-bottom:1px solid var(--border);
  position:relative;
}
.topbar::after{
  content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px;
  background:linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
.topbar-brand-icon{font-size:22px; line-height:1;}
.page-title{font-size:19px; font-weight:600; display:flex; align-items:center; gap:9px;}
.page-eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700;}
.page-role{font-size:12px; color:var(--muted); margin-top:1px;}
.content{padding:24px 28px 60px; flex:1;}

.topbar-right{display:flex; align-items:center; gap:12px; flex-shrink:0;}
.clock-chip{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); font-weight:600;
  letter-spacing:.02em;
}
.theme-toggle{
  width:40px; height:32px; border-radius:99px; border:1px solid var(--border); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;
}
.theme-toggle:hover{border-color:var(--gold);}
.avatar-menu-wrap{position:relative; flex-shrink:0;}
.avatar-trigger{
  display:flex; align-items:center; gap:6px; background:none; border:none; padding:2px; border-radius:99px;
}
.avatar-circle{
  width:36px; height:36px; border-radius:50%; background:linear-gradient(155deg, var(--primary), var(--primary-light));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
}
.avatar-caret{font-size:10px; color:var(--muted);}
.avatar-dropdown{
  position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,.16); min-width:190px; z-index:40; overflow:hidden;
  animation:dropIn .12s ease;
}
@keyframes dropIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}
.avatar-dropdown .head{padding:12px 14px; border-bottom:1px solid var(--border);}
.avatar-dropdown .head .u{font-weight:700; font-size:13.5px;}
.avatar-dropdown .head .r{font-size:11.5px; color:var(--muted); margin-top:1px;}
.avatar-dropdown button{
  display:block; width:100%; text-align:left; padding:10px 14px; font-size:13px; background:none; border:none; color:var(--danger); font-weight:600;
}
.avatar-dropdown button:hover{background:var(--paper);}
.avatar-menu-overlay{position:fixed; inset:0; z-index:35;}

/* ---------- Generic UI ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius:7px; border:1px solid transparent;
  padding:8px 14px; font-size:13px; font-weight:600; transition:all .12s ease;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-light);}
.btn-gold{background:var(--gold); color:#2B2004;}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent; border-color:var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-danger{background:transparent; color:var(--danger); border-color:#E7C7BA;}
.btn-danger:hover{background:#FBEDE7;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow);}
.card-pad{padding:20px;}

.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.stat-card .value{font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-top:6px; color:var(--primary-dark);}
.stat-card .delta{font-size:11.5px; color:var(--muted); margin-top:4px;}
.stat-card .accent-bar{position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold);}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:600; letter-spacing:.02em;}
.badge-green{background:#E4F1E6; color:var(--success);}
.badge-red{background:#FBEAE3; color:var(--danger);}
.badge-gold{background:#FBF1D9; color:#8A6A16;}
.badge-gray{background:#EEEBE1; color:var(--muted);}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:2px solid var(--border);}
td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:hover{background:#FBFAF6;}
.table-wrap{overflow-x:auto;}

.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.search-input{
  border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13px; min-width:220px; background:var(--surface);
}
.select, .input, .textarea{
  border:1px solid var(--border); border-radius:8px; padding:8px 11px; font-size:13.5px; width:100%; background:var(--surface); color:var(--ink);
}
.textarea{resize:vertical; min-height:70px;}
label.field-label{font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; display:block;}
.field{margin-bottom:14px;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(24,22,17,.45); display:flex; align-items:center; justify-content:center;
  z-index:50; padding:20px; backdrop-filter:blur(1px);
}
.modal{background:var(--surface); border-radius:14px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-header{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
.modal-body{padding:20px 22px;}
.modal-footer{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
.icon-btn{background:none;border:none;font-size:18px;color:var(--muted); line-height:1;}
.icon-btn:hover{color:var(--ink);}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state .glyph{font-size:34px; margin-bottom:10px;}
.empty-state .title{font-weight:600; color:var(--ink); margin-bottom:4px;}

.avatar-photo{width:38px;height:38px;border-radius:50%; object-fit:cover; background:var(--border); flex-shrink:0;}
.avatar-fallback{width:38px;height:38px;border-radius:50%; background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; font-size:13px; font-weight:600; flex-shrink:0;}

/* Membership card - signature element */
.member-card{
  width:340px; border-radius:16px; padding:0; position:relative; overflow:hidden;
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%);
  color:#fff; box-shadow:0 12px 30px rgba(18,53,48,.35);
}
.member-card::before{
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(circle at 90% 8%, rgba(201,150,43,.28), transparent 45%);
}
.member-card-top{padding:16px 18px 10px; display:flex; justify-content:space-between; align-items:flex-start; position:relative;}
.member-card-org{font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:#C9D6C9;}
.member-card-org b{color:#fff;}
.member-card-seal{
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
}
.member-card-body{display:flex; gap:14px; padding:6px 18px 14px; position:relative;}
.member-card-photo{width:64px;height:64px;border-radius:10px; object-fit:cover; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); flex-shrink:0;}
.member-card-name{font-family:'Fraunces',serif; font-weight:600; font-size:16px; line-height:1.15;}
.member-card-role{font-size:11.5px; color:#D9E4D6; margin-top:2px;}
.member-card-mat{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold-light); margin-top:6px; letter-spacing:.03em;}
.member-card-strip{
  display:flex; align-items:center; justify-content:space-between; padding:10px 18px; background:rgba(0,0,0,.18);
  border-top:1px dashed rgba(255,255,255,.35); position:relative;
}
.member-card-strip .stub-dot{position:absolute; width:14px;height:14px;border-radius:50%; background:var(--paper); top:-7px;}
.member-card-strip .stub-dot.l{left:-7px;} .member-card-strip .stub-dot.r{right:-7px;}
.member-card-status{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#D9E4D6;}
.member-card img.qr{width:52px;height:52px; border-radius:6px; background:#fff; padding:3px;}

/* Receipt - carnet à souche style */
.receipt{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  position:relative; padding:22px 24px;
}
.receipt::before, .receipt::after{
  content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--paper); border:1px solid var(--border);
  top:50%; transform:translateY(-50%);
}
.receipt::before{left:-9px;} .receipt::after{right:-9px;}
.receipt-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px dashed var(--border); padding-bottom:12px; margin-bottom:12px;}
.receipt-no{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--gold); font-weight:600;}
.receipt-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0;}
.receipt-row .k{color:var(--muted);}
.receipt-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:2px dashed var(--border); font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--primary-dark);}

.bar-chart{display:flex; align-items:flex-end; gap:10px; height:160px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-fill{width:100%; border-radius:5px 5px 0 0; background:var(--primary); position:relative; min-height:3px;}
.bar-fill.gold{background:var(--gold);}
.bar-label{font-size:10.5px; color:var(--muted); text-align:center;}
.bar-val{font-size:11px; font-weight:600; color:var(--ink);}

.progress-track{width:100%; height:8px; border-radius:99px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--success); border-radius:99px;}

.login-shell{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr;}
.login-brandpanel{
  background:linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, var(--primary-light) 100%);
  color:#fff; padding:56px 52px; display:flex; flex-direction:column; justify-content:center; gap:20px;
  position:relative; overflow:hidden;
}
.login-brandpanel::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(circle at 88% 8%, rgba(201,150,43,.30), transparent 45%), radial-gradient(circle at 8% 94%, rgba(255,255,255,.08), transparent 40%);
}
.login-brand-seal{
  width:68px; height:68px; border-radius:18px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 14px 28px rgba(0,0,0,.28);
  display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:28px;
  color:var(--primary-dark); position:relative; z-index:1;
}
.login-brand-name{font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1.15; position:relative; z-index:1;}
.login-brand-sigle{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:#D9E4D6; margin-top:4px; position:relative; z-index:1;}
.login-brand-desc{font-size:14px; line-height:1.65; color:#E7EFE6; max-width:420px; position:relative; z-index:1;}
.login-brand-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.5; color:var(--gold-light);
  max-width:420px; position:relative; z-index:1; border-left:2px solid var(--gold); padding-left:12px;
}
.login-brand-values{display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1;}
.value-pill{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:rgba(255,255,255,.12); color:#EAF0E8; border:1px solid rgba(255,255,255,.18);
}
.login-brand-meta{display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:1;}
.login-brand-meta-row{display:flex; align-items:center; gap:11px; font-size:13px; color:#EAF0E8;}
.login-brand-meta-row .ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.13); display:flex;align-items:center;justify-content:center; font-size:13px; flex-shrink:0;}
.login-brand-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:#C9D6C9; position:relative; z-index:1; margin-top:auto; padding-top:18px;
}
.dashboard-motto{
  font-family:'Fraunces',serif; font-style:italic; font-size:14.5px; color:var(--primary-dark); margin-top:6px;
  border-left:2px solid var(--gold); padding-left:11px;
}
.dashboard-values{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.value-pill-light{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:99px; font-size:11px; font-weight:600;
  letter-spacing:.03em; background:var(--surface); border:1px solid var(--border); color:var(--muted);
}

.login-formpanel{background:var(--paper); display:flex; align-items:center; justify-content:center; padding:32px;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:36px 32px;}
.login-title{font-family:'Fraunces',serif; font-size:23px; font-weight:600; margin-bottom:2px;}
.login-sub{font-size:12.5px; color:var(--muted); margin-bottom:26px;}
.demo-hint{margin-top:18px; font-size:11.5px; color:var(--muted); background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:10px 12px; line-height:1.6;}
.login-switch{margin-top:16px; text-align:center; font-size:12.5px; color:var(--muted);}
.link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px; padding:0; text-decoration:underline;}
.link-btn:hover{color:var(--primary-light);}

@media(max-width:860px){
  .login-shell{grid-template-columns:1fr; grid-auto-rows:min-content;}
  .login-brandpanel{padding:36px 28px; gap:14px;}
  .login-brand-name{font-size:24px;}
  .login-brand-desc{display:none;}
  .login-brand-badge{display:none;}
  .login-formpanel{padding:28px 20px 44px;}
}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab.active{color:var(--primary-dark); border-bottom-color:var(--gold);}

.check-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
.check-row:last-child{border-bottom:none;}

@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .print-only{display:block !important;}
}
.print-only{display:none;}

.hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
.divider{height:1px; background:var(--border); margin:16px 0;}
.section-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 12px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.two-col{grid-template-columns:1fr;}}
.pill-tabs{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:6px 12px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--muted);}
.pill.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* ---------- Dashboard modules ---------- */
.dashboard-hero{margin-bottom:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.dashboard-hero .hello{font-family:'Fraunces',serif; font-size:23px; font-weight:600;}
.dashboard-hero .date{font-size:12.5px; color:var(--muted); margin-top:3px; text-transform:capitalize;}
.module-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
@media(min-width:720px){.module-grid{grid-template-columns:repeat(3, 1fr);}}
@media(min-width:1100px){.module-grid{grid-template-columns:repeat(4, 1fr);}}
.module-card{
  background:var(--surface); border:1px solid var(--border); border-top:4px solid var(--accent, var(--border));
  border-radius:16px; padding:26px 16px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center;
  font:inherit; color:inherit; width:100%; min-height:150px; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}
.module-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(36,34,29,.14);}
.module-card:active{transform:translateY(-1px);}
.module-icon{font-size:36px; line-height:1;}
.module-title{font-family:'Fraunces',serif; font-size:15px; font-weight:700;}

/* ---------- Bottom mobile nav ---------- */
.bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:var(--surface); border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.bottom-nav::-webkit-scrollbar{display:none;}
.bottom-nav-track{display:flex; gap:2px; min-width:max-content;}
.bottom-nav-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  background:none; border:none; padding:6px 12px; min-width:64px; border-radius:10px;
  font-size:10.5px; color:var(--muted); font-weight:600;
}
.bottom-nav-item .bn-icon{font-size:19px; line-height:1;}
.bottom-nav-item.active{color:var(--primary);}
.bottom-nav-item.active .bn-icon{transform:translateY(-1px);}

/* ---------- Settings ---------- */
.logo-upload{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.logo-preview{width:56px;height:56px;border-radius:12px; object-fit:cover; background:var(--paper); border:1px solid var(--border);}
.logo-preview-fallback{
  width:56px;height:56px;border-radius:12px;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 65%, #7A3607 100%);
  display:flex;align-items:center;justify-content:center; color:var(--primary-dark); font-family:'Fraunces',serif; font-weight:700; font-size:21px; flex-shrink:0;
}
.color-field{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--surface);}
.color-field input[type=color]{width:34px; height:34px; border:none; padding:0; background:none; border-radius:6px; cursor:pointer;}
.danger-zone{border:1px solid #E7C7BA !important; background:#FBEDE7 !important;}
.save-flash{margin-left:10px; font-size:12.5px; color:var(--success); font-weight:600;}

/* ---------- Responsive overhaul ---------- */
@media(max-width:900px){
  .sidebar{display:none;}
  .bottom-nav{display:block;}
  .main{padding-bottom:70px;}
  .page-role{display:none;}
  .topbar{padding:12px 16px;}
  .content{padding:16px 16px 24px;}
  .page-title{font-size:17px;}
  .page-eyebrow{font-size:10px;}
}
@media(max-width:640px){
  .content{padding:14px 12px 20px;}
  .card-pad{padding:16px;}
  .grid{gap:12px;}
  .toolbar{flex-direction:column; align-items:stretch;}
  .toolbar .search-input{width:100%; min-width:0;}
  .btn{padding:10px 14px; font-size:13.5px;}
  .btn-sm{padding:7px 11px; font-size:12px;}
  input.input, select.select, textarea.textarea, .search-input{font-size:16px; padding:10px 12px;}
  .modal-overlay{padding:0; align-items:flex-end;}
  .modal{max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:92dvh;}
  .modal-header{padding:16px 18px;}
  .modal-body{padding:16px 18px;}
  .modal-footer{padding:14px 18px; flex-wrap:wrap;}
  table{font-size:12.5px;}
  th,td{padding:9px 8px;}
  .module-card{padding:20px 12px; min-height:130px;}
  .module-icon{font-size:30px;}
  .dashboard-hero .hello{font-size:19px;}
  .clock-chip{font-size:11.5px;}
}
@media(max-width:360px){
  .module-grid{grid-template-columns:1fr 1fr; gap:10px;}
}

</style>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
